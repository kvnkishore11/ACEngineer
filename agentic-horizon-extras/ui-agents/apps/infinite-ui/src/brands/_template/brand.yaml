name: Acme Corp
tagline: "Building the future, one prototype at a time"
tone: playful, bold, experimental
audience: designers and developers

identity:
  mission: "Empower creators with rapid prototyping tools"
  description: |
    Acme Corp is a template brand identity used as the copy source
    for new brands in the Infinite UI system. It demonstrates all
    available brand configuration fields with vivid placeholder values.
  keywords:
    - "prototyping"
    - "design systems"
    - "UI generation"
  voice: "enthusiastic, clear, action-oriented"
  avoid:
    - "corporate jargon"
    - "passive voice"

palette:
  primary: "#ff1493"
  secondary: "#32cd32"
  accent: "#ffd700"
  background: "#1a1b26"
  bg-secondary: "#16161e"
  surface: "#24283b"
  text: "#c0caf5"
  muted: "#565f89"
  border: "#3b4261"
  overlay: "rgba(0, 0, 0, 0.6)"
  error: "#f7768e"
  warning: "#e0af68"
  success: "#9ece6a"

typography:
  heading: "Inter"
  body: "Inter"
  mono: "JetBrains Mono"
  scale:
    h1: { size: "3rem", weight: 700, tracking: "-0.02em" }
    h2: { size: "2rem", weight: 600, tracking: "-0.01em" }
    h3: { size: "1.5rem", weight: 600 }
    body: { size: "1rem", weight: 400, line-height: 1.6 }
    small: { size: "0.875rem", weight: 400 }
    caption: { size: "0.75rem", weight: 500, tracking: "0.05em" }

spacing:
  unit: "0.5rem"
  radius-sm: "0.375rem"
  radius-md: "0.75rem"
  radius-lg: "1rem"
  container-max: "1200px"

breakpoints:
  sm: "640px"
  md: "768px"
  lg: "1024px"
  xl: "1280px"

shadows:
  sm: "0 1px 2px rgba(0, 0, 0, 0.3)"
  md: "0 4px 6px rgba(0, 0, 0, 0.3)"
  lg: "0 10px 15px rgba(0, 0, 0, 0.3)"

motion:
  duration-fast: "150ms"
  duration-normal: "300ms"
  duration-slow: "500ms"
  easing: "cubic-bezier(0.4, 0, 0.2, 1)"

assets:
  logo: "public/assets/logo.svg"
  favicon: "public/assets/favicon.svg"
  media:
    - path: "public/assets/hero-placeholder.png"
      description: "Template hero placeholder image"
    - path: "public/assets/og-card.png"
      description: "Open Graph social card template"
