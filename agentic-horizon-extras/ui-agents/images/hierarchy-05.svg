<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .subtitle { font-size: 13px; fill: #565f89; }
      .section-title { font-size: 14px; font-weight: 700; fill: #c0caf5; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
      .yaml-key { font-size: 12px; fill: #7aa2f7; }
      .yaml-val { font-size: 12px; fill: #72f1b8; }
      .token-name { font-size: 12px; fill: #36f9f6; }
      .css-prop { font-size: 11px; fill: #ff9e64; }
      .css-val { font-size: 11px; fill: #c0caf5; }
    </style>
    <marker id="token-arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7aa2f7"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#1a1b26"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" class="title">Zero Hardcoded Values -- Brand Tokens Flow</text>
  <text x="600" y="58" text-anchor="middle" class="subtitle">brand.yaml -> Pinia store -> CSS custom properties -> Vue components</text>

  <!-- ===== CARD 1: brand.yaml ===== -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="280" height="470" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="35" rx="10" fill="#7aa2f7" opacity="0.15"/>
    <rect x="0" y="25" width="280" height="10" fill="#7aa2f7" opacity="0.15"/>
    <text x="140" y="24" text-anchor="middle" class="section-title" fill="#7aa2f7">brand.yaml</text>

    <!-- Palette section -->
    <text x="20" y="60" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">palette:</text>

    <text x="30" y="82" class="yaml-key mono">primary:</text>
    <text x="120" y="82" class="yaml-val mono">"#7aa2f7"</text>
    <rect x="200" y="70" width="14" height="14" rx="3" fill="#7aa2f7"/>

    <text x="30" y="102" class="yaml-key mono">secondary:</text>
    <text x="130" y="102" class="yaml-val mono">"#72f1b8"</text>
    <rect x="200" y="90" width="14" height="14" rx="3" fill="#72f1b8"/>

    <text x="30" y="122" class="yaml-key mono">accent:</text>
    <text x="110" y="122" class="yaml-val mono">"#ff9e64"</text>
    <rect x="200" y="110" width="14" height="14" rx="3" fill="#ff9e64"/>

    <text x="30" y="142" class="yaml-key mono">bg:</text>
    <text x="80" y="142" class="yaml-val mono">"#1a1b26"</text>
    <rect x="200" y="130" width="14" height="14" rx="3" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>

    <text x="30" y="162" class="yaml-key mono">text:</text>
    <text x="90" y="162" class="yaml-val mono">"#c0caf5"</text>
    <rect x="200" y="150" width="14" height="14" rx="3" fill="#c0caf5"/>

    <!-- Typography section -->
    <line x1="20" y1="180" x2="260" y2="180" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="200" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">typography:</text>

    <text x="30" y="222" class="yaml-key mono">heading:</text>
    <text x="110" y="222" class="yaml-val mono">"Inter"</text>

    <text x="30" y="242" class="yaml-key mono">body:</text>
    <text x="90" y="242" class="yaml-val mono">"Inter"</text>

    <!-- Spacing section -->
    <line x1="20" y1="260" x2="260" y2="260" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="280" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">spacing:</text>

    <text x="30" y="302" class="yaml-key mono">unit:</text>
    <text x="80" y="302" class="yaml-val mono">"0.5rem"</text>

    <!-- Motion section -->
    <line x1="20" y1="320" x2="260" y2="320" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="340" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">motion:</text>

    <text x="30" y="362" class="yaml-key mono">duration-fast:</text>
    <text x="165" y="362" class="yaml-val mono">"150ms"</text>

    <text x="30" y="382" class="yaml-key mono">duration-normal:</text>
    <text x="185" y="382" class="yaml-val mono">"300ms"</text>

    <text x="30" y="402" class="yaml-key mono">easing:</text>
    <text x="105" y="402" class="yaml-val mono">"ease-out"</text>

    <!-- Shadows -->
    <line x1="20" y1="420" x2="260" y2="420" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>
    <text x="20" y="440" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">shadows:</text>
    <text x="30" y="458" class="yaml-key mono">sm:</text>
    <text x="60" y="458" class="yaml-val mono">"0 1px 2px..."</text>
  </g>

  <!-- Arrow 1→2 -->
  <g transform="translate(320, 300)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#7aa2f7" stroke-width="2" marker-end="url(#token-arrow)"/>
    <text x="32" y="-10" text-anchor="middle" font-size="10" font-weight="600" fill="#7aa2f7" font-family="Inter, system-ui, sans-serif">Pinia</text>
    <text x="32" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#7aa2f7" font-family="Inter, system-ui, sans-serif">brand store</text>
  </g>

  <!-- ===== CARD 2: CSS Custom Properties ===== -->
  <g transform="translate(395, 85)">
    <rect x="0" y="0" width="290" height="470" rx="10" fill="#1a1b26" stroke="#36f9f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="35" rx="10" fill="#36f9f6" opacity="0.15"/>
    <rect x="0" y="25" width="290" height="10" fill="#36f9f6" opacity="0.15"/>
    <text x="145" y="24" text-anchor="middle" class="section-title" fill="#36f9f6">CSS Custom Properties</text>

    <text x="20" y="60" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">:root mapped tokens</text>

    <!-- Palette tokens -->
    <text x="20" y="85" class="token-name mono">--brand-primary</text>
    <rect x="200" y="73" width="14" height="14" rx="3" fill="#7aa2f7"/>
    <text x="220" y="85" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">#7aa2f7</text>

    <text x="20" y="107" class="token-name mono">--brand-secondary</text>
    <rect x="200" y="95" width="14" height="14" rx="3" fill="#72f1b8"/>

    <text x="20" y="129" class="token-name mono">--brand-accent</text>
    <rect x="200" y="117" width="14" height="14" rx="3" fill="#ff9e64"/>

    <text x="20" y="151" class="token-name mono">--brand-bg</text>
    <rect x="200" y="139" width="14" height="14" rx="3" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>

    <text x="20" y="173" class="token-name mono">--brand-text</text>
    <rect x="200" y="161" width="14" height="14" rx="3" fill="#c0caf5"/>

    <!-- Typography tokens -->
    <line x1="20" y1="190" x2="270" y2="190" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>

    <text x="20" y="212" class="token-name mono">--font-heading</text>
    <text x="200" y="212" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">Inter</text>

    <text x="20" y="234" class="token-name mono">--font-body</text>
    <text x="200" y="234" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">Inter</text>

    <!-- Spacing tokens -->
    <line x1="20" y1="252" x2="270" y2="252" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>

    <text x="20" y="274" class="token-name mono">--space-unit</text>
    <text x="200" y="274" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">0.5rem</text>

    <!-- Motion tokens -->
    <line x1="20" y1="292" x2="270" y2="292" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>

    <text x="20" y="314" class="token-name mono">--duration-fast</text>
    <text x="200" y="314" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">150ms</text>

    <text x="20" y="336" class="token-name mono">--duration-normal</text>
    <text x="200" y="336" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">300ms</text>

    <text x="20" y="358" class="token-name mono">--easing</text>
    <text x="200" y="358" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">ease-out</text>

    <!-- Shadow tokens -->
    <line x1="20" y1="376" x2="270" y2="376" stroke="#565f89" stroke-width="0.5" opacity="0.3"/>

    <text x="20" y="398" class="token-name mono">--shadow-sm</text>
    <text x="200" y="398" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">0 1px 2px...</text>

    <!-- Note -->
    <text x="145" y="450" text-anchor="middle" font-size="10" fill="#565f89" font-style="italic" font-family="Inter, system-ui, sans-serif">Set on :root by Pinia store</text>
    <text x="145" y="465" text-anchor="middle" font-size="10" fill="#565f89" font-style="italic" font-family="Inter, system-ui, sans-serif">Available to every component</text>
  </g>

  <!-- Arrow 2→3 -->
  <g transform="translate(695, 300)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#36f9f6" stroke-width="2" marker-end="url(#token-arrow)"/>
    <text x="32" y="-10" text-anchor="middle" font-size="10" font-weight="600" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">used in</text>
    <text x="32" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">Vue SFC</text>
  </g>

  <!-- ===== CARD 3: Vue Component Usage ===== -->
  <g transform="translate(770, 85)">
    <rect x="0" y="0" width="400" height="470" rx="10" fill="#1a1b26" stroke="#ff9e64" stroke-width="1.5"/>
    <rect x="0" y="0" width="400" height="35" rx="10" fill="#ff9e64" opacity="0.15"/>
    <rect x="0" y="25" width="400" height="10" fill="#ff9e64" opacity="0.15"/>
    <text x="200" y="24" text-anchor="middle" class="section-title" fill="#ff9e64">Vue SFC &lt;style&gt; Usage</text>

    <text x="20" y="60" font-size="11" fill="#565f89" font-family="Inter, system-ui, sans-serif">/* No hardcoded values -- ever */</text>

    <!-- CSS rules -->
    <text x="20" y="90" class="css-prop mono">.dashboard-card {"{"}</text>

    <text x="30" y="115" class="css-prop mono">background:</text>
    <text x="140" y="115" class="css-val mono">var(--brand-bg);</text>

    <text x="30" y="138" class="css-prop mono">color:</text>
    <text x="90" y="138" class="css-val mono">var(--brand-text);</text>

    <text x="30" y="161" class="css-prop mono">border:</text>
    <text x="95" y="161" class="css-val mono">1px solid var(--brand-primary);</text>

    <text x="30" y="184" class="css-prop mono">font-family:</text>
    <text x="140" y="184" class="css-val mono">var(--font-heading);</text>

    <text x="30" y="207" class="css-prop mono">padding:</text>
    <text x="100" y="207" class="css-val mono">calc(var(--space-unit) * 4);</text>

    <text x="30" y="230" class="css-prop mono">border-radius:</text>
    <text x="155" y="230" class="css-val mono">calc(var(--space-unit) * 2);</text>

    <text x="30" y="253" class="css-prop mono">box-shadow:</text>
    <text x="130" y="253" class="css-val mono">var(--shadow-sm);</text>

    <text x="30" y="276" class="css-prop mono">transition:</text>
    <text x="125" y="276" class="css-val mono">all var(--duration-fast)</text>
    <text x="125" y="294" class="css-val mono">    var(--easing);</text>

    <text x="20" y="318" class="css-prop mono">{"}"}</text>

    <!-- Hover state -->
    <text x="20" y="350" class="css-prop mono">.dashboard-card:hover {"{"}</text>
    <text x="30" y="373" class="css-prop mono">border-color:</text>
    <text x="148" y="373" class="css-val mono">var(--brand-accent);</text>
    <text x="30" y="396" class="css-prop mono">box-shadow:</text>
    <text x="130" y="396" class="css-val mono">var(--shadow-md);</text>
    <text x="20" y="419" class="css-prop mono">{"}"}</text>

    <!-- Note -->
    <rect x="20" y="435" width="360" height="26" rx="4" fill="#72f1b8" opacity="0.08" stroke="#72f1b8" stroke-width="0.5"/>
    <text x="200" y="452" text-anchor="middle" font-size="11" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Change brand.yaml = every component updates automatically</text>
  </g>

  <!-- Bottom -->
  <text x="600" y="590" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">One source of truth (brand.yaml) flows through the entire stack. Rebrand = edit YAML, not CSS.</text>
</svg>