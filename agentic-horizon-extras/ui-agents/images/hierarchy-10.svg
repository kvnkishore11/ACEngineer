<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #c0caf5; }
      .level-label { font-size: 13px; font-weight: 700; }
      .node-text { font-size: 11px; font-weight: 600; }
      .detail { font-size: 10px; fill: #565f89; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; }
      .connector { stroke: #565f89; stroke-width: 1; fill: none; }
    </style>
    <marker id="h-arrow" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5 Z" fill="#565f89"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#1a1b26"/>

  <!-- Title -->
  <text x="440" y="28" text-anchor="middle" class="title">Infinite UI Generation -- Brand to Leaf</text>

  <!-- ===== LEVEL LABELS (fixed left column) ===== -->
  <text x="20" y="70" class="level-label" fill="#7aa2f7">Brand</text>
  <text x="20" y="128" class="level-label" fill="#f7768e">Product</text>
  <text x="20" y="198" class="level-label" fill="#ff9e64">Tree</text>
  <text x="20" y="268" class="level-label" fill="#36f9f6">Branch</text>
  <text x="20" y="345" class="level-label" fill="#72f1b8">Leaf</text>

  <!-- ===== 5-LEVEL HIERARCHY TREE (nodes start at x=110+) ===== -->

  <!-- Level 0: Brand -->
  <rect x="315" y="50" width="140" height="34" rx="8" fill="#7aa2f7" opacity="0.2" stroke="#7aa2f7" stroke-width="2"/>
  <text x="385" y="72" text-anchor="middle" class="node-text" fill="#7aa2f7">aegis (Brand)</text>

  <!-- Connectors Brand → Products -->
  <line x1="355" y1="84" x2="210" y2="110" class="connector"/>
  <line x1="385" y1="84" x2="400" y2="110" class="connector"/>
  <line x1="415" y1="84" x2="590" y2="110" class="connector"/>

  <!-- Level 1: Products -->
  <rect x="150" y="110" width="120" height="30" rx="6" fill="#f7768e" opacity="0.2" stroke="#f7768e" stroke-width="1.5"/>
  <text x="210" y="129" text-anchor="middle" class="node-text" fill="#f7768e">app</text>

  <rect x="340" y="110" width="120" height="30" rx="6" fill="#f7768e" opacity="0.1" stroke="#f7768e" stroke-width="1"/>
  <text x="400" y="129" text-anchor="middle" class="node-text" fill="#f7768e" opacity="0.5">mobile</text>

  <rect x="530" y="110" width="120" height="30" rx="6" fill="#f7768e" opacity="0.1" stroke="#f7768e" stroke-width="1"/>
  <text x="590" y="129" text-anchor="middle" class="node-text" fill="#f7768e" opacity="0.5">site</text>

  <!-- Connectors app → Trees -->
  <line x1="185" y1="140" x2="160" y2="175" class="connector"/>
  <line x1="205" y1="140" x2="270" y2="175" class="connector"/>
  <line x1="225" y1="140" x2="385" y2="175" class="connector"/>
  <line x1="240" y1="140" x2="510" y2="175" class="connector"/>

  <!-- Level 2: Trees -->
  <rect x="110" y="175" width="100" height="30" rx="6" fill="#ff9e64" opacity="0.2" stroke="#ff9e64" stroke-width="1.5"/>
  <text x="160" y="195" text-anchor="middle" class="node-text" fill="#ff9e64">dashboard</text>

  <rect x="225" y="175" width="90" height="30" rx="6" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="1"/>
  <text x="270" y="195" text-anchor="middle" class="node-text" fill="#ff9e64" opacity="0.5">agents</text>

  <rect x="330" y="175" width="110" height="30" rx="6" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="1"/>
  <text x="385" y="195" text-anchor="middle" class="node-text" fill="#ff9e64" opacity="0.5">operations</text>

  <rect x="460" y="175" width="100" height="30" rx="6" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="1"/>
  <text x="510" y="195" text-anchor="middle" class="node-text" fill="#ff9e64" opacity="0.5">settings</text>

  <!-- Connectors dashboard → Branches -->
  <line x1="140" y1="205" x2="180" y2="245" class="connector"/>
  <line x1="160" y1="205" x2="335" y2="245" class="connector"/>
  <line x1="180" y1="205" x2="490" y2="245" class="connector"/>

  <!-- Level 3: Branches -->
  <rect x="110" y="245" width="140" height="40" rx="6" fill="#36f9f6" opacity="0.2" stroke="#36f9f6" stroke-width="1.5"/>
  <text x="180" y="261" text-anchor="middle" class="node-text" fill="#36f9f6">v1-grid-gauge</text>
  <rect x="145" y="270" width="55" height="13" rx="6" fill="#72f1b8" opacity="0.2"/>
  <text x="172" y="280" text-anchor="middle" font-size="8" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">validated</text>

  <rect x="265" y="245" width="140" height="40" rx="6" fill="#36f9f6" opacity="0.15" stroke="#36f9f6" stroke-width="1"/>
  <text x="335" y="261" text-anchor="middle" class="node-text" fill="#36f9f6">v2-feed-header</text>
  <rect x="300" y="270" width="60" height="13" rx="6" fill="#fede5d" opacity="0.2"/>
  <text x="330" y="280" text-anchor="middle" font-size="8" font-weight="600" fill="#fede5d" font-family="Inter, system-ui, sans-serif">generating</text>

  <rect x="420" y="245" width="140" height="40" rx="6" fill="#36f9f6" opacity="0.15" stroke="#36f9f6" stroke-width="1"/>
  <text x="490" y="261" text-anchor="middle" class="node-text" fill="#36f9f6">v3-split-panel</text>
  <rect x="458" y="270" width="45" height="13" rx="6" fill="#f7768e" opacity="0.2"/>
  <text x="480" y="280" text-anchor="middle" font-size="8" font-weight="600" fill="#f7768e" font-family="Inter, system-ui, sans-serif">failed</text>

  <!-- Connector branch → Leaf -->
  <line x1="180" y1="285" x2="170" y2="320" class="connector"/>

  <!-- Level 4: Leaf -->
  <rect x="115" y="320" width="110" height="35" rx="6" fill="#72f1b8" opacity="0.2" stroke="#72f1b8" stroke-width="1.5"/>
  <text x="170" y="342" text-anchor="middle" class="node-text" fill="#72f1b8">index.vue</text>

  <!-- ===== BRAND TOKEN FLOW (right side) ===== -->
  <g transform="translate(690, 45)">
    <rect x="0" y="0" width="480" height="200" rx="8" fill="#1a1b26" stroke="#fede5d" stroke-width="1"/>
    <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#fede5d" font-family="Inter, system-ui, sans-serif">Brand Token Flow</text>

    <rect x="15" y="35" width="120" height="50" rx="5" fill="#fede5d" opacity="0.1" stroke="#fede5d" stroke-width="0.5"/>
    <text x="75" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#fede5d" font-family="Inter, system-ui, sans-serif">brand.yaml</text>
    <text x="75" y="70" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">palette, type, motion</text>

    <line x1="135" y1="60" x2="160" y2="60" stroke="#565f89" stroke-width="1" marker-end="url(#h-arrow)"/>

    <rect x="165" y="35" width="95" height="50" rx="5" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="0.5"/>
    <text x="212" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">deep merge</text>
    <text x="212" y="70" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">+ product override</text>

    <line x1="260" y1="60" x2="285" y2="60" stroke="#565f89" stroke-width="1" marker-end="url(#h-arrow)"/>

    <rect x="290" y="35" width="85" height="50" rx="5" fill="#36f9f6" opacity="0.1" stroke="#36f9f6" stroke-width="0.5"/>
    <text x="332" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">CSS vars</text>
    <text x="332" y="70" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">--brand-*</text>

    <line x1="375" y1="60" x2="400" y2="60" stroke="#565f89" stroke-width="1" marker-end="url(#h-arrow)"/>

    <rect x="405" y="35" width="60" height="50" rx="5" fill="#72f1b8" opacity="0.1" stroke="#72f1b8" stroke-width="0.5"/>
    <text x="435" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Vue</text>
    <text x="435" y="70" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">var(--*)</text>

    <text x="15" y="110" font-size="10" fill="#7aa2f7" font-family="'JetBrains Mono', monospace">palette.primary: "#7aa2f7"</text>
    <text x="15" y="128" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">becomes</text>
    <text x="15" y="146" font-size="10" fill="#36f9f6" font-family="'JetBrains Mono', monospace">--brand-primary: #7aa2f7;</text>
    <text x="15" y="164" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">used as</text>
    <text x="15" y="182" font-size="10" fill="#72f1b8" font-family="'JetBrains Mono', monospace">background: var(--brand-primary);</text>
  </g>

  <!-- ===== TREES.YAML MANIFEST (middle right) ===== -->
  <g transform="translate(690, 260)">
    <rect x="0" y="0" width="480" height="150" rx="8" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1"/>
    <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#7aa2f7" font-family="Inter, system-ui, sans-serif">trees.yaml Manifest</text>

    <text x="15" y="42" font-size="10" fill="#7aa2f7" font-family="'JetBrains Mono', monospace">trees:</text>
    <text x="25" y="57" font-size="10" fill="#7aa2f7" font-family="'JetBrains Mono', monospace">- slug: dashboard</text>
    <text x="35" y="72" font-size="10" fill="#7aa2f7" font-family="'JetBrains Mono', monospace">  branches:</text>
    <text x="45" y="87" font-size="10" fill="#36f9f6" font-family="'JetBrains Mono', monospace">  - slug: v1-grid-gauge</text>
    <text x="55" y="102" font-size="10" fill="#565f89" font-family="'JetBrains Mono', monospace">    status: validated</text>
    <text x="45" y="117" font-size="10" fill="#36f9f6" font-family="'JetBrains Mono', monospace">  - slug: v2-feed-header</text>
    <text x="55" y="132" font-size="10" fill="#565f89" font-family="'JetBrains Mono', monospace">    status: generating</text>

    <rect x="300" y="37" width="165" height="42" rx="4" fill="#72f1b8" opacity="0.06"/>
    <text x="382" y="54" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Zod-validated on every write</text>
    <text x="382" y="68" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Setup team owns this file</text>

    <rect x="300" y="85" width="165" height="42" rx="4" fill="#ff9e64" opacity="0.06"/>
    <text x="382" y="102" text-anchor="middle" font-size="9" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">Status tracks lifecycle:</text>
    <text x="382" y="116" text-anchor="middle" font-size="9" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">draft > generating > validated</text>
  </g>

  <!-- ===== /generate INSET ===== -->
  <g transform="translate(690, 425)">
    <rect x="0" y="0" width="480" height="170" rx="8" fill="#1a1b26" stroke="#36f9f6" stroke-width="1"/>
    <text x="240" y="22" text-anchor="middle" font-size="13" font-weight="700" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">/generate Creates N Variants</text>

    <rect x="15" y="32" width="450" height="26" rx="4" fill="#72f1b8" opacity="0.06"/>
    <text x="25" y="50" font-size="10" fill="#72f1b8" font-family="'JetBrains Mono', monospace">/generate aegis app dashboard 3 "metric dashboards"</text>

    <rect x="15" y="68" width="140" height="80" rx="4" fill="#36f9f6" opacity="0.06" stroke="#36f9f6" stroke-width="0.5"/>
    <text x="85" y="88" text-anchor="middle" font-size="10" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">v1-grid-gauge</text>
    <rect x="25" y="95" width="30" height="20" rx="2" fill="#565f89" opacity="0.15"/>
    <rect x="60" y="95" width="30" height="20" rx="2" fill="#565f89" opacity="0.15"/>
    <rect x="95" y="95" width="30" height="20" rx="2" fill="#565f89" opacity="0.15"/>
    <rect x="25" y="120" width="95" height="18" rx="2" fill="#565f89" opacity="0.1"/>
    <text x="85" y="144" text-anchor="middle" font-size="8" fill="#565f89" font-family="Inter, system-ui, sans-serif">grid layout</text>

    <rect x="170" y="68" width="140" height="80" rx="4" fill="#36f9f6" opacity="0.06" stroke="#36f9f6" stroke-width="0.5"/>
    <text x="240" y="88" text-anchor="middle" font-size="10" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">v2-feed-header</text>
    <rect x="180" y="95" width="120" height="10" rx="2" fill="#565f89" opacity="0.15"/>
    <rect x="180" y="110" width="120" height="8" rx="2" fill="#565f89" opacity="0.1"/>
    <rect x="180" y="122" width="120" height="8" rx="2" fill="#565f89" opacity="0.1"/>
    <rect x="180" y="134" width="120" height="8" rx="2" fill="#565f89" opacity="0.1"/>
    <text x="240" y="152" text-anchor="middle" font-size="8" fill="#565f89" font-family="Inter, system-ui, sans-serif">feed layout</text>

    <rect x="325" y="68" width="140" height="80" rx="4" fill="#36f9f6" opacity="0.06" stroke="#36f9f6" stroke-width="0.5"/>
    <text x="395" y="88" text-anchor="middle" font-size="10" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">v3-split-panel</text>
    <rect x="335" y="95" width="35" height="48" rx="2" fill="#565f89" opacity="0.15"/>
    <rect x="375" y="95" width="80" height="48" rx="2" fill="#565f89" opacity="0.1"/>
    <text x="395" y="152" text-anchor="middle" font-size="8" fill="#565f89" font-family="Inter, system-ui, sans-serif">split layout</text>

    <text x="240" y="164" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">Each variant explores a different layout approach</text>
  </g>

  <!-- ===== LEGEND at bottom left ===== -->
  <g transform="translate(15, 375)">
    <rect x="0" y="0" width="650" height="235" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
    <text x="325" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Hierarchy Levels</text>

    <g transform="translate(15, 35)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#7aa2f7"/>
      <text x="22" y="12" font-size="11" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Brand -- visual identity (palette, typography, motion, shadows)</text>

      <rect x="0" y="24" width="14" height="14" rx="3" fill="#f7768e"/>
      <text x="22" y="36" font-size="11" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Product -- deployment target, optional brand.yaml override</text>

      <rect x="0" y="48" width="14" height="14" rx="3" fill="#ff9e64"/>
      <text x="22" y="60" font-size="11" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Tree -- feature area (dashboard, agents, operations, settings)</text>

      <rect x="0" y="72" width="14" height="14" rx="3" fill="#36f9f6"/>
      <text x="22" y="84" font-size="11" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Branch -- layout variant (v1-grid-gauge, v2-feed-header, ...)</text>

      <rect x="0" y="96" width="14" height="14" rx="3" fill="#72f1b8"/>
      <text x="22" y="108" font-size="11" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Leaf -- generated Vue SFC component (index.vue)</text>
    </g>

    <g transform="translate(15, 158)">
      <text x="0" y="0" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Branch Statuses</text>

      <rect x="0" y="10" width="45" height="14" rx="7" fill="#565f89" opacity="0.2"/>
      <text x="22" y="21" text-anchor="middle" font-size="8" fill="#565f89" font-family="Inter, system-ui, sans-serif">draft</text>

      <rect x="55" y="10" width="65" height="14" rx="7" fill="#fede5d" opacity="0.2"/>
      <text x="87" y="21" text-anchor="middle" font-size="8" fill="#fede5d" font-family="Inter, system-ui, sans-serif">generating</text>

      <rect x="130" y="10" width="60" height="14" rx="7" fill="#ff9e64" opacity="0.2"/>
      <text x="160" y="21" text-anchor="middle" font-size="8" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">validating</text>

      <rect x="200" y="10" width="60" height="14" rx="7" fill="#72f1b8" opacity="0.2"/>
      <text x="230" y="21" text-anchor="middle" font-size="8" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">validated</text>

      <rect x="270" y="10" width="45" height="14" rx="7" fill="#f7768e" opacity="0.2"/>
      <text x="292" y="21" text-anchor="middle" font-size="8" fill="#f7768e" font-family="Inter, system-ui, sans-serif">failed</text>

      <text x="0" y="48" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">Infinite brands, infinite products, infinite trees -- all from one YAML-driven system.</text>
      <text x="0" y="63" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">Add a brand.yaml and /generate to create validated Vue components automatically.</text>
    </g>
  </g>
</svg>
