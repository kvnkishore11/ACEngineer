<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <style>
      .bg { fill: #0f1219; }
      .label { font-family: 'Inter', 'SF Pro Display', -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #e0e6f0; text-anchor: middle; dominant-baseline: central; }
      .sub { font-family: 'Inter', sans-serif; font-size: 9px; fill: #565f89; text-anchor: middle; dominant-baseline: central; }
      .num { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-size: 18px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .n1 { fill: #72f1b8; }
      .n2 { fill: #36f9f6; }
      .n3 { fill: #fede5d; }
      .n4 { fill: #ff9e64; }
      .n5 { fill: #f7768e; }

      .card { fill: #161a24; stroke-width: 1; rx: 8; ry: 8; }
      .s1 { stroke: #72f1b8; stroke-opacity: 0.4; }
      .s2 { stroke: #36f9f6; stroke-opacity: 0.4; }
      .s3 { stroke: #fede5d; stroke-opacity: 0.4; }
      .s4 { stroke: #ff9e64; stroke-opacity: 0.4; }
      .s5 { stroke: #f7768e; stroke-opacity: 0.4; }

      .bar { rx: 2; ry: 2; }
      .b1 { fill: #72f1b8; }
      .b2 { fill: #36f9f6; }
      .b3 { fill: #fede5d; }
      .b4 { fill: #ff9e64; }
      .b5 { fill: #f7768e; }

      .chevron { fill: none; stroke: #3b4261; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .cg { opacity: 0; }
      .d1 { animation: fadeIn 0.5s ease-out 0.0s forwards; }
      .d2 { animation: fadeIn 0.5s ease-out 0.2s forwards; }
      .d3 { animation: fadeIn 0.5s ease-out 0.4s forwards; }
      .d4 { animation: fadeIn 0.5s ease-out 0.6s forwards; }
      .d5 { animation: fadeIn 0.5s ease-out 0.8s forwards; }
      .dc1 { animation: fadeIn 0.3s ease-out 0.1s forwards; }
      .dc2 { animation: fadeIn 0.3s ease-out 0.3s forwards; }
      .dc3 { animation: fadeIn 0.3s ease-out 0.5s forwards; }
      .dc4 { animation: fadeIn 0.3s ease-out 0.7s forwards; }

      .barAnim { opacity: 0; animation: barIn 0.6s ease-out forwards; }
      .ba1 { animation-delay: 0.3s; }
      .ba2 { animation-delay: 0.5s; }
      .ba3 { animation-delay: 0.7s; }
      .ba4 { animation-delay: 0.9s; }
      .ba5 { animation-delay: 1.1s; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes barIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
    </style>
  </defs>

  <rect class="bg" width="960" height="320" />

  <!-- Card 1: Brand -->
  <g class="cg d1">
    <rect class="card s1" x="60" y="110" width="130" height="100" />
    <text class="num n1" x="125" y="148">1</text>
    <text class="label" x="125" y="170">Brand</text>
    <text class="sub" x="125" y="186">visual identity</text>
    <rect class="bar b1 barAnim ba1" x="75" y="195" width="100" height="3" />
  </g>

  <!-- Chevron 1 -->
  <g class="cg dc1">
    <polyline class="chevron" points="205,152 213,160 205,168" />
  </g>

  <!-- Card 2: Product -->
  <g class="cg d2">
    <rect class="card s2" x="228" y="110" width="130" height="100" />
    <text class="num n2" x="293" y="148">2</text>
    <text class="label" x="293" y="170">Product</text>
    <text class="sub" x="293" y="186">app scope</text>
    <rect class="bar b2 barAnim ba2" x="243" y="195" width="100" height="3" />
  </g>

  <!-- Chevron 2 -->
  <g class="cg dc2">
    <polyline class="chevron" points="373,152 381,160 373,168" />
  </g>

  <!-- Card 3: Tree -->
  <g class="cg d3">
    <rect class="card s3" x="396" y="110" width="130" height="100" />
    <text class="num n3" x="461" y="148">3</text>
    <text class="label" x="461" y="170">Tree</text>
    <text class="sub" x="461" y="186">UI category</text>
    <rect class="bar b3 barAnim ba3" x="411" y="195" width="100" height="3" />
  </g>

  <!-- Chevron 3 -->
  <g class="cg dc3">
    <polyline class="chevron" points="541,152 549,160 541,168" />
  </g>

  <!-- Card 4: Branch -->
  <g class="cg d4">
    <rect class="card s4" x="564" y="110" width="130" height="100" />
    <text class="num n4" x="629" y="148">4</text>
    <text class="label" x="629" y="170">Branch</text>
    <text class="sub" x="629" y="186">variant</text>
    <rect class="bar b4 barAnim ba4" x="579" y="195" width="100" height="3" />
  </g>

  <!-- Chevron 4 -->
  <g class="cg dc4">
    <polyline class="chevron" points="709,152 717,160 709,168" />
  </g>

  <!-- Card 5: Leaf -->
  <g class="cg d5">
    <rect class="card s5" x="732" y="110" width="130" height="100" />
    <text class="num n5" x="797" y="148">5</text>
    <text class="label" x="797" y="170">Leaf</text>
    <text class="sub" x="797" y="186">index.vue</text>
    <rect class="bar b5 barAnim ba5" x="747" y="195" width="100" height="3" />
  </g>
</svg>