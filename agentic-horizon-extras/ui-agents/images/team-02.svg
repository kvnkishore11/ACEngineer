<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .footer { font-size: 13px; fill: #565f89; font-style: italic; }
      .team-header { font-size: 14px; font-weight: 700; }
      .agent-name { font-size: 12px; font-weight: 600; fill: #c0caf5; }
      .agent-role { font-size: 10px; fill: #565f89; }
      .badge { font-size: 10px; font-weight: 600; fill: #1a1b26; }
      .connector { stroke: #565f89; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#1a1b26"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" class="title">12 Specialized Agents</text>

  <!-- Orchestrator -->
  <rect x="475" y="60" width="250" height="50" rx="10" fill="#7aa2f7" opacity="0.2" stroke="#7aa2f7" stroke-width="2"/>
  <text x="600" y="82" text-anchor="middle" font-size="16" font-weight="700" fill="#7aa2f7" font-family="Inter, system-ui, sans-serif">Orchestrator</text>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#7aa2f7" opacity="0.7" font-family="Inter, system-ui, sans-serif">coordinates all teams</text>

  <!-- Connector lines from Orchestrator -->
  <line x1="520" y1="110" x2="160" y2="155" class="connector"/>
  <line x1="560" y1="110" x2="430" y2="155" class="connector"/>
  <line x1="640" y1="110" x2="700" y2="155" class="connector"/>
  <line x1="680" y1="110" x2="970" y2="155" class="connector"/>

  <!-- SETUP TEAM -->
  <g transform="translate(30, 155)">
    <!-- Header -->
    <rect x="0" y="0" width="260" height="32" rx="6" fill="#c3e88d"/>
    <text x="130" y="21" text-anchor="middle" class="team-header" fill="#1a1b26">Setup Team</text>

    <!-- Lead -->
    <rect x="10" y="45" width="240" height="55" rx="8" fill="#c3e88d" opacity="0.15" stroke="#c3e88d" stroke-width="1.5"/>
    <text x="130" y="66" text-anchor="middle" class="agent-name">Setup Lead</text>
    <text x="130" y="82" text-anchor="middle" font-size="11" fill="#c3e88d" font-family="Inter, system-ui, sans-serif">Lead -- plans</text>
    <text x="130" y="94" text-anchor="middle" class="agent-role">owns trees.yaml integrity</text>

    <!-- Workers -->
    <rect x="10" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="67" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Scaffold</text>
    <text x="67" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Worker</text>
    <text x="67" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>

    <rect x="135" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="192" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Structure</text>
    <text x="192" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Validator</text>
    <text x="192" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>
  </g>

  <!-- BRAND TEAM -->
  <g transform="translate(310, 155)">
    <rect x="0" y="0" width="240" height="32" rx="6" fill="#fede5d"/>
    <text x="120" y="21" text-anchor="middle" class="team-header" fill="#1a1b26">Brand Team</text>

    <rect x="10" y="45" width="220" height="55" rx="8" fill="#fede5d" opacity="0.15" stroke="#fede5d" stroke-width="1.5"/>
    <text x="120" y="66" text-anchor="middle" class="agent-name">Brand Lead</text>
    <text x="120" y="82" text-anchor="middle" font-size="11" fill="#fede5d" font-family="Inter, system-ui, sans-serif">Lead -- plans</text>
    <text x="120" y="94" text-anchor="middle" class="agent-role">guards brand consistency</text>

    <rect x="10" y="110" width="220" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="120" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Brand Analyst</text>
    <text x="120" y="148" text-anchor="middle" class="agent-role">Worker -- executes</text>
    <text x="120" y="160" text-anchor="middle" class="agent-role">token compliance + contrast</text>
  </g>

  <!-- UI GEN TEAM -->
  <g transform="translate(570, 155)">
    <rect x="0" y="0" width="260" height="32" rx="6" fill="#36f9f6"/>
    <text x="130" y="21" text-anchor="middle" class="team-header" fill="#1a1b26">UI Generation Team</text>

    <!-- x3 badge -->
    <rect x="205" y="4" width="45" height="22" rx="11" fill="#1a1b26" stroke="#36f9f6" stroke-width="1.5"/>
    <text x="227" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">x3</text>

    <rect x="10" y="45" width="240" height="55" rx="8" fill="#36f9f6" opacity="0.15" stroke="#36f9f6" stroke-width="1.5"/>
    <text x="130" y="66" text-anchor="middle" class="agent-name">UI Gen Lead</text>
    <text x="130" y="82" text-anchor="middle" font-size="11" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">Lead -- plans</text>
    <text x="130" y="94" text-anchor="middle" class="agent-role">creates differentiated briefs</text>

    <rect x="10" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="67" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Vue</text>
    <text x="67" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Generator</text>
    <text x="67" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>

    <rect x="135" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="192" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Animation</text>
    <text x="192" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Specialist</text>
    <text x="192" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>
  </g>

  <!-- VALIDATION TEAM -->
  <g transform="translate(850, 155)">
    <rect x="0" y="0" width="260" height="32" rx="6" fill="#ff9e64"/>
    <text x="130" y="21" text-anchor="middle" class="team-header" fill="#1a1b26">Validation Team</text>

    <!-- x3 badge -->
    <rect x="205" y="4" width="45" height="22" rx="11" fill="#1a1b26" stroke="#ff9e64" stroke-width="1.5"/>
    <text x="227" y="19" text-anchor="middle" font-size="10" font-weight="600" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">x3</text>

    <rect x="10" y="45" width="240" height="55" rx="8" fill="#ff9e64" opacity="0.15" stroke="#ff9e64" stroke-width="1.5"/>
    <text x="130" y="66" text-anchor="middle" class="agent-name">Validation Lead</text>
    <text x="130" y="82" text-anchor="middle" font-size="11" fill="#ff9e64" font-family="Inter, system-ui, sans-serif">Lead -- plans</text>
    <text x="130" y="94" text-anchor="middle" class="agent-role">coordinates checks</text>

    <rect x="10" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="67" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Soft</text>
    <text x="67" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Validator</text>
    <text x="67" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>

    <rect x="135" y="110" width="115" height="55" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1"/>
    <text x="192" y="130" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Hard</text>
    <text x="192" y="143" text-anchor="middle" font-size="11" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Validator</text>
    <text x="192" y="158" text-anchor="middle" class="agent-role">Worker -- executes</text>
  </g>

  <!-- Footer -->
  <text x="600" y="595" text-anchor="middle" class="footer">Leads think. Workers do.</text>

  <!-- Agent count summary -->
  <g transform="translate(40, 420)">
    <rect x="0" y="0" width="1120" height="50" rx="8" fill="#1a1b26" stroke="#565f89" stroke-width="1" opacity="0.5"/>
    <text x="560" y="20" text-anchor="middle" font-size="12" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Agent Count: 1 Orchestrator + 3 Setup + 2 Brand + 3 UI Gen + 3 Validation = 12 total agents</text>
    <text x="560" y="40" text-anchor="middle" font-size="11" fill="#565f89" font-family="Inter, system-ui, sans-serif">UI Gen and Validation teams run as 3 parallel instances for round-robin parallelism</text>
  </g>
</svg>