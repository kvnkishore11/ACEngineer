<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .col-header { font-size: 13px; font-weight: 700; fill: #c0caf5; }
      .team-name { font-size: 14px; font-weight: 700; }
      .role-text { font-size: 12px; font-weight: 600; fill: #c0caf5; }
      .desc-text { font-size: 11px; fill: #c0caf5; }
      .tool-text { font-size: 11px; fill: #565f89; }

      /* ── Shared keyframes ── */
      @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes fadeRight {
        from { opacity: 0; transform: translateX(-12px); }
        to   { opacity: 1; transform: translateX(0); }
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.1; }
        50%      { opacity: 0.22; }
      }
      @keyframes dotBreathe {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.5); }
      }

      /* ── Title + headers ── */
      .title-g   { opacity: 0; animation: fadeDown 0.5s ease-out 0.15s forwards; }
      .headers-g { opacity: 0; animation: fadeDown 0.4s ease-out 0.35s forwards; }
      .grid-g    { opacity: 0; animation: fadeIn  0.4s ease-out 0.50s forwards; }

      /* ─────────────────────────────────────────────
         Column reveals — each cell fades + slides in.
         No row-level opacity — columns are sole owner.
         Timing: row gap 0.7s, column gap 0.15s
         ───────────────────────────────────────────── */

      /* Setup row: base 0.8s */
      .s-team { opacity: 0; animation: fadeRight 0.4s ease-out 0.80s forwards; }
      .s-role { opacity: 0; animation: fadeRight 0.4s ease-out 0.95s forwards; }
      .s-desc { opacity: 0; animation: fadeRight 0.4s ease-out 1.10s forwards; }
      .s-tool { opacity: 0; animation: fadeRight 0.4s ease-out 1.25s forwards; }

      /* Brand row: base 1.5s */
      .b-team { opacity: 0; animation: fadeRight 0.4s ease-out 1.50s forwards; }
      .b-role { opacity: 0; animation: fadeRight 0.4s ease-out 1.65s forwards; }
      .b-desc { opacity: 0; animation: fadeRight 0.4s ease-out 1.80s forwards; }
      .b-tool { opacity: 0; animation: fadeRight 0.4s ease-out 1.95s forwards; }

      /* UI Gen row: base 2.2s */
      .u-team { opacity: 0; animation: fadeRight 0.4s ease-out 2.20s forwards; }
      .u-role { opacity: 0; animation: fadeRight 0.4s ease-out 2.35s forwards; }
      .u-desc { opacity: 0; animation: fadeRight 0.4s ease-out 2.50s forwards; }
      .u-tool { opacity: 0; animation: fadeRight 0.4s ease-out 2.65s forwards; }

      /* Validation row: base 2.9s */
      .v-team { opacity: 0; animation: fadeRight 0.4s ease-out 2.90s forwards; }
      .v-role { opacity: 0; animation: fadeRight 0.4s ease-out 3.05s forwards; }
      .v-desc { opacity: 0; animation: fadeRight 0.4s ease-out 3.20s forwards; }
      .v-tool { opacity: 0; animation: fadeRight 0.4s ease-out 3.35s forwards; }

      /* Footer */
      .footer-g { opacity: 0; animation: fadeIn 0.5s ease-out 3.60s forwards; }

      /* ── Ambient: team bar breathing glow (staggered start) ── */
      .bar-setup { animation: breathe 3s ease-in-out 4.0s infinite; }
      .bar-brand { animation: breathe 3s ease-in-out 4.4s infinite; }
      .bar-uigen { animation: breathe 3s ease-in-out 4.8s infinite; }
      .bar-valid { animation: breathe 3s ease-in-out 5.2s infinite; }

      /* ── Ambient: lead indicator dots ── */
      .lead-dot {
        opacity: 0;
        transform-origin: center;
        transform-box: fill-box;
        animation: dotBreathe 2.5s ease-in-out 4.0s infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1b26"/>

  <!-- ── Title ── -->
  <g class="title-g">
    <text x="600" y="38" text-anchor="middle" class="title">Agent Capabilities</text>
  </g>

  <!-- ── Column headers ── -->
  <g transform="translate(0, 58)">
  <g class="headers-g">
    <rect x="30"  y="0" width="170" height="30" rx="5" fill="#565f89" opacity="0.15"/>
    <text x="115" y="20" text-anchor="middle" class="col-header">Team</text>
    <rect x="210" y="0" width="180" height="30" rx="5" fill="#565f89" opacity="0.15"/>
    <text x="300" y="20" text-anchor="middle" class="col-header">Role</text>
    <rect x="400" y="0" width="390" height="30" rx="5" fill="#565f89" opacity="0.15"/>
    <text x="595" y="20" text-anchor="middle" class="col-header">What They Do</text>
    <rect x="800" y="0" width="370" height="30" rx="5" fill="#565f89" opacity="0.15"/>
    <text x="985" y="20" text-anchor="middle" class="col-header">Tools / Techniques</text>
  </g>
  </g>

  <!-- ── Grid lines ── -->
  <g class="grid-g">
    <line x1="200" y1="58" x2="200" y2="590" stroke="#565f89" stroke-width="0.5" opacity="0.2"/>
    <line x1="395" y1="58" x2="395" y2="590" stroke="#565f89" stroke-width="0.5" opacity="0.2"/>
    <line x1="795" y1="58" x2="795" y2="590" stroke="#565f89" stroke-width="0.5" opacity="0.2"/>
  </g>

  <!-- ================================================================
       SETUP ROW  (y baseline = 100)
       ================================================================ -->
  <g transform="translate(0, 100)">
    <g class="s-team">
      <rect class="bar-setup" x="30" y="0" width="170" height="120" rx="8" fill="#c3e88d" opacity="0.1" stroke="#c3e88d" stroke-width="1"/>
      <text x="115" y="25" text-anchor="middle" class="team-name" fill="#c3e88d">Setup</text>
      <text x="115" y="42" text-anchor="middle" font-size="10" fill="#c3e88d" opacity="0.6" font-family="Inter, system-ui, sans-serif">3 agents</text>
    </g>
    <g class="s-role">
      <rect x="210" y="5"  width="180" height="30" rx="5" fill="#c3e88d" opacity="0.08"/>
      <text x="220" y="24" class="role-text">Setup Lead</text>
      <circle class="lead-dot" cx="384" cy="20" r="3" fill="#c3e88d"/>
      <rect x="210" y="42" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="62" class="role-text">Scaffold Worker</text>
      <rect x="210" y="78" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="98" class="role-text">Structure Validator</text>
    </g>
    <g class="s-desc">
      <text x="410" y="24" class="desc-text">Owns trees.yaml integrity</text>
      <text x="410" y="62" class="desc-text">Creates directories + stubs</text>
      <text x="410" y="98" class="desc-text">Zod validation of all manifests</text>
    </g>
    <g class="s-tool">
      <text x="810" y="24" class="tool-text">Zod schema, YAML parsing</text>
      <text x="810" y="62" class="tool-text">fs.mkdir, file templates</text>
      <text x="810" y="98" class="tool-text">Zod schemas, structural checks</text>
    </g>
  </g>

  <!-- ================================================================
       BRAND ROW  (y baseline = 235)
       ================================================================ -->
  <g transform="translate(0, 235)">
    <g class="b-team">
      <rect class="bar-brand" x="30" y="0" width="170" height="85" rx="8" fill="#fede5d" opacity="0.1" stroke="#fede5d" stroke-width="1"/>
      <text x="115" y="25" text-anchor="middle" class="team-name" fill="#fede5d">Brand</text>
      <text x="115" y="42" text-anchor="middle" font-size="10" fill="#fede5d" opacity="0.6" font-family="Inter, system-ui, sans-serif">2 agents</text>
    </g>
    <g class="b-role">
      <rect x="210" y="5"  width="180" height="30" rx="5" fill="#fede5d" opacity="0.08"/>
      <text x="220" y="24" class="role-text">Brand Lead</text>
      <circle class="lead-dot" cx="384" cy="20" r="3" fill="#fede5d"/>
      <rect x="210" y="42" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="62" class="role-text">Brand Analyst</text>
    </g>
    <g class="b-desc">
      <text x="410" y="24" class="desc-text">Guards brand consistency</text>
      <text x="410" y="62" class="desc-text">Token compliance + contrast analysis</text>
    </g>
    <g class="b-tool">
      <text x="810" y="24" class="tool-text">brand.yaml, deep merge</text>
      <text x="810" y="62" class="tool-text">Color math, WCAG ratios</text>
    </g>
  </g>

  <!-- ================================================================
       UI GEN ROW  (y baseline = 335)
       ================================================================ -->
  <g transform="translate(0, 335)">
    <g class="u-team">
      <rect class="bar-uigen" x="30" y="0" width="170" height="120" rx="8" fill="#36f9f6" opacity="0.1" stroke="#36f9f6" stroke-width="1"/>
      <text x="115" y="25" text-anchor="middle" class="team-name" fill="#36f9f6">UI Gen</text>
      <text x="115" y="42" text-anchor="middle" font-size="10" fill="#36f9f6" opacity="0.6" font-family="Inter, system-ui, sans-serif">3 agents ×3</text>
    </g>
    <g class="u-role">
      <rect x="210" y="5"  width="180" height="30" rx="5" fill="#36f9f6" opacity="0.08"/>
      <text x="220" y="24" class="role-text">UI Gen Lead</text>
      <circle class="lead-dot" cx="384" cy="20" r="3" fill="#36f9f6"/>
      <rect x="210" y="42" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="62" class="role-text">Vue Generator</text>
      <rect x="210" y="78" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="98" class="role-text">Animation Specialist</text>
    </g>
    <g class="u-desc">
      <text x="410" y="24" class="desc-text">Creates differentiated briefs per branch</text>
      <text x="410" y="62" class="desc-text">Writes complete Vue SFC components</text>
      <text x="410" y="98" class="desc-text">CSS transitions + motion design</text>
    </g>
    <g class="u-tool">
      <text x="810" y="24" class="tool-text">Prompt engineering, brief templates</text>
      <text x="810" y="62" class="tool-text">Vue 3 SFC, CSS custom properties</text>
      <text x="810" y="98" class="tool-text">CSS keyframes, var(--duration-*)</text>
    </g>
  </g>

  <!-- ================================================================
       VALIDATION ROW  (y baseline = 470)
       ================================================================ -->
  <g transform="translate(0, 470)">
    <g class="v-team">
      <rect class="bar-valid" x="30" y="0" width="170" height="120" rx="8" fill="#ff9e64" opacity="0.1" stroke="#ff9e64" stroke-width="1"/>
      <text x="115" y="25" text-anchor="middle" class="team-name" fill="#ff9e64">Validation</text>
      <text x="115" y="42" text-anchor="middle" font-size="10" fill="#ff9e64" opacity="0.6" font-family="Inter, system-ui, sans-serif">3 agents ×3</text>
    </g>
    <g class="v-role">
      <rect x="210" y="5"  width="180" height="30" rx="5" fill="#ff9e64" opacity="0.08"/>
      <text x="220" y="24" class="role-text">Validation Lead</text>
      <circle class="lead-dot" cx="384" cy="20" r="3" fill="#ff9e64"/>
      <rect x="210" y="42" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="62" class="role-text">Soft Validator</text>
      <rect x="210" y="78" width="180" height="30" rx="5" fill="#1a1b26" stroke="#565f89" stroke-width="0.5"/>
      <text x="220" y="98" class="role-text">Hard Validator</text>
    </g>
    <g class="v-desc">
      <text x="410" y="24" class="desc-text">Coordinates soft + hard checks</text>
      <text x="410" y="62" class="desc-text">Playwright screenshots at 4 breakpoints</text>
      <text x="410" y="98" class="desc-text">Accessibility + responsive testing</text>
    </g>
    <g class="v-tool">
      <text x="810" y="24" class="tool-text">Test orchestration, result aggregation</text>
      <text x="810" y="62" class="tool-text">Playwright, viewport capture</text>
      <text x="810" y="98" class="tool-text">axe-core, keyboard nav, focus rings</text>
    </g>
  </g>

  <!-- ── Footer ── -->
  <g class="footer-g">
    <text x="600" y="615" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">Leads are thinkers/planners. Workers are doers who write files. | 12 total agents across 4 team types.</text>
  </g>
</svg>
