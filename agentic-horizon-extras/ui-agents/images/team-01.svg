<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .stage-label { font-size: 14px; font-weight: 600; fill: #1a1b26; }
      .stage-desc { font-size: 11px; font-weight: 400; fill: #1a1b26; }
      .arrow { stroke: #565f89; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .legend-text { font-size: 11px; fill: #c0caf5; }
      .parallel-label { font-size: 11px; fill: #565f89; font-style: italic; }
      .fan-line { stroke: #565f89; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#565f89"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#1a1b26" rx="0"/>

  <!-- Title -->
  <text x="600" y="45" text-anchor="middle" class="title">Generation Pipeline</text>

  <!-- Stage 1: Setup - Scaffold -->
  <rect x="40" y="180" width="160" height="70" rx="10" fill="#c3e88d"/>
  <text x="120" y="208" text-anchor="middle" class="stage-label">Setup</text>
  <text x="120" y="228" text-anchor="middle" class="stage-desc">scaffold dirs + trees.yaml</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="215" x2="240" y2="215" class="arrow"/>

  <!-- Stage 2: Brand -->
  <rect x="250" y="180" width="160" height="70" rx="10" fill="#fede5d"/>
  <text x="330" y="208" text-anchor="middle" class="stage-label">Brand</text>
  <text x="330" y="228" text-anchor="middle" class="stage-desc">load identity + brief</text>

  <!-- Arrow 2→fan -->
  <line x1="410" y1="215" x2="450" y2="215" class="arrow" style="marker-end: none"/>

  <!-- Fan-out lines to 3 parallel UI Gen lanes -->
  <path d="M450,215 L490,140" class="fan-line"/>
  <path d="M450,215 L490,215" class="fan-line"/>
  <path d="M450,215 L490,290" class="fan-line"/>

  <!-- Stage 3a: UI Gen A -->
  <rect x="495" y="110" width="170" height="55" rx="10" fill="#36f9f6"/>
  <text x="580" y="133" text-anchor="middle" class="stage-label">UI Gen A</text>
  <text x="580" y="150" text-anchor="middle" class="stage-desc">write Vue SFCs</text>

  <!-- Stage 3b: UI Gen B -->
  <rect x="495" y="188" width="170" height="55" rx="10" fill="#36f9f6"/>
  <text x="580" y="211" text-anchor="middle" class="stage-label">UI Gen B</text>
  <text x="580" y="228" text-anchor="middle" class="stage-desc">write Vue SFCs</text>

  <!-- Stage 3c: UI Gen C -->
  <rect x="495" y="265" width="170" height="55" rx="10" fill="#36f9f6"/>
  <text x="580" y="288" text-anchor="middle" class="stage-label">UI Gen C</text>
  <text x="580" y="305" text-anchor="middle" class="stage-desc">write Vue SFCs</text>

  <!-- x3 label -->
  <text x="580" y="98" text-anchor="middle" class="parallel-label">x3 parallel</text>

  <!-- Merge lines from UI Gen -->
  <path d="M665,137 L710,215" class="fan-line"/>
  <path d="M665,215 L710,215" class="fan-line"/>
  <path d="M665,292 L710,215" class="fan-line"/>

  <!-- Arrow merge→fan2 -->
  <line x1="710" y1="215" x2="740" y2="215" class="arrow" style="marker-end: none"/>

  <!-- Fan-out to 3 Validation lanes -->
  <path d="M740,215 L780,140" class="fan-line"/>
  <path d="M740,215 L780,215" class="fan-line"/>
  <path d="M740,215 L780,290" class="fan-line"/>

  <!-- Stage 4a: Validation A -->
  <rect x="785" y="110" width="170" height="55" rx="10" fill="#ff9e64"/>
  <text x="870" y="133" text-anchor="middle" class="stage-label">Validation A</text>
  <text x="870" y="150" text-anchor="middle" class="stage-desc">screenshot + test</text>

  <!-- Stage 4b: Validation B -->
  <rect x="785" y="188" width="170" height="55" rx="10" fill="#ff9e64"/>
  <text x="870" y="211" text-anchor="middle" class="stage-label">Validation B</text>
  <text x="870" y="228" text-anchor="middle" class="stage-desc">screenshot + test</text>

  <!-- Stage 4c: Validation C -->
  <rect x="785" y="265" width="170" height="55" rx="10" fill="#ff9e64"/>
  <text x="870" y="288" text-anchor="middle" class="stage-label">Validation C</text>
  <text x="870" y="305" text-anchor="middle" class="stage-desc">screenshot + test</text>

  <!-- x3 label -->
  <text x="870" y="98" text-anchor="middle" class="parallel-label">x3 parallel</text>

  <!-- Merge lines from Validation -->
  <path d="M955,137 L1000,215" class="fan-line"/>
  <path d="M955,215 L1000,215" class="fan-line"/>
  <path d="M955,292 L1000,215" class="fan-line"/>

  <!-- Arrow merge→Stage 5 -->
  <line x1="1000" y1="215" x2="1020" y2="215" class="arrow"/>

  <!-- Stage 5: Setup - Mark -->
  <rect x="1030" y="180" width="140" height="70" rx="10" fill="#c3e88d"/>
  <text x="1100" y="208" text-anchor="middle" class="stage-label">Setup</text>
  <text x="1100" y="228" text-anchor="middle" class="stage-desc">mark validated</text>

  <!-- Step numbers -->
  <text x="120" y="270" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">1</text>
  <text x="330" y="270" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">2</text>
  <text x="580" y="340" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">3</text>
  <text x="870" y="340" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">4</text>
  <text x="1100" y="270" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">5</text>

  <!-- Legend -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" font-size="13" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Team Colors</text>
    <rect x="0" y="12" width="14" height="14" rx="3" fill="#c3e88d"/>
    <text x="22" y="24" class="legend-text">Setup</text>
    <rect x="90" y="12" width="14" height="14" rx="3" fill="#fede5d"/>
    <text x="112" y="24" class="legend-text">Brand</text>
    <rect x="180" y="12" width="14" height="14" rx="3" fill="#36f9f6"/>
    <text x="202" y="24" class="legend-text">UI Generation</text>
    <rect x="310" y="12" width="14" height="14" rx="3" fill="#ff9e64"/>
    <text x="332" y="24" class="legend-text">Validation</text>
  </g>

  <!-- Pipeline flow arrows at bottom -->
  <g transform="translate(40, 490)">
    <text x="0" y="0" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">Pipeline: Setup scaffolds -> Brand prepares brief -> UI Gen writes Vue SFCs -> Validation tests -> Setup marks validated</text>
  </g>
</svg>