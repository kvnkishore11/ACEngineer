<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      text { font-family: 'Inter', system-ui, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #c0caf5; }
      .subtitle { font-size: 13px; fill: #565f89; }
      .session-label { font-size: 16px; font-weight: 700; fill: #c0caf5; }
      .detail { font-size: 11px; fill: #c0caf5; }
      .muted { font-size: 11px; fill: #565f89; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#1a1b26"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" class="title">Agents Learn Across Sessions</text>
  <text x="600" y="58" text-anchor="middle" class="subtitle">12 mental model files compound knowledge</text>

  <!-- Timeline axis -->
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#565f89" stroke-width="1.5"/>
  <polygon points="1120,516 1130,520 1120,524" fill="#565f89"/>
  <text x="1145" y="524" font-size="11" fill="#565f89" font-family="Inter, system-ui, sans-serif">time</text>

  <!-- ===== SESSION 1 ===== -->
  <g transform="translate(100, 90)">
    <rect x="0" y="0" width="280" height="400" rx="10" fill="#1a1b26" stroke="#7aa2f7" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#7aa2f7" opacity="0.15"/>
    <rect x="0" y="26" width="280" height="10" fill="#7aa2f7" opacity="0.15"/>
    <text x="140" y="24" text-anchor="middle" class="session-label" fill="#7aa2f7">Session 1</text>

    <!-- Empty mental models -->
    <text x="20" y="58" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Mental Models: Empty</text>

    <!-- Expertise files (small, thin) -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="110" height="18" rx="3" fill="#565f89" opacity="0.15" stroke="#565f89" stroke-width="0.5"/>
      <text x="55" y="13" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">setup-lead.yaml</text>

      <rect x="120" y="0" width="110" height="18" rx="3" fill="#565f89" opacity="0.15" stroke="#565f89" stroke-width="0.5"/>
      <text x="175" y="13" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">brand-lead.yaml</text>

      <rect x="0" y="24" width="110" height="18" rx="3" fill="#565f89" opacity="0.15" stroke="#565f89" stroke-width="0.5"/>
      <text x="55" y="37" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">gen-lead.yaml</text>

      <rect x="120" y="24" width="110" height="18" rx="3" fill="#565f89" opacity="0.15" stroke="#565f89" stroke-width="0.5"/>
      <text x="175" y="37" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">val-lead.yaml</text>
    </g>

    <!-- Process -->
    <text x="20" y="145" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Process:</text>
    <text x="20" y="165" class="detail">1. Generate components (first attempt)</text>
    <text x="20" y="182" class="detail">2. Encounter issues, fix them</text>
    <text x="20" y="199" class="detail">3. Discover patterns that work</text>

    <!-- Arrow -->
    <text x="20" y="230" font-size="12" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Result:</text>
    <text x="20" y="250" class="detail">expertise/*.yaml updated with learnings</text>

    <!-- Quality bar -->
    <text x="20" y="285" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Generation Quality</text>
    <rect x="20" y="292" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="292" width="70" height="20" rx="4" fill="#7aa2f7" opacity="0.5"/>
    <text x="140" y="306" text-anchor="middle" font-size="10" fill="#565f89" font-family="Inter, system-ui, sans-serif">baseline</text>

    <!-- Knowledge bar -->
    <text x="20" y="335" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Accumulated Knowledge</text>
    <rect x="20" y="342" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="342" width="50" height="20" rx="4" fill="#72f1b8" opacity="0.4"/>
  </g>

  <!-- ===== SESSION 2 ===== -->
  <g transform="translate(430, 90)">
    <rect x="0" y="0" width="280" height="400" rx="10" fill="#1a1b26" stroke="#36f9f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#36f9f6" opacity="0.15"/>
    <rect x="0" y="26" width="280" height="10" fill="#36f9f6" opacity="0.15"/>
    <text x="140" y="24" text-anchor="middle" class="session-label" fill="#36f9f6">Session 2</text>

    <!-- Loaded mental models -->
    <text x="20" y="58" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Mental Models: Loaded</text>

    <!-- Expertise files (slightly thicker) -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="110" height="22" rx="3" fill="#72f1b8" opacity="0.15" stroke="#72f1b8" stroke-width="1"/>
      <text x="55" y="15" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">setup-lead.yaml</text>

      <rect x="120" y="0" width="110" height="22" rx="3" fill="#72f1b8" opacity="0.15" stroke="#72f1b8" stroke-width="1"/>
      <text x="175" y="15" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">brand-lead.yaml</text>

      <rect x="0" y="28" width="110" height="22" rx="3" fill="#72f1b8" opacity="0.15" stroke="#72f1b8" stroke-width="1"/>
      <text x="55" y="43" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">gen-lead.yaml</text>

      <rect x="120" y="28" width="110" height="22" rx="3" fill="#72f1b8" opacity="0.15" stroke="#72f1b8" stroke-width="1"/>
      <text x="175" y="43" text-anchor="middle" font-size="9" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">val-lead.yaml</text>
    </g>

    <!-- Process -->
    <text x="20" y="155" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Process:</text>
    <text x="20" y="175" class="detail">1. Read prior learnings before generating</text>
    <text x="20" y="192" class="detail">2. Apply known patterns immediately</text>
    <text x="20" y="209" class="detail">3. Discover new improvements</text>

    <!-- Result -->
    <text x="20" y="240" font-size="12" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Result:</text>
    <text x="20" y="260" class="detail">Better output + expertise compounded</text>

    <!-- Quality bar -->
    <text x="20" y="285" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Generation Quality</text>
    <rect x="20" y="292" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="292" width="140" height="20" rx="4" fill="#36f9f6" opacity="0.5"/>
    <text x="175" y="306" font-size="10" fill="#1a1b26" font-weight="600" font-family="Inter, system-ui, sans-serif">+100%</text>

    <!-- Knowledge bar -->
    <text x="20" y="335" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Accumulated Knowledge</text>
    <rect x="20" y="342" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="342" width="120" height="20" rx="4" fill="#72f1b8" opacity="0.5"/>
  </g>

  <!-- ===== SESSION N ===== -->
  <g transform="translate(760, 90)">
    <rect x="0" y="0" width="280" height="400" rx="10" fill="#1a1b26" stroke="#72f1b8" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="36" rx="10" fill="#72f1b8" opacity="0.15"/>
    <rect x="0" y="26" width="280" height="10" fill="#72f1b8" opacity="0.15"/>
    <text x="140" y="24" text-anchor="middle" class="session-label" fill="#72f1b8">Session N</text>

    <!-- Rich mental models -->
    <text x="20" y="58" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Mental Models: Rich</text>

    <!-- Expertise files (thick, prominent) -->
    <g transform="translate(20, 72)">
      <rect x="0" y="0" width="110" height="28" rx="4" fill="#72f1b8" opacity="0.2" stroke="#72f1b8" stroke-width="1.5"/>
      <text x="55" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">setup-lead.yaml</text>

      <rect x="120" y="0" width="110" height="28" rx="4" fill="#72f1b8" opacity="0.2" stroke="#72f1b8" stroke-width="1.5"/>
      <text x="175" y="18" text-anchor="middle" font-size="9" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">brand-lead.yaml</text>

      <rect x="0" y="34" width="110" height="28" rx="4" fill="#72f1b8" opacity="0.2" stroke="#72f1b8" stroke-width="1.5"/>
      <text x="55" y="52" text-anchor="middle" font-size="9" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">gen-lead.yaml</text>

      <rect x="120" y="34" width="110" height="28" rx="4" fill="#72f1b8" opacity="0.2" stroke="#72f1b8" stroke-width="1.5"/>
      <text x="175" y="52" text-anchor="middle" font-size="9" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">val-lead.yaml</text>

      <text x="115" y="80" text-anchor="middle" font-size="9" fill="#565f89" font-family="Inter, system-ui, sans-serif">+ 8 more worker expertise files</text>
    </g>

    <!-- Process -->
    <text x="20" y="175" font-size="12" font-weight="600" fill="#c0caf5" font-family="Inter, system-ui, sans-serif">Process:</text>
    <text x="20" y="195" class="detail">1. Deep expertise loaded automatically</text>
    <text x="20" y="212" class="detail">2. First-attempt quality is high</text>
    <text x="20" y="229" class="detail">3. Marginal gains still captured</text>

    <!-- Result -->
    <text x="20" y="258" font-size="12" font-weight="600" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Result:</text>
    <text x="20" y="278" class="detail">Refined generation, fewer failures</text>

    <!-- Quality bar -->
    <text x="20" y="305" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Generation Quality</text>
    <rect x="20" y="312" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="312" width="220" height="20" rx="4" fill="#72f1b8" opacity="0.6"/>
    <text x="250" y="326" font-size="10" fill="#1a1b26" font-weight="600" font-family="Inter, system-ui, sans-serif">high</text>

    <!-- Knowledge bar -->
    <text x="20" y="355" font-size="11" font-weight="600" fill="#565f89" font-family="Inter, system-ui, sans-serif">Accumulated Knowledge</text>
    <rect x="20" y="362" width="240" height="20" rx="4" fill="#565f89" opacity="0.15"/>
    <rect x="20" y="362" width="210" height="20" rx="4" fill="#72f1b8" opacity="0.6"/>
  </g>

  <!-- Connecting arrows between sessions -->
  <g transform="translate(380, 270)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#565f89" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="40,-4 48,0 40,4" fill="#565f89"/>
  </g>
  <g transform="translate(710, 270)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#565f89" stroke-width="1.5" stroke-dasharray="4,3"/>
    <polygon points="40,-4 48,0 40,4" fill="#565f89"/>
  </g>

  <!-- Session markers on timeline -->
  <circle cx="240" cy="520" r="6" fill="#7aa2f7"/>
  <text x="240" y="545" text-anchor="middle" font-size="11" fill="#7aa2f7" font-family="Inter, system-ui, sans-serif">Session 1</text>

  <circle cx="570" cy="520" r="6" fill="#36f9f6"/>
  <text x="570" y="545" text-anchor="middle" font-size="11" fill="#36f9f6" font-family="Inter, system-ui, sans-serif">Session 2</text>

  <circle cx="900" cy="520" r="6" fill="#72f1b8"/>
  <text x="900" y="545" text-anchor="middle" font-size="11" fill="#72f1b8" font-family="Inter, system-ui, sans-serif">Session N</text>

  <!-- Bottom note -->
  <text x="600" y="590" text-anchor="middle" font-size="12" fill="#565f89" font-family="Inter, system-ui, sans-serif">expertise/*.yaml files persist across sessions. Every agent reads its own mental model at startup.</text>
</svg>