<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1920 1080" width="1920" height="1080"
     role="img" aria-label="Setup Flow: Install, Test, Deploy into any codebase">
  <title>Setup Flow</title>
  <desc>
    Three-step horizontal flow: Step 1 Install, Step 2 Test Locally,
    Step 3 Deploy Into a Codebase. Each step is a card with icon, title,
    command, and description. Arrow connectors between steps. 15s looping
    CSS animation with staggered reveals. Matches project dark theme.
  </desc>

  <defs>
    <filter id="f-glow-amber" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-glow-green" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-glow-blue" x="-40%" y="-40%" width="180%" height="180%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="f-arrow" x="-60%" y="-60%" width="220%" height="220%"
            color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arr-1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    </marker>
    <marker id="arr-2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    </marker>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Play:wght@400;700&amp;display=swap');

    .t {
      font-family: 'Play', sans-serif;
      font-weight: 700;
      fill: #ffffff;
      paint-order: stroke fill;
      stroke: rgba(0,0,0,0.9);
      stroke-width: 2.5px;
      dominant-baseline: middle;
      text-anchor: middle;
    }
    .t-title  { font-size: 22px; letter-spacing: 3px; }
    .t-sub    { font-size: 13px; fill: rgba(255,255,255,0.5); stroke: rgba(0,0,0,0.8);
                stroke-width: 2px; letter-spacing: 1px; }
    .t-step   { font-size: 13px; letter-spacing: 2px; font-weight: 800; }
    .t-name   { font-size: 16px; letter-spacing: 1px; }
    .t-cmd    { font-family: 'Play', monospace; font-size: 14px; letter-spacing: 0.5px;
                font-weight: 400; stroke-width: 2px; }
    .t-desc   { font-size: 12px; fill: rgba(255,255,255,0.55); stroke: rgba(0,0,0,0.8);
                stroke-width: 2px; font-weight: 400; }
    .t-tag    { font-size: 12px; letter-spacing: 2px; fill: rgba(255,255,255,0.45);
                stroke: rgba(0,0,0,0.8); stroke-width: 2.5px; }

    /* ── TITLE ── */
    #g-title { animation: rev-title 15s infinite; }
    @keyframes rev-title {
      0%      { opacity: 0; }
      5%      { opacity: 1; }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* ── STEP 1 (amber) ── */
    #g-step1 { animation: rev-s1 15s infinite; }
    @keyframes rev-s1 {
      0%,5%   { opacity: 0; transform: translateY(12px); }
      12%     { opacity: 1; transform: translateY(0); }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* ── ARROW 1 ── */
    #g-arrow1 { animation: rev-a1 15s infinite; }
    #arrow-line1 { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw-a1 15s infinite; }
    @keyframes rev-a1 {
      0%,12%  { opacity: 0; }
      15%     { opacity: 1; }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }
    @keyframes draw-a1 {
      0%,12%  { stroke-dashoffset: 120; }
      18%     { stroke-dashoffset: 0; }
      95%     { stroke-dashoffset: 0; }
      100%    { stroke-dashoffset: 120; }
    }

    /* ── STEP 2 (green) ── */
    #g-step2 { animation: rev-s2 15s infinite; }
    @keyframes rev-s2 {
      0%,16%  { opacity: 0; transform: translateY(12px); }
      23%     { opacity: 1; transform: translateY(0); }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* ── ARROW 2 ── */
    #g-arrow2 { animation: rev-a2 15s infinite; }
    #arrow-line2 { stroke-dasharray: 120; stroke-dashoffset: 120; animation: draw-a2 15s infinite; }
    @keyframes rev-a2 {
      0%,23%  { opacity: 0; }
      26%     { opacity: 1; }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }
    @keyframes draw-a2 {
      0%,23%  { stroke-dashoffset: 120; }
      29%     { stroke-dashoffset: 0; }
      95%     { stroke-dashoffset: 0; }
      100%    { stroke-dashoffset: 120; }
    }

    /* ── STEP 3 (blue) ── */
    #g-step3 { animation: rev-s3 15s infinite; }
    @keyframes rev-s3 {
      0%,27%  { opacity: 0; transform: translateY(12px); }
      34%     { opacity: 1; transform: translateY(0); }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* ── TAGLINE ── */
    #g-tagline { animation: rev-tag 15s infinite; }
    @keyframes rev-tag {
      0%,32%  { opacity: 0; }
      38%     { opacity: 1; }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }

    /* ── STEP NUMBER PULSE (40%-80%) ── */
    #num1 { animation: pulse-num 15s infinite; }
    #num2 { animation: pulse-num 15s infinite 0.8s; }
    #num3 { animation: pulse-num 15s infinite 1.6s; }
    @keyframes pulse-num {
      0%,40%  { opacity: 1; }
      50%     { opacity: 0.5; }
      60%     { opacity: 1; }
      95%     { opacity: 1; }
      100%    { opacity: 0; }
    }
  </style>

  <!-- ════════════════════════════════════════════════
       TITLE
       ════════════════════════════════════════════════ -->
  <g id="g-title">
    <text x="960" y="100" class="t t-title">SETUP</text>
    <text x="960" y="132" class="t t-sub">Three steps to a running multi-team system</text>
  </g>

  <!-- ════════════════════════════════════════════════
       STEP 1: INSTALL (amber, cx=320)
       Card: 340x420, rx=14
       ════════════════════════════════════════════════ -->
  <g id="g-step1">
    <!-- Card -->
    <rect x="150" y="220" width="340" height="420" rx="14"
          fill="#161b2e" stroke="#f59e0b" stroke-width="2"
          filter="url(#f-glow-amber)"/>

    <!-- Step number circle -->
    <circle id="num1" cx="320" cy="290" r="32"
            fill="#161b2e" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="290" class="t t-step" style="fill:#f5e0a0; font-size:18px;">1</text>

    <!-- Title -->
    <text x="320" y="348" class="t t-name" style="fill:#f5e0a0;">INSTALL</text>

    <!-- Command box -->
    <rect x="195" y="378" width="250" height="36" rx="6"
          fill="rgba(245,158,11,0.08)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="320" y="396" class="t t-cmd" style="fill:#f59e0b;">/install</text>

    <!-- Description lines -->
    <text x="320" y="448" class="t t-desc">Checks prerequisites</text>
    <text x="320" y="470" class="t t-desc">Verifies .env + API key</text>
    <text x="320" y="492" class="t t-desc">Installs dependencies</text>
    <text x="320" y="514" class="t t-desc">Validates team config</text>
    <text x="320" y="536" class="t t-desc">Adds shell alias</text>

    <!-- Alias callout -->
    <rect x="245" y="568" width="150" height="28" rx="6"
          fill="rgba(245,158,11,0.06)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="320" y="582" class="t t-cmd" style="fill:rgba(245,158,11,0.7); font-size:12px;">alias: teams</text>
  </g>

  <!-- ════════════════════════════════════════════════
       ARROW 1 (amber → green)
       ════════════════════════════════════════════════ -->
  <g id="g-arrow1">
    <line id="arrow-line1" x1="500" y1="430" x2="610" y2="430"
          stroke="#f59e0b" stroke-width="2" stroke-linecap="round"
          marker-end="url(#arr-1)" filter="url(#f-arrow)"/>
  </g>

  <!-- ════════════════════════════════════════════════
       STEP 2: TEST LOCALLY (green, cx=790)
       ════════════════════════════════════════════════ -->
  <g id="g-step2">
    <rect x="620" y="220" width="340" height="420" rx="14"
          fill="#161b2e" stroke="#22c55e" stroke-width="2"
          filter="url(#f-glow-green)"/>

    <circle id="num2" cx="790" cy="290" r="32"
            fill="#161b2e" stroke="#22c55e" stroke-width="2"/>
    <text x="790" y="290" class="t t-step" style="fill:#a7f3d0; font-size:18px;">2</text>

    <text x="790" y="348" class="t t-name" style="fill:#a7f3d0;">TEST LOCALLY</text>

    <!-- Command box -->
    <rect x="665" y="378" width="250" height="36" rx="6"
          fill="rgba(34,197,94,0.08)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
    <text x="790" y="396" class="t t-cmd" style="fill:#22c55e;">just team</text>

    <!-- Description lines -->
    <text x="790" y="448" class="t t-desc">Launches Multi-Team Chat</text>
    <text x="790" y="470" class="t t-desc">against this source repo</text>
    <text x="790" y="504" class="t t-desc">Type "ping" to verify</text>
    <text x="790" y="526" class="t t-desc">the Orchestrator responds</text>

    <!-- Verify callout -->
    <rect x="700" y="562" width="180" height="28" rx="6"
          fill="rgba(34,197,94,0.06)" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="790" y="576" class="t t-cmd" style="fill:rgba(34,197,94,0.7); font-size:12px;">ping each team lead</text>
  </g>

  <!-- ════════════════════════════════════════════════
       ARROW 2 (green → blue)
       ════════════════════════════════════════════════ -->
  <g id="g-arrow2">
    <line id="arrow-line2" x1="970" y1="430" x2="1080" y2="430"
          stroke="#22c55e" stroke-width="2" stroke-linecap="round"
          marker-end="url(#arr-2)" filter="url(#f-arrow)"/>
  </g>

  <!-- ════════════════════════════════════════════════
       STEP 3: DEPLOY (blue, cx=1260)
       ════════════════════════════════════════════════ -->
  <g id="g-step3">
    <rect x="1090" y="220" width="340" height="420" rx="14"
          fill="#161b2e" stroke="#3b82f6" stroke-width="2"
          filter="url(#f-glow-blue)"/>

    <circle id="num3" cx="1260" cy="290" r="32"
            fill="#161b2e" stroke="#3b82f6" stroke-width="2"/>
    <text x="1260" y="290" class="t t-step" style="fill:#93c5fd; font-size:18px;">3</text>

    <text x="1260" y="340" class="t t-name" style="fill:#93c5fd;">DEPLOY INTO</text>
    <text x="1260" y="360" class="t t-name" style="fill:#93c5fd;">A CODEBASE</text>

    <!-- Command box -->
    <rect x="1115" y="382" width="290" height="36" rx="6"
          fill="rgba(59,130,246,0.08)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="1260" y="400" class="t t-cmd" style="fill:#3b82f6;">/install-into-codebase</text>

    <!-- Description lines -->
    <text x="1260" y="452" class="t t-desc">Copies agents + skills + config</text>
    <text x="1260" y="474" class="t t-desc">into your target project</text>
    <text x="1260" y="508" class="t t-desc">Creates empty expertise/</text>
    <text x="1260" y="530" class="t t-desc">and sessions/ directories</text>

    <!-- Launch callout -->
    <rect x="1180" y="562" width="160" height="28" rx="6"
          fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.3"/>
    <text x="1260" y="576" class="t t-cmd" style="fill:rgba(59,130,246,0.7); font-size:12px;">cd ~/project; teams</text>
  </g>

  <!-- ════════════════════════════════════════════════
       CUSTOMIZE CALLOUT (right side)
       ════════════════════════════════════════════════ -->
  <g id="g-step3">
    <rect x="1480" y="340" width="340" height="180" rx="10"
          fill="#161b2e" stroke="#6366f1" stroke-width="1.2"
          stroke-dasharray="6 5" stroke-opacity="0.4"/>

    <text x="1650" y="380" class="t t-step" style="fill:#a5b4fc; font-size:11px; letter-spacing:2px;">THEN CUSTOMIZE</text>

    <text x="1650" y="418" class="t t-desc" style="font-size:11px;">multi-team-config.yaml</text>
    <text x="1650" y="438" class="t t-desc" style="font-size:10px;">Add, remove, rename teams</text>

    <text x="1650" y="470" class="t t-desc" style="font-size:11px;">agents/*.md</text>
    <text x="1650" y="490" class="t t-desc" style="font-size:10px;">Tailor prompts to your domain</text>
  </g>

  <!-- ════════════════════════════════════════════════
       TAGLINE
       ════════════════════════════════════════════════ -->
  <g id="g-tagline">
    <text x="960" y="1010" class="t t-tag">
      INSTALL · TEST · DEPLOY · CUSTOMIZE
    </text>
  </g>

</svg>
