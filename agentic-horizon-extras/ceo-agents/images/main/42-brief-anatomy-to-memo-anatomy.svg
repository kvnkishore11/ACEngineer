<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500">
  <defs>
    <!-- Glows -->
    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#636da6" opacity="0.5"/>
    </marker>

    <!-- Clip paths for document shapes -->
    <clipPath id="briefClip">
      <rect x="30" y="70" width="260" height="390" rx="4"/>
    </clipPath>
    <clipPath id="memoClip">
      <rect x="660" y="70" width="260" height="390" rx="4"/>
    </clipPath>
  </defs>

  <style>
    @keyframes briefReveal {
      0%, 5% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes arrowDraw {
      0%, 40% { stroke-dashoffset: 300; opacity: 0; }
      45% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes funnelFade {
      0%, 35% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes memoReveal {
      0%, 55% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes connectionFade {
      0%, 85% { opacity: 0; }
      100% { opacity: 0.35; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    @keyframes titleReveal {
      0% { opacity: 0; }
      8% { opacity: 0; }
      15%, 100% { opacity: 1; }
    }

    /* Brief sections - staggered 1s to 3s */
    .brief-s1 { animation: briefReveal 0.8s ease-out 1.0s both; }
    .brief-s2 { animation: briefReveal 0.8s ease-out 1.4s both; }
    .brief-s3 { animation: briefReveal 0.8s ease-out 1.8s both; }
    .brief-s4 { animation: briefReveal 0.8s ease-out 2.2s both; }
    .brief-s5 { animation: briefReveal 0.8s ease-out 2.6s both; }

    /* Transformation - 3.5s to 4.5s */
    .transform-arrow {
      stroke-dasharray: 300;
      stroke-dashoffset: 300;
      animation: arrowDraw 1.5s ease-in-out 3.5s both;
    }
    .funnel-content { animation: funnelFade 1.2s ease-out 3.8s both; }

    /* Memo sections - staggered 5s to 7s */
    .memo-s1 { animation: memoReveal 0.8s ease-out 5.0s both; }
    .memo-s2 { animation: memoReveal 0.8s ease-out 5.3s both; }
    .memo-s3 { animation: memoReveal 0.8s ease-out 5.6s both; }
    .memo-s4 { animation: memoReveal 0.8s ease-out 5.9s both; }
    .memo-s5 { animation: memoReveal 0.8s ease-out 6.2s both; }
    .memo-s6 { animation: memoReveal 0.8s ease-out 6.5s both; }

    /* Connection lines - 8s */
    .conn-line { animation: connectionFade 1.5s ease-out 8.0s both; }

    /* Ambient glow pulses */
    .pulse-orange { animation: pulseGlow 3s ease-in-out 3.0s infinite; }
    .pulse-green { animation: pulseGlow 3s ease-in-out 7.5s infinite; }

    .title-anim { animation: titleReveal 2s ease-out 0s both; }
    .brief-doc { animation: briefReveal 0.6s ease-out 0.6s both; }
    .memo-doc { animation: memoReveal 0.6s ease-out 4.6s both; }

    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="950" height="500" fill="#000000" rx="0"/>

  <!-- Subtle grid -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="950" y2="100" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="950" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="950" y2="300" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="950" y2="400" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#fff" stroke-width="0.5"/>
    <line x1="475" y1="0" x2="475" y2="500" stroke="#fff" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="500" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Title -->
  <g class="title-anim">
    <text x="475" y="32" text-anchor="middle" fill="#c0caf5" font-size="14" font-weight="bold" letter-spacing="3">UNCERTAINTY IN. DECISION OUT.</text>
    <line x1="310" y1="42" x2="640" y2="42" stroke="#414868" stroke-width="0.5"/>
  </g>

  <!-- ==================== LEFT: THE BRIEF ==================== -->

  <!-- Brief document frame -->
  <g class="brief-doc">
    <rect x="30" y="70" width="260" height="390" rx="4" fill="#0d0d24" stroke="#ff9e64" stroke-width="1" opacity="0.7"/>
    <!-- Document header bar -->
    <rect x="30" y="70" width="260" height="26" rx="4" fill="#ff9e64" opacity="0.12"/>
    <rect x="30" y="92" width="260" height="4" rx="0" fill="none"/>
    <!-- Window dots -->
    <circle cx="46" cy="83" r="3" fill="#ff9e64" opacity="0.5"/>
    <circle cx="56" cy="83" r="3" fill="#ff9e64" opacity="0.3"/>
    <circle cx="66" cy="83" r="3" fill="#ff9e64" opacity="0.2"/>
    <text x="160" y="87" text-anchor="middle" fill="#ff9e64" font-size="9" font-weight="bold" letter-spacing="1.5">THE BRIEF</text>
  </g>

  <!-- Brief Section 1: Situation -->
  <g class="brief-s1">
    <rect x="42" y="108" width="236" height="42" rx="3" fill="#ff9e64" fill-opacity="0.06" stroke="#ff9e64" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="52" y="124" fill="#ff9e64" font-size="9" font-weight="bold">## Situation</text>
    <text x="52" y="140" fill="#636da6" font-size="8">"What is happening"</text>
  </g>

  <!-- Brief Section 2: Stakes -->
  <g class="brief-s2">
    <rect x="42" y="158" width="236" height="42" rx="3" fill="#ff9e64" fill-opacity="0.06" stroke="#ff9e64" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="52" y="174" fill="#ff9e64" font-size="9" font-weight="bold">## Stakes</text>
    <text x="52" y="190" fill="#636da6" font-size="8">"What's at risk"</text>
  </g>

  <!-- Brief Section 3: Constraints -->
  <g class="brief-s3">
    <rect x="42" y="208" width="236" height="42" rx="3" fill="#ff9e64" fill-opacity="0.06" stroke="#ff9e64" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="52" y="224" fill="#ff9e64" font-size="9" font-weight="bold">## Constraints</text>
    <text x="52" y="240" fill="#636da6" font-size="8">"Boundaries"</text>
  </g>

  <!-- Brief Section 4: Key Question (HIGHLIGHTED - input seed) -->
  <g class="brief-s4">
    <rect x="42" y="258" width="236" height="50" rx="3" fill="#ff9e64" opacity="0.12" stroke="#ff9e64" stroke-width="1.2"/>
    <g class="pulse-orange" filter="url(#subtleGlow)">
      <text x="52" y="276" fill="#ff9e64" font-size="9" font-weight="bold">## Key Question</text>
    </g>
    <text x="52" y="293" fill="#c0caf5" font-size="8" font-weight="bold">"The one question"</text>
    <rect x="230" y="264" width="42" height="14" rx="7" fill="#ff9e64" opacity="0.2"/>
    <text x="251" y="274" text-anchor="middle" fill="#ff9e64" font-size="6" font-weight="bold">SEED</text>
  </g>

  <!-- Brief Section 5: Context Files (dimmer, optional) -->
  <g class="brief-s5">
    <rect x="42" y="316" width="236" height="42" rx="3" fill="#ff9e64" fill-opacity="0.03" stroke="#ff9e64" stroke-width="0.3" stroke-dasharray="3,3" stroke-opacity="0.15"/>
    <text x="52" y="332" fill="#ff9e64" font-size="9" opacity="0.45">## Context Files</text>
    <text x="52" y="348" fill="#636da6" font-size="8" opacity="0.4">"Supporting data"</text>
    <text x="248" y="332" fill="#636da6" font-size="7" opacity="0.35" text-anchor="end">optional</text>
  </g>

  <!-- ==================== CENTER: TRANSFORMATION ==================== -->

  <!-- Large arrow body -->
  <g class="funnel-content">
    <!-- Funnel shape: wide on left, narrow center, wide on right -->
    <path d="M 330,160 L 370,130 L 580,130 L 620,160 L 620,340 L 580,370 L 370,370 L 330,340 Z"
          fill="#0d0d24" stroke="#414868" stroke-width="0.8" opacity="0.8"/>

    <!-- Inner gradient feel -->
    <path d="M 338,168 L 372,140 L 578,140 L 612,168 L 612,332 L 578,360 L 372,360 L 338,332 Z"
          fill="none" stroke="#7aa2f7" stroke-width="0.3" opacity="0.3"/>

    <!-- Arrow flow lines inside -->
    <line x1="345" y1="250" x2="370" y2="250" stroke="#ff9e64" stroke-width="1.5" opacity="0.4"/>
    <line x1="580" y1="250" x2="605" y2="250" stroke="#72f1b8" stroke-width="1.5" opacity="0.4"/>

    <!-- Label: "Structured Disagreement" -->
    <text x="475" y="155" text-anchor="middle" fill="#7aa2f7" font-size="8" font-weight="bold" letter-spacing="1">STRUCTURED DISAGREEMENT</text>

    <!-- Stats line -->
    <text x="475" y="392" text-anchor="middle" fill="#636da6" font-size="8.4" letter-spacing="0.5">4 experts x 3 rounds x 20 min</text>

    <!-- 4 Board Member Icons -->
    <!-- Member 1: Strategist (top-left) -->
    <g transform="translate(405, 195)">
      <circle cx="0" cy="0" r="18" fill="#0d0d24" stroke="#ff9e64" stroke-width="0.8"/>
      <!-- Head -->
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#ff9e64" stroke-width="1" opacity="0.7"/>
      <!-- Body -->
      <path d="M-8,10 Q0,2 8,10" fill="none" stroke="#ff9e64" stroke-width="1" opacity="0.7"/>
      <text x="0" y="28" text-anchor="middle" fill="#ff9e64" font-size="6" opacity="0.7">Strategist</text>
    </g>

    <!-- Member 2: Skeptic (top-right) -->
    <g transform="translate(545, 195)">
      <circle cx="0" cy="0" r="18" fill="#0d0d24" stroke="#f7768e" stroke-width="0.8"/>
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#f7768e" stroke-width="1" opacity="0.7"/>
      <path d="M-8,10 Q0,2 8,10" fill="none" stroke="#f7768e" stroke-width="1" opacity="0.7"/>
      <text x="0" y="28" text-anchor="middle" fill="#f7768e" font-size="6" opacity="0.7">Skeptic</text>
    </g>

    <!-- Member 3: Advisor (bottom-left) -->
    <g transform="translate(405, 290)">
      <circle cx="0" cy="0" r="18" fill="#0d0d24" stroke="#bb9af7" stroke-width="0.8"/>
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.7"/>
      <path d="M-8,10 Q0,2 8,10" fill="none" stroke="#bb9af7" stroke-width="1" opacity="0.7"/>
      <text x="0" y="28" text-anchor="middle" fill="#bb9af7" font-size="6" opacity="0.7">Advisor</text>
    </g>

    <!-- Member 4: Operator (bottom-right) -->
    <g transform="translate(545, 290)">
      <circle cx="0" cy="0" r="18" fill="#0d0d24" stroke="#72f1b8" stroke-width="0.8"/>
      <circle cx="0" cy="-5" r="5" fill="none" stroke="#72f1b8" stroke-width="1" opacity="0.7"/>
      <path d="M-8,10 Q0,2 8,10" fill="none" stroke="#72f1b8" stroke-width="1" opacity="0.7"/>
      <text x="0" y="28" text-anchor="middle" fill="#72f1b8" font-size="6" opacity="0.7">Operator</text>
    </g>

    <!-- Debate arrows between members -->
    <line x1="425" y1="200" x2="523" y2="200" stroke="#414868" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <line x1="425" y1="295" x2="523" y2="295" stroke="#414868" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <line x1="410" y1="220" x2="410" y2="268" stroke="#414868" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <line x1="550" y1="220" x2="550" y2="268" stroke="#414868" stroke-width="0.5" stroke-dasharray="2,2" opacity="0.4"/>
    <!-- Diagonal cross-debate -->
    <line x1="423" y1="213" x2="527" y2="275" stroke="#414868" stroke-width="0.3" stroke-dasharray="2,3" opacity="0.25"/>
    <line x1="527" y1="213" x2="423" y2="275" stroke="#414868" stroke-width="0.3" stroke-dasharray="2,3" opacity="0.25"/>

    <!-- Center deliberation symbol -->
    <circle cx="475" cy="248" r="14" fill="#0a0a1a" stroke="#7aa2f7" stroke-width="0.8" opacity="0.6"/>
    <text x="475" y="252" text-anchor="middle" fill="#7aa2f7" font-size="8" font-weight="bold" opacity="0.7">CEO</text>
  </g>

  <!-- Animated arrow paths (left entry and right exit) -->
  <path class="transform-arrow" d="M 295,250 Q 315,250 330,250" fill="none" stroke="#ff9e64" stroke-width="1.5"/>
  <path class="transform-arrow" d="M 620,250 Q 640,250 655,250" fill="none" stroke="#72f1b8" stroke-width="1.5"/>

  <!-- ==================== RIGHT: THE MEMO ==================== -->

  <!-- Memo document frame -->
  <g class="memo-doc">
    <rect x="660" y="70" width="260" height="390" rx="4" fill="#0d0d24" stroke="#72f1b8" stroke-width="1" opacity="0.7"/>
    <!-- Document header bar -->
    <rect x="660" y="70" width="260" height="26" rx="4" fill="#72f1b8" opacity="0.12"/>
    <rect x="660" y="92" width="260" height="4" rx="0" fill="none"/>
    <!-- Window dots -->
    <circle cx="676" cy="83" r="3" fill="#72f1b8" opacity="0.5"/>
    <circle cx="686" cy="83" r="3" fill="#72f1b8" opacity="0.3"/>
    <circle cx="696" cy="83" r="3" fill="#72f1b8" opacity="0.2"/>
    <text x="790" y="87" text-anchor="middle" fill="#72f1b8" font-size="9" font-weight="bold" letter-spacing="1.5">THE MEMO</text>
  </g>

  <!-- Memo Section 1: Ranked Recommendations (HIGHLIGHTED - the answer) -->
  <g class="memo-s1">
    <rect x="672" y="108" width="236" height="54" rx="3" fill="#72f1b8" opacity="0.12" stroke="#72f1b8" stroke-width="1.2"/>
    <g class="pulse-green" filter="url(#subtleGlow)">
      <text x="682" y="124" fill="#72f1b8" font-size="9" font-weight="bold">Ranked Recommendations</text>
    </g>
    <!-- Rank badges -->
    <g transform="translate(682, 133)">
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#72f1b8" opacity="0.25"/>
      <text x="7" y="11" text-anchor="middle" fill="#72f1b8" font-size="7" font-weight="bold">#1</text>
      <rect x="20" y="0" width="14" height="14" rx="3" fill="#72f1b8" opacity="0.15"/>
      <text x="27" y="11" text-anchor="middle" fill="#72f1b8" font-size="7" opacity="0.7">#2</text>
      <rect x="40" y="0" width="14" height="14" rx="3" fill="#72f1b8" opacity="0.1"/>
      <text x="47" y="11" text-anchor="middle" fill="#72f1b8" font-size="7" opacity="0.5">#3</text>
    </g>
    <rect x="860" y="114" width="42" height="14" rx="7" fill="#72f1b8" opacity="0.2"/>
    <text x="881" y="124" text-anchor="middle" fill="#72f1b8" font-size="6" font-weight="bold">ANSWER</text>
  </g>

  <!-- Memo Section 2: Board Member Stances -->
  <g class="memo-s2">
    <rect x="672" y="170" width="236" height="38" rx="3" fill="#72f1b8" fill-opacity="0.04" stroke="#72f1b8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="682" y="186" fill="#72f1b8" font-size="9" font-weight="bold">Board Member Stances</text>
    <text x="682" y="200" fill="#636da6" font-size="7">Position per member</text>
    <!-- Mini colored dots for each member -->
    <circle cx="876" cy="185" r="3" fill="#ff9e64" opacity="0.5"/>
    <circle cx="886" cy="185" r="3" fill="#f7768e" opacity="0.5"/>
    <circle cx="896" cy="185" r="3" fill="#bb9af7" opacity="0.5"/>
  </g>

  <!-- Memo Section 3: Dissent & Tensions -->
  <g class="memo-s3">
    <rect x="672" y="216" width="236" height="38" rx="3" fill="#72f1b8" fill-opacity="0.04" stroke="#72f1b8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="682" y="232" fill="#72f1b8" font-size="9" font-weight="bold">Dissent &amp; Tensions</text>
    <text x="682" y="246" fill="#636da6" font-size="7">Unresolved disagreements</text>
  </g>

  <!-- Memo Section 4: Trade-offs Table -->
  <g class="memo-s4">
    <rect x="672" y="262" width="236" height="38" rx="3" fill="#72f1b8" fill-opacity="0.04" stroke="#72f1b8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="682" y="278" fill="#72f1b8" font-size="9" font-weight="bold">Trade-offs Table</text>
    <text x="682" y="292" fill="#636da6" font-size="7">What you gain / lose</text>
  </g>

  <!-- Memo Section 5: Next Actions -->
  <g class="memo-s5">
    <rect x="672" y="308" width="236" height="38" rx="3" fill="#72f1b8" fill-opacity="0.04" stroke="#72f1b8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="682" y="324" fill="#72f1b8" font-size="9" font-weight="bold">Next Actions</text>
    <text x="682" y="338" fill="#636da6" font-size="7">Concrete steps</text>
  </g>

  <!-- Memo Section 6: Deliberation Summary -->
  <g class="memo-s6">
    <rect x="672" y="354" width="236" height="38" rx="3" fill="#72f1b8" fill-opacity="0.04" stroke="#72f1b8" stroke-width="0.5" stroke-opacity="0.2"/>
    <text x="682" y="370" fill="#72f1b8" font-size="9" font-weight="bold">Deliberation Summary</text>
    <text x="682" y="384" fill="#636da6" font-size="7">How conversation unfolded</text>
  </g>


  <!-- ==================== FOOTER LABELS ==================== -->
  <g class="title-anim">
    <text x="160" y="482" text-anchor="middle" fill="#ff9e64" font-size="7" opacity="0.5" letter-spacing="1">INPUT</text>
    <text x="475" y="482" text-anchor="middle" fill="#7aa2f7" font-size="7" opacity="0.5" letter-spacing="1">WORKFLOW</text>
    <text x="790" y="482" text-anchor="middle" fill="#72f1b8" font-size="7" opacity="0.5" letter-spacing="1">OUTPUT</text>
  </g>
</svg>