<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    .title { font: bold 18px 'Segoe UI', sans-serif; fill: #1a1a2e; }
    .phase-label { font: bold 14px 'Segoe UI', sans-serif; fill: #fff; }
    .task { font: 12px 'Segoe UI', sans-serif; fill: #2d2d44; }
    .task-bold { font: bold 12px 'Segoe UI', sans-serif; fill: #2d2d44; }
    .note { font: italic 11px 'Segoe UI', sans-serif; fill: #666; }
    .metric { font: bold 11px 'Segoe UI', sans-serif; fill: #e74c3c; }
    .metric-green { font: bold 11px 'Segoe UI', sans-serif; fill: #27ae60; }
    .risk-high { fill: #e74c3c; opacity: 0.15; }
    .risk-med { fill: #f39c12; opacity: 0.15; }
    .risk-low { fill: #27ae60; opacity: 0.15; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafbfc" rx="8"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">FDA Warning Response — Decision Framework &amp; 4-Week Execution Map</text>
  <line x1="50" y1="48" x2="850" y2="48" stroke="#ddd" stroke-width="1"/>

  <!-- Risk gradient bar -->
  <rect x="50" y="58" width="800" height="24" rx="4" class="risk-high"/>
  <rect x="250" y="58" width="600" height="24" rx="4" class="risk-med"/>
  <rect x="500" y="58" width="350" height="24" rx="4" class="risk-low"/>
  <text x="150" y="74" text-anchor="middle" class="metric">HIGH RISK</text>
  <text x="375" y="74" text-anchor="middle" class="metric" style="fill:#f39c12">MODERATE RISK</text>
  <text x="675" y="74" text-anchor="middle" class="metric-green">LOWER RISK</text>

  <!-- Phase 1: Days 1-3 -->
  <rect x="50" y="95" width="185" height="280" rx="6" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <rect x="50" y="95" width="185" height="32" rx="6" fill="#e74c3c"/>
  <rect x="50" y="115" width="185" height="12" fill="#e74c3c"/>
  <text x="142" y="116" text-anchor="middle" class="phase-label">PHASE 1: Days 1-3</text>
  <text x="142" y="145" text-anchor="middle" class="task-bold">CONTAIN</text>

  <text x="65" y="170" class="task">✓ Pull ALL flagged content</text>
  <text x="65" y="188" class="task">✓ Retain FDA reg. counsel</text>
  <text x="65" y="206" class="task">✓ Full content audit</text>
  <text x="75" y="222" class="note">(all channels, not just 9)</text>
  <text x="65" y="245" class="task">✓ Double referral → $20</text>
  <text x="65" y="263" class="task">✓ Brief CS team on narrative</text>
  <text x="65" y="286" class="task">✓ Internal positioning call</text>
  <text x="75" y="302" class="note">"Personalization engine"</text>
  <text x="75" y="318" class="note">not "health outcome brand"</text>

  <text x="142" y="358" text-anchor="middle" class="metric">Cost: $5-8K (counsel retainer)</text>

  <!-- Phase 2: Days 4-10 -->
  <rect x="255" y="95" width="185" height="280" rx="6" fill="#fff" stroke="#f39c12" stroke-width="2"/>
  <rect x="255" y="95" width="185" height="32" rx="6" fill="#f39c12"/>
  <rect x="255" y="115" width="185" height="12" fill="#f39c12"/>
  <text x="347" y="116" text-anchor="middle" class="phase-label">PHASE 2: Days 4-10</text>
  <text x="347" y="145" text-anchor="middle" class="task-bold">BUILD GOVERNANCE</text>

  <text x="270" y="170" class="task">✓ Claim taxonomy doc</text>
  <text x="280" y="186" class="note">(structure/function vs disease)</text>
  <text x="270" y="206" class="task">✓ Pre-publish checklist</text>
  <text x="270" y="224" class="task">✓ Content register (all live)</text>
  <text x="270" y="247" class="task">✓ Draft corrective plan</text>
  <text x="280" y="263" class="note">Counsel reviews before submit</text>
  <text x="270" y="286" class="task">✓ New creative briefs</text>
  <text x="280" y="302" class="note">Personalization-first copy</text>
  <text x="270" y="320" class="task">✓ Pull LTV by channel</text>

  <text x="347" y="358" text-anchor="middle" class="metric" style="fill:#f39c12">Cost: $15-20K (legal + audit)</text>

  <!-- Phase 3: Days 11-15 -->
  <rect x="460" y="95" width="185" height="280" rx="6" fill="#fff" stroke="#3498db" stroke-width="2"/>
  <rect x="460" y="95" width="185" height="32" rx="6" fill="#3498db"/>
  <rect x="460" y="115" width="185" height="12" fill="#3498db"/>
  <text x="552" y="116" text-anchor="middle" class="phase-label">PHASE 3: Days 11-15</text>
  <text x="552" y="145" text-anchor="middle" class="task-bold">SUBMIT &amp; STAGE</text>

  <text x="475" y="170" class="task">✓ Submit CAP to FDA</text>
  <text x="485" y="186" class="note">(aim Day 12, buffer to 15)</text>
  <text x="475" y="206" class="task">✓ Compliant creative through</text>
  <text x="485" y="222" class="note">governance gate + legal</text>
  <text x="475" y="245" class="task">✓ Evaluate LTV data</text>
  <text x="485" y="261" class="note">Decide channel rebalance</text>
  <text x="475" y="284" class="task">✓ SEO content commissioned</text>
  <text x="485" y="300" class="note">4-6 science-backed pieces</text>
  <text x="475" y="323" class="task">✓ Prep relaunch creative</text>

  <text x="552" y="358" text-anchor="middle" class="metric" style="fill:#3498db">Cost: $5-8K (creative + SEO)</text>

  <!-- Phase 4: Weeks 3-4 -->
  <rect x="665" y="95" width="185" height="280" rx="6" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <rect x="665" y="95" width="185" height="32" rx="6" fill="#27ae60"/>
  <rect x="665" y="115" width="185" height="12" fill="#27ae60"/>
  <text x="757" y="116" text-anchor="middle" class="phase-label">PHASE 4: Weeks 3-4</text>
  <text x="757" y="145" text-anchor="middle" class="task-bold">RELAUNCH &amp; POSITION</text>

  <text x="680" y="170" class="task">✓ Instagram ads LIVE</text>
  <text x="690" y="186" class="note">(compliant, governance-gated)</text>
  <text x="680" y="206" class="task">✓ "BlendStack Standard" page</text>
  <text x="680" y="224" class="task">✓ Monitor conversion rates</text>
  <text x="690" y="240" class="note">vs. prior benchmarks</text>
  <text x="680" y="263" class="task">✓ Normalize referral incentive</text>
  <text x="690" y="279" class="note">if Instagram recovering</text>
  <text x="680" y="302" class="task">○ Scope clinical study</text>
  <text x="690" y="318" class="note">(Phase 2 decision — Q2)</text>

  <text x="757" y="358" text-anchor="middle" class="metric-green">Target: 75% sub recovery</text>

  <!-- Arrows -->
  <path d="M237 235 L253 235" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M442 235 L458 235" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M647 235 L663 235" fill="none" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#999"/>
    </marker>
  </defs>

  <!-- Bottom: Trade-offs box -->
  <rect x="50" y="395" width="800" height="210" rx="6" fill="#fff" stroke="#ddd" stroke-width="1"/>
  <text x="450" y="418" text-anchor="middle" class="task-bold">KEY TRADE-OFFS ACCEPTED</text>
  <line x1="70" y1="428" x2="830" y2="428" stroke="#eee" stroke-width="1"/>

  <text x="70" y="452" class="task-bold">Accepted:</text>
  <text x="70" y="472" class="task">• 3-4 week Instagram blackout (not Revenue's 10-day target) — governance gate is non-negotiable</text>
  <text x="70" y="492" class="task">• $30-38K total compliance spend — this is insurance, not optional overhead</text>
  <text x="70" y="512" class="task">• 20-30% new sub drop during blackout — bridged by doubled referral + organic</text>
  <text x="70" y="532" class="task">• Repositioning around personalization — not rebuilding the same outcome-promise ads</text>

  <text x="70" y="558" class="task-bold">Deferred (not rejected):</text>
  <text x="70" y="578" class="task">• Moonshot's IRB clinical study ($50-80K) — revisit Q2 with LTV data and post-FDA-closure confidence</text>
  <text x="70" y="598" class="task">• Major PR play — build quietly through product, not press releases</text>
</svg>