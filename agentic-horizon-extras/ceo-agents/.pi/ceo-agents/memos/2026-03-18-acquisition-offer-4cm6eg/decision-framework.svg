<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn1 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn3 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes dashMarch { to { stroke-dashoffset: -20; } }
    .title { font: bold 22px 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .subtitle { font: 14px 'Segoe UI', system-ui, sans-serif; fill: #666; }
    .label { font: bold 13px 'Segoe UI', system-ui, sans-serif; fill: #fff; }
    .detail { font: 12px 'Segoe UI', system-ui, sans-serif; fill: #333; }
    .detail-bold { font: bold 12px 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .metric { font: bold 28px 'Segoe UI', system-ui, sans-serif; }
    .metric-label { font: 11px 'Segoe UI', system-ui, sans-serif; fill: #888; }
    .vote { font: bold 14px 'Segoe UI', system-ui, sans-serif; }
    .phase1 { animation: fadeIn1 0.8s ease-out forwards; }
    .phase2 { animation: fadeIn2 0.8s ease-out 0.4s both; }
    .phase3 { animation: fadeIn3 0.8s ease-out 0.8s both; }
    .glow { animation: pulse 3s ease-in-out infinite; }
    .march { stroke-dasharray: 6 4; animation: dashMarch 1.5s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#f8f9fc"/>

  <!-- Title -->
  <g class="phase1">
    <text x="40" y="42" class="title">BlendStack Acquisition Decision — Board Recommendation</text>
    <text x="40" y="62" class="subtitle">Session 4cm6eg · March 18, 2026 · $12M offer at 11x ARR</text>
    <line x1="40" y1="76" x2="860" y2="76" stroke="#e0e0e0" stroke-width="1"/>
  </g>

  <!-- Decision: Accept -->
  <g class="phase2">
    <rect x="40" y="92" width="820" height="70" rx="10" fill="#1b8a5a" opacity="0.95"/>
    <text x="60" y="122" class="label" style="font-size:16px;">RECOMMENDATION: ACCEPT THE $12M OFFER</text>
    <text x="60" y="145" class="label" style="font-weight:normal; font-size:12px; opacity:0.85;">Negotiate terms: earnout tied to R&D investment · 90-180 day knowledge transfer · 12-month founder advisory</text>
  </g>

  <!-- Key Metrics Row -->
  <g class="phase2">
    <!-- Metric 1 -->
    <rect x="40" y="180" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <text x="135" y="220" class="metric" fill="#1b8a5a" text-anchor="middle">5–1</text>
    <text x="135" y="242" class="metric-label" text-anchor="middle">BOARD VOTE</text>

    <!-- Metric 2 -->
    <rect x="250" y="180" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <text x="345" y="220" class="metric" fill="#d35400" text-anchor="middle">6.1%</text>
    <text x="345" y="242" class="metric-label" text-anchor="middle">MONTHLY CHURN (target 4%)</text>

    <!-- Metric 3 -->
    <rect x="460" y="180" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <text x="555" y="220" class="metric" fill="#2c3e50" text-anchor="middle">$180K</text>
    <text x="555" y="242" class="metric-label" text-anchor="middle">CASH RESERVE</text>

    <!-- Metric 4 -->
    <rect x="670" y="180" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0"/>
    <text x="765" y="220" class="metric" fill="#8e44ad" text-anchor="middle">4.2%</text>
    <text x="765" y="242" class="metric-label" text-anchor="middle">MoM GROWTH (was 8.1%)</text>
  </g>

  <!-- Two Paths -->
  <g class="phase3">
    <!-- Accept Path -->
    <rect x="40" y="285" width="400" height="200" rx="10" fill="#fff" stroke="#1b8a5a" stroke-width="2"/>
    <rect x="40" y="285" width="400" height="36" rx="10" fill="#1b8a5a"/>
    <rect x="40" y="305" width="400" height="16" fill="#1b8a5a"/>
    <text x="240" y="308" class="label" text-anchor="middle" style="font-size:13px;">✓ PATH A: ACCEPT (Recommended)</text>

    <text x="60" y="346" class="detail-bold">$12M cash · 11x ARR · Zero execution risk</text>
    <text x="60" y="368" class="detail">• ~$4.56M/founder after LTCG tax</text>
    <text x="60" y="388" class="detail">• Team gets retention packages</text>
    <text x="60" y="408" class="detail">• Blend engine IP transferred with protections</text>
    <text x="60" y="432" class="detail" style="fill:#d35400;">Risk: Platform value left on table if Moonshot thesis is right</text>
    <text x="60" y="452" class="detail" style="fill:#d35400;">Risk: Brand absorbed into PE rollup, loses identity</text>
    <line x="60" y1="462" x2="420" y2="462" class="march" stroke="#1b8a5a" stroke-width="1" fill="none"/>
    <text x="60" y="476" class="detail-bold" style="fill:#1b8a5a;">Certainty: HIGH · Regret window: PERMANENT</text>

    <!-- Reject Path -->
    <rect x="460" y="285" width="400" height="200" rx="10" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <rect x="460" y="285" width="400" height="36" rx="10" fill="#c0392b"/>
    <rect x="460" y="305" width="400" height="16" fill="#c0392b"/>
    <text x="660" y="308" class="label" text-anchor="middle" style="font-size:13px;">✗ PATH B: REJECT (Not Recommended)</text>

    <text x="480" y="346" class="detail-bold">Requires: churn diagnosis + capital + re-acceleration</text>
    <text x="480" y="368" class="detail">• Bear: $7.3M exit at 6x (worse outcome)</text>
    <text x="480" y="388" class="detail">• Base: $10.1M exit at 7x (still worse)</text>
    <text x="480" y="408" class="detail">• Bull: $14M exit at 8x (marginal upside)</text>
    <text x="480" y="432" class="detail" style="fill:#d35400;">Risk: Undiagnosed churn → subscriber contraction</text>
    <text x="480" y="452" class="detail" style="fill:#d35400;">Risk: No capital for growth experiments ($12K/mo net)</text>
    <line x="480" y1="462" x2="840" y2="462" class="march" stroke="#c0392b" stroke-width="1" fill="none"/>
    <text x="480" y="476" class="detail-bold" style="fill:#c0392b;">Certainty: LOW · Moonshot: $38-80M if platform pivot works</text>
  </g>

  <!-- Board Votes -->
  <g class="phase3">
    <rect x="40" y="505" width="820" height="100" rx="10" fill="#fff" stroke="#e0e0e0"/>
    <text x="60" y="530" class="detail-bold" style="font-size:13px;">BOARD POSITIONS</text>

    <!-- Accept votes -->
    <circle cx="80" cy="560" r="10" fill="#1b8a5a"/>
    <text x="96" y="565" class="vote" style="fill:#1b8a5a;">Revenue</text>
    <text x="96" y="580" class="detail">Accept. No capital for re-acceleration.</text>

    <circle cx="280" cy="560" r="10" fill="#1b8a5a"/>
    <text x="296" y="565" class="vote" style="fill:#1b8a5a;">Product</text>
    <text x="296" y="580" class="detail">Accept. Churn gate never opened.</text>

    <circle cx="460" cy="560" r="10" fill="#1b8a5a"/>
    <text x="476" y="565" class="vote" style="fill:#1b8a5a;">Technical</text>
    <text x="476" y="580" class="detail">Accept. Bucket leaks faster than faucet fills.</text>

    <circle cx="80" cy="590" r="10" fill="#1b8a5a"/>
    <text x="96" y="595" class="vote" style="fill:#1b8a5a;">Contrarian</text>
    <text x="96" y="610" class="detail">Accept. Hope ≠ strategy. Named Moonshot risk.</text>

    <circle cx="280" cy="590" r="10" fill="#f39c12"/>
    <text x="296" y="595" class="vote" style="fill:#f39c12;">Compounder</text>
    <text x="296" y="610" class="detail">Accept w/ terms. Earnout + R&amp;D protections.</text>

    <circle cx="460" cy="590" r="10" fill="#c0392b" class="glow"/>
    <text x="476" y="595" class="vote" style="fill:#c0392b;">Moonshot</text>
    <text x="476" y="610" class="detail">Reject. Blend engine is a platform, not a brand.</text>
  </g>
</svg>