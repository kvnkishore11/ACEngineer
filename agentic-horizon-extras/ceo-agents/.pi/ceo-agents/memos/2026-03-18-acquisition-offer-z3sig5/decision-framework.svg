<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .header { font-size: 13px; font-weight: 700; fill: #fff; }
    .label { font-size: 11px; font-weight: 600; fill: #374151; }
    .detail { font-size: 10px; fill: #6b7280; }
    .value { font-size: 13px; font-weight: 700; }
    .sell { fill: #059669; }
    .hold { fill: #d97706; }
    .risk { fill: #dc2626; }
    .box { rx: 8; ry: 8; }
    .connector { stroke: #d1d5db; stroke-width: 1.5; fill: none; stroke-dasharray: 6 3; }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    .flow { animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafbfc" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" class="title">BlendStack Acquisition Decision — Board Deliberation Framework</text>
  <text x="450" y="54" text-anchor="middle" class="subtitle">Session z3sig5 · March 18, 2026 · 8 Board Members · Final Vote: 5 Sell / 3 Don't Sell</text>

  <!-- Divider -->
  <line x1="40" y1="68" x2="860" y2="68" stroke="#e5e7eb" stroke-width="1"/>

  <!-- PATH A: SELL -->
  <rect x="40" y="82" width="395" height="44" fill="#059669" class="box"/>
  <text x="237" y="109" text-anchor="middle" class="header">PATH A: SELL — $12M (Recommended)</text>

  <rect x="40" y="134" width="395" height="180" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" class="box"/>
  <text x="60" y="158" class="label">Certainty</text>
  <text x="60" y="175" class="detail">$12M cash · ~$4.56M net per founder after tax</text>
  <text x="60" y="195" class="label">Key Leverage (NEW)</text>
  <text x="60" y="212" class="detail">94% retention in engaged cohort = negotiation asset</text>
  <text x="60" y="229" class="detail">Push for $2-3M retention-linked earnout</text>
  <text x="60" y="249" class="label">Board Support</text>
  <text x="60" y="266" class="detail">Revenue · Tech Architect · Contrarian · Customer Oracle · Market Strategist</text>
  <text x="60" y="286" class="label">Risk</text>
  <text x="60" y="303" class="detail">Foregone upside if churn fix works (~$30M+ potential)</text>

  <!-- PATH B: DON'T SELL -->
  <rect x="465" y="82" width="395" height="44" fill="#d97706" class="box"/>
  <text x="662" y="109" text-anchor="middle" class="header">PATH B: DON'T SELL — Platform Pivot</text>

  <rect x="465" y="134" width="395" height="180" fill="#fffbeb" stroke="#fde68a" stroke-width="1" class="box"/>
  <text x="485" y="158" class="label">Upside</text>
  <text x="485" y="175" class="detail">$30-55M exit in 24-30 months (base/ceiling)</text>
  <text x="485" y="195" class="label">Requirements</text>
  <text x="485" y="212" class="detail">$3-4M raise in 30 days · 18-24 mo platform build</text>
  <text x="485" y="229" class="detail">4-5 engineers (have 2) · B2B GTM (have none)</text>
  <text x="485" y="249" class="label">Board Support</text>
  <text x="485" y="266" class="detail">Product Strategist · Compounder · Moonshot</text>
  <text x="485" y="286" class="label">Floor Risk</text>
  <text x="485" y="303" class="detail risk">$8-9M at 7-8x if pivot fails in 24 months</text>

  <!-- PIVOT INSIGHT -->
  <rect x="40" y="330" width="820" height="70" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" class="box pulse"/>
  <text x="450" y="354" text-anchor="middle" class="label" style="fill:#1e40af;">⚡ PIVOTAL FINDING: 94% Retention in Engaged Cohort (Customer Oracle)</text>
  <text x="450" y="373" text-anchor="middle" class="detail" style="fill:#3b82f6;">Churn is a product problem, not a promise problem. ~25% of users who customize 2x in 60 days retain at 94%.</text>
  <text x="450" y="389" text-anchor="middle" class="detail" style="fill:#3b82f6;">This proves the moat works — but fixing it requires capital the company doesn't have ($180K cash, $12K/mo surplus).</text>

  <!-- VOTE MAP -->
  <text x="450" y="428" text-anchor="middle" class="label" style="font-size:12px;">BOARD POSITION MAP</text>

  <!-- Sell votes -->
  <rect x="60" y="442" width="90" height="32" fill="#059669" rx="6"/>
  <text x="105" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Revenue</text>
  <rect x="160" y="442" width="90" height="32" fill="#059669" rx="6"/>
  <text x="205" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Tech Arch</text>
  <rect x="260" y="442" width="90" height="32" fill="#059669" rx="6"/>
  <text x="305" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Contrarian</text>
  <rect x="360" y="442" width="90" height="32" fill="#059669" rx="6"/>
  <text x="405" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Cust Oracle</text>
  <rect x="460" y="442" width="90" height="32" fill="#059669" rx="6"/>
  <text x="505" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Mkt Strat</text>

  <!-- Don't sell votes -->
  <rect x="600" y="442" width="90" height="32" fill="#d97706" rx="6"/>
  <text x="645" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Product</text>
  <rect x="700" y="442" width="90" height="32" fill="#d97706" rx="6"/>
  <text x="745" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Compounder</text>
  <rect x="800" y="442" width="90" height="32" fill="#d97706" rx="6"/>
  <text x="845" y="463" text-anchor="middle" style="font-size:10px; fill:#fff; font-weight:600;">Moonshot</text>

  <!-- Labels -->
  <text x="280" y="494" text-anchor="middle" class="detail sell" style="font-weight:700;">SELL (5 votes)</text>
  <text x="745" y="494" text-anchor="middle" class="detail hold" style="font-weight:700;">DON'T SELL (3 votes)</text>

  <!-- RECOMMENDATION -->
  <rect x="40" y="512" width="820" height="90" fill="#1a1a2e" class="box"/>
  <text x="450" y="540" text-anchor="middle" style="font-size:14px; font-weight:700; fill:#10b981;">RECOMMENDATION: ACCEPT THE $12M OFFER</text>
  <text x="450" y="562" text-anchor="middle" style="font-size:11px; fill:#d1d5db;">With negotiation leverage: present 94% cohort data to NutraHoldings and push for $2-3M retention-linked earnout.</text>
  <text x="450" y="582" text-anchor="middle" style="font-size:11px; fill:#d1d5db;">Fallback: accept $12M as-is if earnout is rejected. Do not decline the offer to pursue a speculative raise.</text>

  <!-- Animated flow lines -->
  <path d="M237 314 L237 330" class="connector flow"/>
  <path d="M662 314 L662 330" class="connector flow"/>
</svg>