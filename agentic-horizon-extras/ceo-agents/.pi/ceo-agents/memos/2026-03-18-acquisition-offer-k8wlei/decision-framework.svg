<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn1 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn3 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn4 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulseGreen { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes pulseAmber { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    @keyframes dashMarch { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -20; } }
    .phase1 { animation: fadeIn1 0.8s ease-out 0.3s both; }
    .phase2 { animation: fadeIn2 0.8s ease-out 1.2s both; }
    .phase3 { animation: fadeIn3 0.8s ease-out 2.1s both; }
    .phase4 { animation: fadeIn4 0.8s ease-out 3.0s both; }
    .sell-box { animation: pulseGreen 3s ease-in-out 4s infinite; }
    .test-box { animation: pulseAmber 3s ease-in-out 4.5s infinite; }
    .flow-line { stroke-dasharray: 8 4; animation: dashMarch 1.5s linear 4s infinite; }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <g class="phase1">
    <text x="450" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">BlendStack $12M Acquisition — Decision Framework</text>
    <text x="450" y="64" text-anchor="middle" fill="#94a3b8" font-size="13">Board Vote: 7–1 SELL | Gated Decision Tree</text>
  </g>

  <!-- Gate 1: No-Shop Clause -->
  <g class="phase2">
    <rect x="300" y="90" width="300" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="450" y="115" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">GATE 1: Check No-Shop Clause</text>
    <text x="450" y="132" text-anchor="middle" fill="#cbd5e1" font-size="11">Lawyer reviews NutraHoldings LOI tonight</text>

    <!-- Branch: No-Shop EXISTS -->
    <line x1="370" y1="150" x2="200" y2="195" stroke="#ef4444" stroke-width="1.5"/>
    <text x="260" y="178" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">NO-SHOP EXISTS</text>
    <rect x="80" y="195" width="240" height="50" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2" class="sell-box"/>
    <text x="200" y="217" text-anchor="middle" fill="#f0fdf4" font-size="14" font-weight="700">→ SELL at $12M</text>
    <text x="200" y="233" text-anchor="middle" fill="#bbf7d0" font-size="10">Negotiate knowledge transfer terms</text>

    <!-- Branch: No No-Shop -->
    <line x1="530" y1="150" x2="650" y2="195" stroke="#22c55e" stroke-width="1.5"/>
    <text x="615" y="178" text-anchor="middle" fill="#86efac" font-size="10" font-weight="600">NO CLAUSE</text>
  </g>

  <!-- Gate 2: Cohort Data -->
  <g class="phase3">
    <rect x="520" y="195" width="300" height="60" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="670" y="220" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">GATE 2: Pull Cohort Data (48-72hrs)</text>
    <text x="670" y="237" text-anchor="middle" fill="#cbd5e1" font-size="11">2nd blend-edit users retain 85%+ at M6?</text>

    <!-- Branch: Unfavorable -->
    <line x1="590" y1="255" x2="440" y2="310" stroke="#ef4444" stroke-width="1.5"/>
    <text x="490" y="290" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">NO / FLAT CURVE</text>
    <rect x="300" y="310" width="280" height="50" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2" class="sell-box"/>
    <text x="440" y="332" text-anchor="middle" fill="#f0fdf4" font-size="14" font-weight="700">→ SELL at $12M</text>
    <text x="440" y="348" text-anchor="middle" fill="#bbf7d0" font-size="10">Churn is structural. Take the premium.</text>

    <!-- Branch: Favorable -->
    <line x1="750" y1="255" x2="750" y2="310" stroke="#22c55e" stroke-width="1.5"/>
    <text x="790" y="290" text-anchor="end" fill="#86efac" font-size="10" font-weight="600">YES — 85%+</text>
  </g>

  <!-- Gate 3: 30-Day Investor Test -->
  <g class="phase4">
    <rect x="600" y="310" width="280" height="60" rx="8" fill="#713f12" stroke="#f59e0b" stroke-width="1.5" class="test-box"/>
    <text x="740" y="335" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="600">GATE 3: 30-Day Investor Test</text>
    <text x="740" y="352" text-anchor="middle" fill="#fef3c7" font-size="11">5 health-tech VCs. Term sheet or bust.</text>

    <!-- Branch: No term sheet -->
    <line x1="660" y1="370" x2="500" y2="425" stroke="#ef4444" stroke-width="1.5"/>
    <text x="555" y="405" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">NO TERM SHEET</text>
    <rect x="340" y="425" width="320" height="50" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2" class="sell-box"/>
    <text x="500" y="447" text-anchor="middle" fill="#f0fdf4" font-size="14" font-weight="700">→ SELL at $12M (or renegotiated)</text>
    <text x="500" y="463" text-anchor="middle" fill="#bbf7d0" font-size="10">Market spoke. Thesis failed its test. Accept.</text>

    <!-- Branch: Term sheet -->
    <line x1="820" y1="370" x2="820" y2="425" stroke="#22c55e" stroke-width="1.5"/>
    <text x="845" y="405" text-anchor="start" fill="#86efac" font-size="10" font-weight="600">TERM SHEET</text>
    <rect x="700" y="425" width="180" height="50" rx="8" fill="#4c1d95" stroke="#a78bfa" stroke-width="2"/>
    <text x="790" y="447" text-anchor="middle" fill="#ede9fe" font-size="13" font-weight="700">→ DECLINE &amp; RAISE</text>
    <text x="790" y="463" text-anchor="middle" fill="#c4b5fd" font-size="10">Build the platform.</text>
  </g>

  <!-- Summary Stats Bar -->
  <g class="phase4">
    <rect x="40" y="510" width="820" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Vote breakdown -->
    <text x="60" y="535" fill="#94a3b8" font-size="11" font-weight="600">BOARD VOTE</text>
    <text x="60" y="555" fill="#22c55e" font-size="24" font-weight="700">7</text>
    <text x="82" y="555" fill="#94a3b8" font-size="12">SELL</text>
    <text x="60" y="575" fill="#f59e0b" font-size="24" font-weight="700">1</text>
    <text x="82" y="575" fill="#94a3b8" font-size="12">HOLD</text>
    <text x="60" y="593" fill="#64748b" font-size="10">Moonshot (dissent)</text>

    <!-- Key numbers -->
    <line x1="170" y1="520" x2="170" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="195" y="535" fill="#94a3b8" font-size="11" font-weight="600">OFFER</text>
    <text x="195" y="562" fill="#f8fafc" font-size="22" font-weight="700">$12M</text>
    <text x="195" y="580" fill="#94a3b8" font-size="11">11x ARR • All Cash</text>

    <line x1="310" y1="520" x2="310" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="335" y="535" fill="#94a3b8" font-size="11" font-weight="600">PER FOUNDER</text>
    <text x="335" y="562" fill="#f8fafc" font-size="22" font-weight="700">~$4.56M</text>
    <text x="335" y="580" fill="#94a3b8" font-size="11">After LTCG tax</text>

    <line x1="465" y1="520" x2="465" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="490" y="535" fill="#94a3b8" font-size="11" font-weight="600">REJECTION EV</text>
    <text x="490" y="562" fill="#fca5a5" font-size="22" font-weight="700">~$10-11M</text>
    <text x="490" y="580" fill="#94a3b8" font-size="11">Compounded probability</text>

    <line x1="625" y1="520" x2="625" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="650" y="535" fill="#94a3b8" font-size="11" font-weight="600">CHURN</text>
    <text x="650" y="562" fill="#fca5a5" font-size="22" font-weight="700">6.1%</text>
    <text x="650" y="580" fill="#94a3b8" font-size="11">Monthly • 8.6mo avg life</text>

    <line x1="770" y1="520" x2="770" y2="600" stroke="#334155" stroke-width="1"/>
    <text x="795" y="535" fill="#94a3b8" font-size="11" font-weight="600">CASH</text>
    <text x="795" y="562" fill="#fde68a" font-size="22" font-weight="700">$180K</text>
    <text x="795" y="580" fill="#94a3b8" font-size="11">Insufficient for pivot</text>
  </g>

  <!-- Animated flow lines -->
  <line x1="200" y1="245" x2="200" y2="280" class="flow-line" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="440" y1="360" x2="440" y2="395" class="flow-line" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
</svg>