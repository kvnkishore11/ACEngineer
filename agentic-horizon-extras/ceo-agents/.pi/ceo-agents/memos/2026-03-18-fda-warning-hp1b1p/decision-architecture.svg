<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    text { font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .phase-label { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .action-text { font-size: 10.5px; fill: #1f2937; }
    .gate-text { font-size: 10px; font-weight: 700; fill: #dc2626; }
    .note-text { font-size: 9.5px; fill: #6b7280; font-style: italic; }
    .metric-text { font-size: 10px; fill: #065f46; font-weight: 600; }
    .risk-text { font-size: 10px; fill: #991b1b; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#fafafa"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">FDA Warning Response — Day 7 Relaunch Synthesis</text>
  <text x="450" y="52" text-anchor="middle" class="subtitle">BlendStack Corrective Action Plan Timeline · Session hp1b1p · March 18, 2026</text>

  <!-- Timeline bar -->
  <rect x="60" y="70" width="780" height="6" rx="3" fill="#e5e7eb"/>

  <!-- Phase markers on timeline -->
  <circle cx="100" cy="73" r="8" fill="#dc2626"/>
  <text x="100" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">0</text>

  <circle cx="260" cy="73" r="8" fill="#f59e0b"/>
  <text x="260" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">3</text>

  <circle cx="420" cy="73" r="8" fill="#3b82f6"/>
  <text x="420" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">5</text>

  <circle cx="560" cy="73" r="8" fill="#10b981"/>
  <text x="560" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">7</text>

  <circle cx="700" cy="73" r="8" fill="#8b5cf6"/>
  <text x="700" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">10</text>

  <circle cx="800" cy="73" r="8" fill="#6366f1"/>
  <text x="800" y="77" text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700">15</text>

  <!-- PHASE 1: Day 0 — Emergency -->
  <rect x="40" y="95" width="180" height="165" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <rect x="40" y="95" width="180" height="28" rx="8" fill="#dc2626"/>
  <rect x="40" y="115" width="180" height="8" fill="#dc2626"/>
  <text x="130" y="114" text-anchor="middle" class="phase-label">DAY 0 — EMERGENCY</text>
  <text x="55" y="145" class="action-text">▸ Pull all 9 flagged items</text>
  <text x="55" y="162" class="action-text">▸ Retain FDA counsel (DSHEA)</text>
  <text x="55" y="179" class="action-text">▸ Begin Audit A (term search)</text>
  <text x="55" y="196" class="action-text">▸ Double referral ($10→$20)</text>
  <text x="55" y="218" class="gate-text">⚠ GATE: Counsel call made today</text>
  <text x="55" y="233" class="note-text">No ads live. No exceptions.</text>
  <text x="55" y="248" class="metric-text">Cost: $3-5K counsel retainer</text>

  <!-- Arrow -->
  <path d="M225 175 L240 175" stroke="#d1d5db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker></defs>

  <!-- PHASE 2: Days 1-5 — Build + Review -->
  <rect x="245" y="95" width="195" height="165" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="245" y="95" width="195" height="28" rx="8" fill="#f59e0b"/>
  <rect x="245" y="115" width="195" height="8" fill="#f59e0b"/>
  <text x="342" y="114" text-anchor="middle" class="phase-label">DAYS 1-5 — BUILD</text>
  <text x="260" y="145" class="action-text">▸ New creative brief (personalization)</text>
  <text x="260" y="162" class="action-text">▸ Product-focused visuals (no B/A)</text>
  <text x="260" y="179" class="action-text">▸ Counsel reviews full ad units</text>
  <text x="260" y="196" class="action-text">▸ Audit A completes (all channels)</text>
  <text x="260" y="218" class="gate-text">⚠ GATE: Net impression clearance</text>
  <text x="260" y="233" class="note-text">Copy + visuals + targeting reviewed</text>
  <text x="260" y="248" class="metric-text">Cost: $5-8K creative + legal</text>

  <!-- Arrow -->
  <path d="M445 175 L460 175" stroke="#d1d5db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- PHASE 3: Days 5-7 — Relaunch -->
  <rect x="465" y="95" width="155" height="165" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="465" y="95" width="155" height="28" rx="8" fill="#10b981"/>
  <rect x="465" y="115" width="155" height="8" fill="#10b981"/>
  <text x="542" y="114" text-anchor="middle" class="phase-label">DAYS 5-7 — LAUNCH</text>
  <text x="480" y="145" class="action-text">▸ Relaunch IG (if cleared)</text>
  <text x="480" y="162" class="action-text">▸ Cohort tracking live</text>
  <text x="480" y="179" class="action-text">▸ Subscriber comms sent</text>
  <text x="480" y="196" class="action-text">▸ Referral program active</text>
  <text x="480" y="218" class="gate-text">⚠ GATE: Written clearance</text>
  <text x="480" y="233" class="note-text">Day 7 is ceiling, not target</text>
  <text x="480" y="248" class="metric-text">Revenue gap: ~$1,600-2,800</text>

  <!-- Arrow -->
  <path d="M625 175 L640 175" stroke="#d1d5db" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- PHASE 4: Days 7-15 — Submit + Govern -->
  <rect x="645" y="95" width="210" height="165" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <rect x="645" y="95" width="210" height="28" rx="8" fill="#8b5cf6"/>
  <rect x="645" y="115" width="210" height="8" fill="#8b5cf6"/>
  <text x="750" y="114" text-anchor="middle" class="phase-label">DAYS 7-15 — SUBMIT</text>
  <text x="660" y="145" class="action-text">▸ Corrective plan to FDA (Day 10)</text>
  <text x="660" y="162" class="action-text">▸ Audit B begins (full net impression)</text>
  <text x="660" y="179" class="action-text">▸ Governance infrastructure built</text>
  <text x="660" y="196" class="action-text">▸ Claim taxonomy + checklist live</text>
  <text x="660" y="218" class="gate-text">⚠ GATE: Audit A in plan as exhibit</text>
  <text x="660" y="233" class="note-text">Over-deliver on detail and process</text>
  <text x="660" y="248" class="metric-text">Total cost: $25-38K compliance</text>

  <!-- Parallel Tracks Section -->
  <rect x="40" y="280" width="815" height="3" fill="#e5e7eb"/>
  <text x="450" y="305" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#374151;">PARALLEL TRACKS</text>

  <!-- Track 1: Acquisition Bridge -->
  <rect x="40" y="320" width="250" height="120" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="165" y="342" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#166534;">Acquisition Bridge</text>
  <text x="55" y="362" class="action-text">▸ Referral: $10→$20 credit (Day 1)</text>
  <text x="55" y="379" class="action-text">▸ Test Google Search headroom</text>
  <text x="55" y="396" class="action-text">▸ Monitor churn weekly</text>
  <text x="55" y="418" class="metric-text">Referral CAC: $22 (best in mix)</text>

  <!-- Track 2: Measurement -->
  <rect x="310" y="320" width="250" height="120" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="435" y="342" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#1e40af;">Measurement Gates</text>
  <text x="325" y="362" class="action-text">▸ Cohort conversion tracking (Day 7)</text>
  <text x="325" y="379" class="action-text">▸ Retention by channel analysis</text>
  <text x="325" y="396" class="action-text">▸ 60-day IG conversion gate</text>
  <text x="325" y="418" class="risk-text">If IG converts &lt;50%: channel pivot</text>

  <!-- Track 3: Strategic (Deferred) -->
  <rect x="580" y="320" width="275" height="120" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="717" y="342" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#7c3aed;">15-Month Play (Deferred)</text>
  <text x="595" y="362" class="action-text">▸ IRB protocol drafting (30-day decision)</text>
  <text x="595" y="379" class="action-text">▸ Observational study on user base</text>
  <text x="595" y="396" class="action-text">▸ Substantiated claims = exit net impression</text>
  <text x="595" y="418" class="note-text">Moonshot: 20-25x multiple vs 11x current</text>

  <!-- Risk Box -->
  <rect x="40" y="465" width="815" height="140" rx="8" fill="#fff1f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="450" y="490" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#991b1b;">KEY RISKS ON THE RECORD</text>

  <rect x="60" y="503" width="240" height="85" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="180" y="522" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#991b1b;">Conversion Uncertainty</text>
  <text x="75" y="540" class="action-text">Compliant creative may convert</text>
  <text x="75" y="554" class="action-text">40-60% worse — structural, not</text>
  <text x="75" y="568" class="action-text">fixable by better copy. 60-day gate.</text>

  <rect x="330" y="503" width="240" height="85" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="450" y="522" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#991b1b;">Unknown Violation Scope</text>
  <text x="345" y="540" class="action-text">May be 9 violations or 90. If plan</text>
  <text x="345" y="554" class="action-text">misses active violations → bad faith</text>
  <text x="345" y="568" class="action-text">finding → existential enforcement.</text>

  <rect x="600" y="503" width="240" height="85" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="720" y="522" text-anchor="middle" style="font-size:10.5px;font-weight:700;fill:#991b1b;">Counsel Supply Constraint</text>
  <text x="615" y="540" class="action-text">DSHEA + net impression counsel</text>
  <text x="615" y="554" class="action-text">scarce. If not retained today, all</text>
  <text x="615" y="568" class="action-text">timelines slip silently. Call NOW.</text>
</svg>