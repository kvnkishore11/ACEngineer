<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .phase-label { font-size: 13px; font-weight: 700; fill: #fff; }
    .action-text { font-size: 11px; fill: #1f2937; }
    .action-bold { font-size: 11px; font-weight: 700; fill: #1f2937; }
    .metric { font-size: 10px; fill: #6b7280; }
    .risk-label { font-size: 11px; font-weight: 600; fill: #dc2626; }
    .gate-label { font-size: 10px; font-weight: 700; fill: #7c3aed; }
    .node-border { stroke-width: 2; fill: #fff; rx: 8; }
    .connector { stroke: #d1d5db; stroke-width: 2; fill: none; stroke-dasharray: 6 3; }
    .connector-solid { stroke: #9ca3af; stroke-width: 2; fill: none; }
    @keyframes pulse-gate { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    .gate-ring { animation: pulse-gate 2.5s ease-in-out infinite; }
    @keyframes dash-march { to { stroke-dashoffset: -18; } }
    .connector { animation: dash-march 1.5s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" fill="#fafafa" rx="12"/>

  <!-- Title -->
  <text x="450" y="35" text-anchor="middle" class="title">LayoutForge Transition: 6-Week Decision Sequence</text>
  <text x="450" y="52" text-anchor="middle" class="subtitle">Staged freelance exit → Retention sprint → Team thesis validation</text>

  <!-- PHASE 1: Week 1 -->
  <rect x="30" y="75" width="250" height="200" rx="10" fill="#0f766e" opacity="0.1" stroke="#0f766e" stroke-width="1.5"/>
  <rect x="30" y="75" width="250" height="32" rx="10" fill="#0f766e"/>
  <text x="155" y="96" text-anchor="middle" class="phase-label">WEEK 1 — Instrument &amp; Notify</text>

  <rect x="45" y="120" width="220" height="28" class="node-border" stroke="#0f766e"/>
  <text x="155" y="139" text-anchor="middle" class="action-bold">Deploy telemetry (Sentry + events)</text>

  <rect x="45" y="158" width="220" height="28" class="node-border" stroke="#0f766e"/>
  <text x="155" y="177" text-anchor="middle" class="action-text">Notify Clients A &amp; B (30-day exit)</text>

  <rect x="45" y="196" width="220" height="28" class="node-border" stroke="#0f766e"/>
  <text x="155" y="215" text-anchor="middle" class="action-text">Interview 12 Team admins</text>

  <text x="155" y="260" text-anchor="middle" class="metric">Cost: $0 | Time: 3-4 days dev</text>

  <!-- Arrow 1→2 -->
  <path d="M 280 175 L 320 175" class="connector"/>

  <!-- PHASE 2: Weeks 2-4 -->
  <rect x="320" y="75" width="250" height="200" rx="10" fill="#1d4ed8" opacity="0.1" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="320" y="75" width="250" height="32" rx="10" fill="#1d4ed8"/>
  <text x="445" y="96" text-anchor="middle" class="phase-label">WEEKS 2–4 — Retention Sprint</text>

  <rect x="335" y="120" width="220" height="28" class="node-border" stroke="#1d4ed8"/>
  <text x="445" y="139" text-anchor="middle" class="action-bold">Ship 3 critical retention features</text>

  <rect x="335" y="158" width="220" height="28" class="node-border" stroke="#1d4ed8"/>
  <text x="445" y="177" text-anchor="middle" class="action-text">Client C → Team design partner?</text>

  <rect x="335" y="196" width="220" height="28" class="node-border" stroke="#1d4ed8"/>
  <text x="445" y="215" text-anchor="middle" class="action-text">Monitor churn w/ new telemetry</text>

  <text x="445" y="260" text-anchor="middle" class="metric">Target: churn ≤ 3.5% | Ship 2+ features</text>

  <!-- Arrow 2→3 -->
  <path d="M 570 175 L 610 175" class="connector"/>

  <!-- PHASE 3: Weeks 5-6 -->
  <rect x="610" y="75" width="260" height="200" rx="10" fill="#7c3aed" opacity="0.1" stroke="#7c3aed" stroke-width="1.5"/>
  <rect x="610" y="75" width="260" height="32" rx="10" fill="#7c3aed"/>
  <text x="740" y="96" text-anchor="middle" class="phase-label">WEEKS 5–6 — Full Commit</text>

  <rect x="625" y="120" width="230" height="28" class="node-border" stroke="#7c3aed"/>
  <text x="740" y="139" text-anchor="middle" class="action-bold">All freelance revenue ends</text>

  <rect x="625" y="158" width="230" height="28" class="node-border" stroke="#7c3aed"/>
  <text x="740" y="177" text-anchor="middle" class="action-text">First marketing spend ($500-1K)</text>

  <rect x="625" y="196" width="230" height="28" class="node-border" stroke="#7c3aed"/>
  <text x="740" y="215" text-anchor="middle" class="action-text">Team tier feature sprint begins</text>

  <text x="740" y="260" text-anchor="middle" class="metric">Savings ~$56K | Plugin covers expenses</text>

  <!-- Decision Gate -->
  <rect x="250" y="300" width="400" height="50" rx="25" fill="#7c3aed" opacity="0.12" stroke="#7c3aed" stroke-width="2" class="gate-ring"/>
  <text x="450" y="322" text-anchor="middle" class="gate-label">DECISION GATE (Week 4): Is churn ≤ 4%? Are retention features live?</text>
  <text x="450" y="338" text-anchor="middle" class="gate-label">YES → Phase 3 | NO → Retain 1 freelance client as bridge</text>

  <!-- Risk scenarios at bottom -->
  <rect x="30" y="380" width="840" height="220" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="450" y="405" text-anchor="middle" class="title" style="font-size:14px">Scenario Analysis: MRR Trajectories (3-Month Outlook)</text>

  <!-- Base case -->
  <rect x="55" y="425" width="240" height="160" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="175" y="448" text-anchor="middle" class="action-bold" style="fill:#047857">✓ BASE CASE</text>
  <text x="175" y="466" text-anchor="middle" class="action-text">15% growth, 4.2% churn</text>
  <text x="175" y="486" text-anchor="middle" class="metric">Month 1: $13,800 MRR</text>
  <text x="175" y="502" text-anchor="middle" class="metric">Month 2: $15,870 MRR</text>
  <text x="175" y="518" text-anchor="middle" class="metric">Month 3: $18,250 MRR</text>
  <text x="175" y="542" text-anchor="middle" class="action-bold" style="fill:#047857">→ On track for $50K+ by Month 12</text>
  <text x="175" y="570" text-anchor="middle" class="metric">Runway: Indefinite (plugin covers all)</text>

  <!-- Moderate stress -->
  <rect x="325" y="425" width="240" height="160" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="445" y="448" text-anchor="middle" class="action-bold" style="fill:#a16207">⚠ MODERATE STRESS</text>
  <text x="445" y="466" text-anchor="middle" class="action-text">8% growth, 6% churn</text>
  <text x="445" y="486" text-anchor="middle" class="metric">Month 1: $12,240 MRR</text>
  <text x="445" y="502" text-anchor="middle" class="metric">Month 2: $12,480 MRR</text>
  <text x="445" y="518" text-anchor="middle" class="metric">Month 3: $12,720 MRR</text>
  <text x="445" y="542" text-anchor="middle" class="action-bold" style="fill:#a16207">→ Flat growth, compounding stalls</text>
  <text x="445" y="570" text-anchor="middle" class="metric">Runway: 12+ months (buffer eroding)</text>

  <!-- Worst case -->
  <rect x="595" y="425" width="240" height="160" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="715" y="448" text-anchor="middle" class="action-bold" style="fill:#dc2626">✗ COMPETITIVE SHOCK</text>
  <text x="715" y="466" text-anchor="middle" class="action-text">2% growth, 6% churn</text>
  <text x="715" y="486" text-anchor="middle" class="metric">Month 1: $11,520 MRR</text>
  <text x="715" y="502" text-anchor="middle" class="metric">Month 2: $11,060 MRR</text>
  <text x="715" y="518" text-anchor="middle" class="metric">Month 3: $10,610 MRR</text>
  <text x="715" y="542" text-anchor="middle" class="risk-label">→ MRR declining, reactivate freelance</text>
  <text x="715" y="570" text-anchor="middle" class="metric">Runway: 8-10 months before crisis</text>
</svg>