<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    text { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .title { font-size: 20px; font-weight: 700; fill: #1a1a2e; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .header { font-size: 11px; font-weight: 600; fill: #ffffff; }
    .cell { font-size: 11px; fill: #374151; }
    .cell-bold { font-size: 11px; font-weight: 700; fill: #1a1a2e; }
    .winner { font-size: 13px; font-weight: 700; fill: #065f46; }
    .eliminated { font-size: 13px; font-weight: 700; fill: #991b1b; }
    .verdict-good { font-size: 11px; font-weight: 600; fill: #065f46; }
    .verdict-bad { font-size: 11px; font-weight: 600; fill: #991b1b; }
    .verdict-ok { font-size: 11px; font-weight: 600; fill: #92400e; }
    .condition { font-size: 11px; fill: #1e40af; font-weight: 600; }
    .note { font-size: 10px; fill: #6b7280; }
    .section-label { font-size: 13px; font-weight: 700; fill: #1a1a2e; }
    .amber-pulse { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#f8fafc"/>
  <rect x="0" y="0" width="900" height="56" rx="12" fill="#1a1a2e"/>
  <rect x="0" y="30" width="900" height="26" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="24" y="36" class="title" fill="#ffffff">Home Purchase Decision Matrix</text>
  <text x="24" y="50" class="subtitle" fill="#94a3b8">Session uxjhib · March 2026 · Board Unanimous: Option A</text>

  <!-- Table Header -->
  <rect x="24" y="72" width="852" height="32" rx="6" fill="#4f46e5"/>
  <text x="40" y="93" class="header">Metric</text>
  <text x="230" y="93" class="header">A: Buy $385K ✓</text>
  <text x="400" y="93" class="header">B: Buy $435K ✗</text>
  <text x="570" y="93" class="header">C: Wait ✗</text>
  <text x="740" y="93" class="header">D: Rent 2BR</text>

  <!-- Row backgrounds -->
  <rect x="24" y="106" width="852" height="28" fill="#f1f5f9"/>
  <rect x="24" y="134" width="852" height="28" fill="#ffffff"/>
  <rect x="24" y="162" width="852" height="28" fill="#f1f5f9"/>
  <rect x="24" y="190" width="852" height="28" fill="#ffffff"/>
  <rect x="24" y="218" width="852" height="28" fill="#f1f5f9"/>
  <rect x="24" y="246" width="852" height="28" fill="#ffffff"/>
  <rect x="24" y="274" width="852" height="28" fill="#f1f5f9"/>
  <rect x="24" y="302" width="852" height="28" fill="#ffffff"/>

  <!-- Row: Monthly Cost -->
  <text x="40" y="124" class="cell">Monthly Cost</text>
  <text x="230" y="124" class="cell-bold">$2,837</text>
  <text x="400" y="124" class="cell">$3,279</text>
  <text x="570" y="124" class="cell">$2,400 → ~$2,053</text>
  <text x="740" y="124" class="cell">$2,500</text>

  <!-- Row: Post-Close Savings -->
  <text x="40" y="152" class="cell">Post-Close Savings</text>
  <text x="230" y="152" class="verdict-ok">$31,500 ⚠️</text>
  <text x="400" y="152" class="verdict-bad">$20,000 🔴</text>
  <text x="570" y="152" class="verdict-bad">~$10,700 🔴</text>
  <text x="740" y="152" class="verdict-good">$120,000 ✅</text>

  <!-- Row: Year 1 Wealth -->
  <text x="40" y="180" class="cell">Year 1 Wealth Created</text>
  <text x="230" y="180" class="verdict-good">+$18,700</text>
  <text x="400" y="180" class="cell">+$21,200</text>
  <text x="570" y="180" class="cell">$0 (waiting)</text>
  <text x="740" y="180" class="cell">+$5,760 (HYSA)</text>

  <!-- Row: Dedicated Office -->
  <text x="40" y="208" class="cell">Dedicated Office</text>
  <text x="230" y="208" class="verdict-good">Yes — 3rd BR</text>
  <text x="400" y="208" class="verdict-good">Yes + Garage</text>
  <text x="570" y="208" class="verdict-bad">No (4-9 mo)</text>
  <text x="740" y="208" class="verdict-good">Yes — 2nd BR</text>

  <!-- Row: Emergency Runway -->
  <text x="40" y="236" class="cell">Emergency Runway</text>
  <text x="230" y="236" class="cell">9.9 months</text>
  <text x="400" y="236" class="verdict-bad">4.1 months</text>
  <text x="570" y="236" class="cell">~2.6 months</text>
  <text x="740" y="236" class="verdict-good">29+ months</text>

  <!-- Row: Flexibility -->
  <text x="40" y="264" class="cell">Relocation Flexibility</text>
  <text x="230" y="264" class="verdict-ok">Low (6% sell cost)</text>
  <text x="400" y="264" class="verdict-bad">Low</text>
  <text x="570" y="264" class="verdict-ok">Medium</text>
  <text x="740" y="264" class="verdict-good">Maximum</text>

  <!-- Row: 5-Year Net Wealth -->
  <text x="40" y="292" class="cell">5-Year Net Wealth Δ</text>
  <text x="230" y="292" class="verdict-good">+$44K vs D</text>
  <text x="400" y="292" class="cell">—</text>
  <text x="570" y="292" class="cell">Marginal/Negative</text>
  <text x="740" y="292" class="cell">Baseline</text>

  <!-- Row: Verdict -->
  <text x="40" y="320" class="cell-bold">Board Verdict</text>
  <text x="230" y="320" class="winner">✅ RECOMMENDED</text>
  <text x="400" y="320" class="eliminated">✗ ELIMINATED</text>
  <text x="570" y="320" class="eliminated">✗ ELIMINATED</text>
  <text x="740" y="320" class="verdict-ok">⚡ FALLBACK</text>

  <!-- Conditions Section -->
  <rect x="24" y="348" width="852" height="120" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
  <text x="40" y="372" class="section-label">Mandatory Conditions for Option A</text>

  <circle cx="44" cy="394" r="4" fill="#4f46e5"/>
  <text x="56" y="398" class="condition">1. Confirm remote permanence with employer before signing (documented, not assumed)</text>

  <circle cx="44" cy="418" r="4" fill="#4f46e5"/>
  <text x="56" y="422" class="condition">2. Open HELOC within 30 days of close ($50-80K standby at $0 carry cost)</text>

  <circle cx="44" cy="442" r="4" fill="#4f46e5"/>
  <text x="56" y="446" class="condition">3. Rebuild savings to $50K+ within 12 months (stage WFH setup, bank first RSU vest)</text>

  <!-- Risk Threshold Section -->
  <rect x="24" y="482" width="420" height="120" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="40" y="506" class="section-label">RTO Risk Threshold</text>
  <text x="40" y="526" class="cell">Board consensus RTO probability: 12–22%</text>
  <text x="40" y="546" class="cell">Flip threshold (A → D): ≥30–35%</text>
  <text x="40" y="566" class="cell">Current assessment: <tspan class="verdict-good">BELOW threshold — A holds</tspan></text>
  <text x="40" y="586" class="note">If employer signals shift toward hybrid, reassess immediately</text>

  <!-- HVAC Stress Test -->
  <rect x="456" y="482" width="420" height="120" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
  <text x="472" y="506" class="section-label">HVAC Stress Test ($9K at Month 3)</text>
  <text x="472" y="526" class="cell">Buffer drops to $19K → recovers via RSU vest in 90 days</text>
  <text x="472" y="546" class="cell">Mitigation: 0% HVAC financing or HELOC backstop</text>
  <text x="472" y="566" class="cell">Verdict: <tspan class="verdict-good">SURVIVABLE — thesis holds</tspan></text>
  <text x="472" y="586" class="note">Only fails on compound event (repair + layoff, ~2-3% probability)</text>
</svg>