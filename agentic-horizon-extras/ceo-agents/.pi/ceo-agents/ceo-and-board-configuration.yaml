---
# Grok (xAI OAuth) + Kimi Code (OAuth) configuration
# Auth:
#   - Grok: pi-xai-oauth → provider xai-auth  (pi /login xai-auth)
#   - Kimi: pi-kimi-coder → provider kimi-coder
#           auto-imports ~/.kimi-code (and ~/.kimi/credentials) OAuth tokens
# Budget floors are $0 because subscription usage often reports $0 API cost.
meeting:
  constraints:
    min_time_minutes: 2
    max_time_minutes: 5
    min_budget: $0
    max_budget: $5
  editor: 'code'
brief_sections:
  - section: "## Situation"
    description: "What is happening right now? State the facts. No opinion, no spin."
  - section: "## Stakes"
    description: "What's at risk? Upside if we get it right, downside if we get it wrong."
  - section: "## Constraints"
    description: "Budget, timeline, team capacity, technical debt, regulatory, contractual boundaries."
  - section: "## Key Question"
    description: "The single most important question you want the board to answer. Be specific."
paths:
  briefs: .pi/ceo-agents/briefs/
  deliberations: .pi/ceo-agents/deliberations/
  memos: .pi/ceo-agents/memos/
  agents: .pi/ceo-agents/agents-grok-kimi/
board:
  - name: Revenue
    path: .pi/ceo-agents/agents-grok-kimi/revenue.md
    color: "#ff7edb"
  - name: Product Strategist
    path: .pi/ceo-agents/agents-grok-kimi/product-strategist.md
    color: "#fede5d"
  - name: Technical Architect
    path: .pi/ceo-agents/agents-grok-kimi/technical-architect.md
    color: "#ff6e96"
  - name: Contrarian
    path: .pi/ceo-agents/agents-grok-kimi/contrarian.md
    color: "#ff9e64"
  - name: Compounder
    path: .pi/ceo-agents/agents-grok-kimi/compounder.md
    color: "#72f1b8"
  - name: Customer Oracle
    path: .pi/ceo-agents/agents-grok-kimi/customer-oracle.md
    color: "#36f9f6"
  - name: Market Strategist
    path: .pi/ceo-agents/agents-grok-kimi/market-strategist.md
    color: "#b893ce"
  - name: Moonshot
    path: .pi/ceo-agents/agents-grok-kimi/moonshot.md
    color: "#7dcfff"
