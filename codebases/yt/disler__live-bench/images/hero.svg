<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" font-family="Play, ui-sans-serif, system-ui, sans-serif" aria-label="devices -> backend -> live UI">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c17"/><stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="warmA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e86b3a"/><stop offset="100%" stop-color="#f2a66b"/>
    </linearGradient>
    <linearGradient id="coolA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4a8fe0"/><stop offset="100%" stop-color="#6fa5e8"/>
    </linearGradient>
    <linearGradient id="accA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c9dff"/><stop offset="100%" stop-color="#a3bbff"/>
    </linearGradient>
    <g id="pktA-warm"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="url(#warmA)"/><text text-anchor="middle" dy="4" font-size="9" fill="#1a0a04" font-weight="700">POST</text></g>
    <g id="pktA-cool"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="url(#coolA)"/><text text-anchor="middle" dy="4" font-size="9" fill="#091426" font-weight="700">POST</text></g>
    <g id="pktA-acc"><rect x="-14" y="-10" width="28" height="20" rx="4" fill="url(#accA)"/><text text-anchor="middle" dy="4" font-size="9" fill="#0a1030" font-weight="700">POST</text></g>
    <g id="sseA"><circle r="5" fill="#6fa5e8"/></g>
  </defs>

  <rect width="960" height="450" fill="url(#bgA)"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#f4f6fc">Devices  →  backend  →  live UI</text>
  <text x="30" y="60" font-size="13" fill="#7b8599">HTTP POST /ingest  ·  SQLite + broker  ·  SSE /stream</text>

  <!-- DEVICES -->
  <g transform="translate(30,110)">
    <rect width="180" height="62" rx="10" fill="#121829" stroke="#e86b3a"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#f2a66b">M4 Max</text>
    <text x="14" y="46" font-size="11" fill="#7b8599">live-bench stream</text>
  </g>
  <g transform="translate(30,198)">
    <rect width="180" height="62" rx="10" fill="#121829" stroke="#4a8fe0"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#6fa5e8">M5 Max</text>
    <text x="14" y="46" font-size="11" fill="#7b8599">live-bench stream</text>
  </g>
  <g transform="translate(30,286)">
    <rect width="180" height="62" rx="10" fill="#121829" stroke="#7c9dff"/>
    <text x="14" y="26" font-size="14" font-weight="700" fill="#a3bbff">Pi · CI</text>
    <text x="14" y="46" font-size="11" fill="#7b8599">live-bench emit</text>
  </g>

  <!-- BACKEND -->
  <g transform="translate(340,100)">
    <rect width="260" height="260" rx="14" fill="#121829" stroke="#1f2740"/>
    <text x="20" y="30" font-size="16" font-weight="700" fill="#f4f6fc">FastAPI · 8787</text>

    <g transform="translate(20,48)">
      <rect width="220" height="56" rx="8" fill="#0c1322" stroke="#3a5080"/>
      <text x="12" y="22" font-size="13" font-weight="700" fill="#8db0ff">POST /ingest</text>
      <text x="12" y="42" font-size="11" fill="#7b8599">validate · lock · seq++ · server_ts</text>
    </g>

    <g transform="translate(20,118)">
      <rect width="220" height="48" rx="8" fill="#0c1322" stroke="#7c9dff"/>
      <circle cx="18" cy="24" r="7" fill="#7c9dff">
        <animate attributeName="opacity" values="1;0.25;1" dur="1s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="28" font-size="12" fill="#b7bfd8">broker.publish(datapoint)</text>
    </g>

    <g transform="translate(20,180)">
      <rect width="220" height="58" rx="8" fill="#0c1322" stroke="#1f2740"/>
      <text x="12" y="22" font-size="12" font-weight="700" fill="#e08dbb">SQLite</text>
      <text x="12" y="42" font-size="11" fill="#7b8599">datapoints · seq, client_ts, server_ts</text>
    </g>
  </g>

  <!-- UI -->
  <g transform="translate(660,100)">
    <rect width="270" height="260" rx="14" fill="#161d32" stroke="#1f2740"/>
    <text x="18" y="28" font-size="15" font-weight="700" fill="#f4f6fc">BenchmarkCard</text>
    <text x="18" y="46" font-size="11" fill="#7b8599">SSE /stream · newer-wins · 1 s ease</text>

    <!-- mini chart -->
    <g transform="translate(24,70)">
      <line x1="0" y1="160" x2="222" y2="160" stroke="#4e5670"/>
      <g stroke="#1c2338" stroke-dasharray="2 5">
        <line x1="0" y1="40" x2="222" y2="40"/>
        <line x1="0" y1="80" x2="222" y2="80"/>
        <line x1="0" y1="120" x2="222" y2="120"/>
      </g>
      <!-- gguf bar: grows 0-1s, then freezes -->
      <rect x="26" y="160" width="46" height="0" fill="url(#warmA)">
        <animate attributeName="y"      values="160;44;44"    keyTimes="0;0.125;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1"/>
        <animate attributeName="height" values="0;116;116"    keyTimes="0;0.125;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0.22 1 0.36 1;0 0 1 1"/>
      </rect>
      <text x="49" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#f2a66b" opacity="0">
        <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.15;1" dur="8s" fill="freeze"/>
        1308
      </text>
      <text x="49" y="176" text-anchor="middle" font-size="11" fill="#b7bfd8">GGUF</text>
      <!-- mlx bar: idle 0-2s, grows 2-3s, then freezes -->
      <rect x="102" y="160" width="46" height="0" fill="url(#coolA)">
        <animate attributeName="y"      values="160;160;80;80"   keyTimes="0;0.25;0.375;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1;0.22 1 0.36 1;0 0 1 1"/>
        <animate attributeName="height" values="0;0;80;80"       keyTimes="0;0.25;0.375;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1;0.22 1 0.36 1;0 0 1 1"/>
      </rect>
      <text x="125" y="72" text-anchor="middle" font-size="16" font-weight="700" fill="#6fa5e8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.4;1" dur="8s" fill="freeze"/>
        720
      </text>
      <text x="125" y="176" text-anchor="middle" font-size="11" fill="#b7bfd8">MLX</text>
      <!-- pi bar: idle 0-4s, grows 4-5s, then freezes -->
      <rect x="178" y="160" width="46" height="0" fill="url(#accA)">
        <animate attributeName="y"      values="160;160;108;108" keyTimes="0;0.5;0.625;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1;0.22 1 0.36 1;0 0 1 1"/>
        <animate attributeName="height" values="0;0;52;52"       keyTimes="0;0.5;0.625;1" dur="8s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1;0.22 1 0.36 1;0 0 1 1"/>
      </rect>
      <text x="201" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#a3bbff" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.65;1" dur="8s" fill="freeze"/>
        431
      </text>
      <text x="201" y="176" text-anchor="middle" font-size="11" fill="#b7bfd8">Pi</text>
    </g>

  </g>

  <!-- rails devices -> backend -->
  <g stroke="#2a3657" stroke-width="2" stroke-dasharray="4 6" fill="none">
    <path d="M 210 140 C 290 140, 310 165, 340 180"/>
    <path d="M 210 228 L 340 230"/>
    <path d="M 210 316 C 290 316, 310 290, 340 280"/>
  </g>
  <!-- packets: visibility=hidden until their motion kicks in, so they don't
       flash at the glyph's (0,0) origin during the pre-begin window -->
  <use href="#pktA-warm" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.02s"/>
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M 210 140 C 290 140, 310 165, 340 180"/>
  </use>
  <use href="#pktA-warm" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.1s"/>
    <animateMotion dur="2.4s" begin="1.1s" repeatCount="indefinite" path="M 210 140 C 290 140, 310 165, 340 180"/>
  </use>
  <use href="#pktA-cool" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.5s"/>
    <animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M 210 228 L 340 230"/>
  </use>
  <use href="#pktA-cool" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="1.6s"/>
    <animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" path="M 210 228 L 340 230"/>
  </use>
  <use href="#pktA-acc" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.8s"/>
    <animateMotion dur="2.6s" begin="0.8s" repeatCount="indefinite" path="M 210 316 C 290 316, 310 290, 340 280"/>
  </use>

  <!-- SSE rail backend -> UI -->
  <path d="M 600 230 C 630 230, 640 230, 660 230" stroke="#6fa5e8" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <use href="#sseA" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.02s"/>
    <animateMotion dur="1.3s" repeatCount="indefinite" path="M 600 230 C 630 230, 640 230, 660 230"/>
  </use>
  <use href="#sseA" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.4s"/>
    <animateMotion dur="1.3s" begin="0.4s" repeatCount="indefinite" path="M 600 230 C 630 230, 640 230, 660 230"/>
  </use>
  <use href="#sseA" visibility="hidden">
    <set attributeName="visibility" to="visible" begin="0.8s"/>
    <animateMotion dur="1.3s" begin="0.8s" repeatCount="indefinite" path="M 600 230 C 630 230, 640 230, 660 230"/>
  </use>

  <!-- rail labels -->
  <text x="235" y="114" font-size="10" fill="#7b8599">HTTP POST</text>
  <text x="608" y="218" font-size="10" fill="#6fa5e8">SSE</text>
</svg>
