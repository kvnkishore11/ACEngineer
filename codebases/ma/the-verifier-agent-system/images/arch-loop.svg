<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" width="1500" height="1000" font-family="'JetBrains Mono','IBM Plex Mono','Fira Code',Menlo,Monaco,Consolas,monospace">
  <!-- The Verifier Agent — animated architecture, 10s seamless loop.
       Dark theme. Static elements form the system map; only the pulses,
       label highlights, and icon micro-pulses animate. SMIL only — no JS. -->

  <defs>
    <!-- Dark slate background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#181B22"/>
    </linearGradient>

    <!-- Soft drop shadow approximation for the boxes -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Solid arrowhead used for the heavy prompt + correction arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E6DFC9"/>
    </marker>
    <!-- Smaller arrowhead for the thin observation line (session.jsonl → verifier) -->
    <marker id="arrowThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E6DFC9"/>
    </marker>
  </defs>

  <!-- ───────────────── Background ───────────────── -->
  <rect width="1500" height="1000" fill="url(#bg)"/>

  <!-- ───────────────── Title ───────────────── -->
  <text x="750" y="100" font-size="44" fill="#E6DFC9" text-anchor="middle" letter-spacing="2">The Verifier Agent</text>

  <!-- ───────────────── Engineer with laptop ───────────────── -->
  <g id="engineer" stroke="#E6DFC9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Laptop screen -->
    <rect x="80" y="305" width="220" height="140" rx="10" ry="10" fill="#161A22"/>
    <!-- Camera dot -->
    <circle cx="190" cy="318" r="2.2" fill="#E6DFC9" stroke="none"/>
    <!-- Laptop base (trapezoid) -->
    <path d="M55 455 L325 455 L305 478 L75 478 Z" fill="#161A22"/>
    <!-- Trackpad notch -->
    <path d="M170 466 L210 466"/>
  </g>
  <text x="190" y="520" font-size="22" fill="#E6DFC9" text-anchor="middle" letter-spacing="0.5">You, the engineer</text>

  <!-- ───────────────── BUILDER box ───────────────── -->
  <g id="builder">
    <rect x="500" y="240" width="380" height="280" rx="22" ry="22"
          fill="#1E3733" stroke="#6FA39A" stroke-width="2.2" filter="url(#softShadow)"/>
    <!-- Label -->
    <text x="690" y="288" font-size="22" fill="#E6DFC9" text-anchor="middle" letter-spacing="0.4">
      BUILDER · verifiable
    </text>

    <!-- Terminal-window glyph -->
    <g id="builderTerminal" stroke="#E6DFC9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(560 330)">
      <rect x="0" y="0" width="120" height="100" rx="8" ry="8" fill="#161A22"/>
      <line x1="0" y1="22" x2="120" y2="22"/>
      <circle cx="14" cy="11" r="3.2" fill="#E6DFC9" stroke="none"/>
      <circle cx="28" cy="11" r="3.2" fill="#E6DFC9" stroke="none"/>
      <circle cx="42" cy="11" r="3.2" fill="#E6DFC9" stroke="none"/>
      <!-- prompt glyph -->
      <path d="M18 50 L34 64 L18 78"/>
      <line x1="42" y1="78" x2="62" y2="78"/>
      <!-- Subtle "thinking" pulse on the terminal during 2.5–4.5s -->
      <animate attributeName="opacity"
               values="1;1;0.55;1;1;1;1"
               keyTimes="0;0.25;0.35;0.45;0.55;0.95;1"
               dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Document glyph -->
    <g id="builderDoc" stroke="#E6DFC9" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(720 330)">
      <path d="M0 0 L70 0 L100 30 L100 100 L0 100 Z" fill="#161A22"/>
      <path d="M70 0 L70 30 L100 30"/>
      <line x1="18" y1="50" x2="82" y2="50"/>
      <line x1="18" y1="65" x2="82" y2="65"/>
      <line x1="18" y1="80" x2="68" y2="80"/>
    </g>
  </g>

  <!-- ───────────────── VERIFIER box ───────────────── -->
  <g id="verifier">
    <rect x="1080" y="240" width="380" height="280" rx="22" ry="22"
          fill="#3A2A14" stroke="#C99A57" stroke-width="2.2" filter="url(#softShadow)"/>
    <text x="1270" y="288" font-size="22" fill="#E6DFC9" text-anchor="middle" letter-spacing="0.4">
      VERIFIER · input locked
    </text>

    <!-- Magnifying glass — its own group so we can scale-pulse it -->
    <g id="verifierMag" stroke="#E6DFC9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1180 380)">
      <!-- transform-origin emulated by translating shapes around (0,0) inside an inner group -->
      <g>
        <circle cx="0" cy="0" r="32" fill="#161A22"/>
        <line x1="22" y1="22" x2="44" y2="44"/>
      </g>
      <!-- Tiny scale pulse during 4.5–6.5s (verifying) -->
      <animateTransform attributeName="transform" type="translate"
                        values="1180 380; 1180 380; 1180 380; 1180 380; 1180 380"
                        keyTimes="0;0.45;0.55;0.65;1"
                        dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1; 1; 1.08; 1; 1"
                        keyTimes="0;0.45;0.55;0.65;1"
                        dur="10s" repeatCount="indefinite"/>
      <!-- Tiny rotation pulse — wiggle once mid-verify -->
      <animateTransform attributeName="transform" type="rotate" additive="sum"
                        values="0; 0; -6; 4; 0; 0"
                        keyTimes="0;0.45;0.5;0.55;0.65;1"
                        dur="10s" repeatCount="indefinite"/>
    </g>

    <!-- Shield with lock — its own group so we can heartbeat-pulse during 9–10s -->
    <g id="verifierShield" stroke="#E6DFC9" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(1350 380)">
      <g>
        <path d="M0 -42 L36 -28 L36 6 C36 30 18 46 0 54 C-18 46 -36 30 -36 6 L-36 -28 Z" fill="#161A22"/>
        <!-- Lock body -->
        <rect x="-12" y="-4" width="24" height="22" rx="3" ry="3" fill="#161A22"/>
        <!-- Lock shackle -->
        <path d="M-7 -4 L-7 -12 A7 7 0 0 1 7 -12 L7 -4"/>
        <!-- Keyhole -->
        <circle cx="0" cy="6" r="2.4" fill="#E6DFC9" stroke="none"/>
        <line x1="0" y1="6" x2="0" y2="13"/>
      </g>
      <!-- Subtle heartbeat scale 9–10s -->
      <animateTransform attributeName="transform" type="translate"
                        values="1350 380;1350 380;1350 380;1350 380"
                        keyTimes="0;0.9;0.95;1"
                        dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" additive="sum"
                        values="1;1;1.07;1"
                        keyTimes="0;0.9;0.95;1"
                        dur="10s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- ───────────────── Engineer → Builder arrow ───────────────── -->
  <!-- Path the prompt pulse rides on. Static line uses marker. -->
  <g id="arrowEngineerBuilder">
    <path id="pathEB" d="M325 387 L495 387"
          stroke="#E6DFC9" stroke-width="6" fill="none" stroke-linecap="round"
          marker-end="url(#arrow)"/>
  </g>
  <!-- "prompt" label, brightens during 0–2.5s -->
  <text id="promptLabel" x="410" y="365" font-size="20" fill="#8A8275" text-anchor="middle">
    prompt
    <animate attributeName="fill"
             values="#8A8275;#E6DFC9;#E6DFC9;#8A8275;#8A8275"
             keyTimes="0;0.05;0.2;0.28;1"
             dur="10s" repeatCount="indefinite"/>
    <animate attributeName="font-weight"
             values="400;700;700;400;400"
             keyTimes="0;0.05;0.2;0.28;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- ───────────────── Verifier → Builder arrow (correction) ───────────────── -->
  <g id="arrowVerifierBuilder">
    <!-- drawn right-to-left so arrow head sits at builder side -->
    <path id="pathVB" d="M1075 387 L885 387"
          stroke="#E6DFC9" stroke-width="6" fill="none" stroke-linecap="round"
          marker-end="url(#arrow)"/>
  </g>
  <text id="correctionLabel" x="980" y="335" font-size="20" fill="#8A8275" text-anchor="middle">
    <tspan x="980" dy="0">prompt</tspan>
    <tspan x="980" dy="22">correction</tspan>
    <animate attributeName="fill"
             values="#8A8275;#8A8275;#E6DFC9;#E6DFC9;#8A8275;#8A8275"
             keyTimes="0;0.65;0.7;0.85;0.92;1"
             dur="10s" repeatCount="indefinite"/>
    <animate attributeName="font-weight"
             values="400;400;700;700;400;400"
             keyTimes="0;0.65;0.7;0.85;0.92;1"
             dur="10s" repeatCount="indefinite"/>
  </text>

  <!-- ───────────────── Connections to session.jsonl ───────────────── -->
  <!-- Builder stem (down to cylinder top) -->
  <path id="pathBuilderToSession" d="M690 520 L690 700"
        stroke="#E6DFC9" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- Verifier reads from session: cylinder right edge → up → into verifier left.
       Now carries an arrowhead to make the read-direction explicit. -->
  <path id="pathSessionToVerifier" d="M920 740 L1080 740 L1080 525"
        stroke="#E6DFC9" stroke-width="2.4" fill="none" stroke-linecap="round"
        marker-end="url(#arrowThin)"/>

  <!-- ───────────────── session.jsonl cylinder ───────────────── -->
  <g id="sessionCylinder" stroke="#E6DFC9" stroke-width="2.2" fill="#161A22" stroke-linecap="round" stroke-linejoin="round">
    <!-- body -->
    <path d="M510 700 L510 780 C510 810 590 824 690 824 C790 824 870 810 870 780 L870 700 Z"/>
    <!-- top ellipse -->
    <ellipse cx="690" cy="700" rx="180" ry="22"/>
    <!-- bottom-back curve (subtle) -->
    <path d="M510 780 C510 760 870 760 870 780" fill="none" opacity="0.35"/>
    <!-- highlight overlay during 2.5–4.5s and 4.5–6.5s -->
    <ellipse id="cylinderGlow" cx="690" cy="700" rx="180" ry="22" fill="#C99A57" opacity="0">
      <animate attributeName="opacity"
               values="0;0;0.55;0.25;0.55;0;0"
               keyTimes="0;0.25;0.32;0.45;0.55;0.65;1"
               dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <text x="690" y="780" font-size="24" fill="#E6DFC9" text-anchor="middle" stroke="none">session.jsonl</text>
  </g>

  <!-- ───────────────── Dashed link Verifier → callout ───────────────── -->
  <path d="M1380 520 L1380 720"
        stroke="#E6DFC9" stroke-width="2" stroke-dasharray="6 7" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- ───────────────── "only bash" red callout ───────────────── -->
  <g id="callout">
    <rect id="calloutBox" x="1180" y="720" width="290" height="120" rx="6" ry="6"
          fill="#1F1313" stroke="#D6635A" stroke-width="2.4">
      <!-- Brief highlight 4.5–6.5s -->
      <animate attributeName="fill"
               values="#1F1313;#1F1313;#3D1A18;#1F1313;#1F1313"
               keyTimes="0;0.45;0.55;0.65;1"
               dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"
               values="2.4;2.4;3.6;2.4;2.4"
               keyTimes="0;0.45;0.55;0.65;1"
               dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1200" y="760" font-size="22" fill="#E89A93">only bash:</text>
    <text x="1200" y="800" font-size="18" fill="#E6DFC9">uv run verify_sqlite.py</text>
  </g>

  <!-- ───────────────── Bottom value-prop pill ───────────────── -->
  <g id="defensePill">
    <rect id="defensePillBox" x="120" y="900" width="1260" height="64" rx="32" ry="32"
          fill="#161A22" stroke="#E6DFC9" stroke-width="2">
      <!-- Brief glow 9–10s -->
      <animate attributeName="fill"
               values="#161A22;#161A22;#2A2415;#161A22"
               keyTimes="0;0.9;0.95;1"
               dur="10s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width"
               values="2;2;3.2;2"
               keyTimes="0;0.9;0.95;1"
               dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="750" y="940" font-size="20" fill="#E6DFC9" text-anchor="middle" letter-spacing="0.3">
      Two Agent System + Spend Tokens To Save Time + Custom Verifier Agent + Script Only Bash Policy
    </text>
  </g>

  <!-- ═══════════════════════════════════════════════════════
       ANIMATED PULSES — moving dots that ride along paths.
       Each is hidden (opacity 0) outside its phase window so
       the system feels calm; only one channel pulses at a time.
       ═══════════════════════════════════════════════════════ -->

  <!-- Phase 1 (0.0–2.5s): prompt pulse engineer → builder -->
  <circle r="9" fill="#E6DFC9" opacity="0">
    <animate attributeName="opacity"
             values="0;1;1;0;0"
             keyTimes="0;0.005;0.24;0.255;1"
             dur="10s" repeatCount="indefinite"/>
    <animateMotion dur="10s" repeatCount="indefinite"
                   keyTimes="0;0.005;0.25;1"
                   keyPoints="0;0;1;1"
                   calcMode="linear">
      <mpath href="#pathEB"/>
    </animateMotion>
  </circle>

  <!-- Phase 2 (2.5–4.5s): downward pulse builder → session.jsonl -->
  <circle r="9" fill="#E6DFC9" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.25;0.255;0.44;0.455;1"
             dur="10s" repeatCount="indefinite"/>
    <animateMotion dur="10s" repeatCount="indefinite"
                   keyTimes="0;0.25;0.45;1"
                   keyPoints="0;0;1;1"
                   calcMode="linear">
      <mpath href="#pathBuilderToSession"/>
    </animateMotion>
  </circle>

  <!-- Phase 3 (4.5–6.5s): pulse rises session.jsonl → verifier -->
  <circle r="9" fill="#C99A57" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.45;0.455;0.64;0.655;1"
             dur="10s" repeatCount="indefinite"/>
    <animateMotion dur="10s" repeatCount="indefinite"
                   keyTimes="0;0.45;0.65;1"
                   keyPoints="0;0;1;1"
                   calcMode="linear">
      <mpath href="#pathSessionToVerifier"/>
    </animateMotion>
  </circle>

  <!-- Phase 4 (6.5–9.0s): correction pulse verifier → builder -->
  <circle r="9" fill="#D6635A" opacity="0">
    <animate attributeName="opacity"
             values="0;0;1;1;0;0"
             keyTimes="0;0.65;0.655;0.89;0.9;1"
             dur="10s" repeatCount="indefinite"/>
    <animateMotion dur="10s" repeatCount="indefinite"
                   keyTimes="0;0.65;0.9;1"
                   keyPoints="0;0;1;1"
                   calcMode="linear">
      <mpath href="#pathVB"/>
    </animateMotion>
  </circle>

</svg>
