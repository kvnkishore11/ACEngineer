name: Aegis
tagline: "White hat agents securing your future"
tone: precise, vigilant, trustworthy
audience: engineering teams deploying agents in production

identity:
  mission: "Proactive agent security — white hat teams that never sleep"
  description: |
    Aegis deploys preemptive and defensive agent teams that continuously
    monitor, detect, and neutralize threats to your agent infrastructure.
    Red means danger. White means secured. We turn your systems white.
  keywords:
    - "agent security"
    - "white hat agents"
    - "threat detection"
    - "defensive AI"
    - "production agent monitoring"
  voice: "precise, confident, zero-fluff — like a security briefing"
  avoid:
    - "hype language"
    - "fear mongering"
    - "vague promises"

palette:
  primary: "#f0f0f5"
  secondary: "#6e7fff"
  accent: "#e63946"
  background: "#0a0a0f"
  bg-secondary: "#12121a"
  surface: "#1a1a2e"
  text: "#e8e8ed"
  muted: "#5a5a72"
  border: "#2a2a3e"
  overlay: "rgba(10, 10, 15, 0.8)"
  error: "#ff2d2d"
  warning: "#e63946"
  success: "#f0f0f5"

typography:
  heading: "Play"
  body: "Play"
  mono: "Play"
  scale:
    h1: { size: "4.5rem", weight: 700, tracking: "-0.04em" }
    h2: { size: "2.75rem", weight: 700, tracking: "-0.025em" }
    h3: { size: "1.875rem", weight: 700 }
    body: { size: "1.0625rem", weight: 400, line-height: 1.7 }
    small: { size: "0.9375rem", weight: 400 }
    caption: { size: "0.75rem", weight: 400, tracking: "0.04em" }

spacing:
  unit: "0.5rem"
  radius-sm: "0.5rem"
  radius-md: "1rem"
  radius-lg: "1.5rem"
  container-max: "1200px"

breakpoints:
  sm: "640px"
  md: "768px"
  lg: "1024px"
  xl: "1280px"

shadows:
  sm: "0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 2px rgba(0, 0, 0, 0.4)"
  md: "0 6px 16px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(0, 0, 0, 0.4)"
  lg: "0 20px 40px rgba(0, 0, 0, 0.7), 0 8px 16px rgba(0, 0, 0, 0.5)"

motion:
  duration-fast: "150ms"
  duration-normal: "350ms"
  duration-slow: "600ms"
  easing: "cubic-bezier(0.25, 0.46, 0.45, 0.94)"

assets:
  logo: "public/assets/logo.svg"
  favicon: "public/assets/favicon.svg"
  media:
    - path: "public/assets/hero-placeholder.png"
      description: "Aegis hero placeholder image"
    - path: "public/assets/og-card.png"
      description: "Aegis Open Graph social card"
