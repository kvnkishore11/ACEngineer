name: Aegis Mobile
tagline: "Agent security in your pocket"

identity:
  mission: "Bring the full Aegis security command center to phone and tablet viewports"

typography:
  scale:
    h1: { size: "2.5rem", weight: 700, tracking: "-0.03em" }
    h2: { size: "1.75rem", weight: 700, tracking: "-0.015em" }
    body: { size: "1rem", weight: 400, line-height: 1.6 }

spacing:
  unit: "0.375rem"
  radius-sm: "0.625rem"
  radius-md: "1rem"
  radius-lg: "1.375rem"
  container-max: "428px"
