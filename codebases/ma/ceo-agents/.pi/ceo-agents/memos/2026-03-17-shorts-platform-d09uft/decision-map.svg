<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn1 { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeIn2 { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeIn3 { from { opacity: 0 } to { opacity: 1 } }
    @keyframes fadeIn4 { from { opacity: 0 } to { opacity: 1 } }
    @keyframes pulse { 0%,100% { opacity: 0.7 } 50% { opacity: 1 } }
    @keyframes dash { to { stroke-dashoffset: -12 } }
    .phase1 { animation: fadeIn1 0.8s ease-out 0.3s both }
    .phase2 { animation: fadeIn2 0.8s ease-out 0.8s both }
    .phase3 { animation: fadeIn3 0.8s ease-out 1.3s both }
    .phase4 { animation: fadeIn4 0.8s ease-out 1.8s both }
    .pulse { animation: pulse 3s ease-in-out infinite }
    .flow-line { stroke-dasharray: 6 6; animation: dash 1.5s linear infinite }
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#0f1419"/>

  <!-- Title -->
  <g class="phase1">
    <text x="450" y="38" text-anchor="middle" fill="#e7e9ea" font-size="18" font-weight="700">BlendStack — Shorts Platform Decision</text>
    <text x="450" y="58" text-anchor="middle" fill="#71767b" font-size="12">$8K/month budget • 2-person team • 6-month horizon</text>
  </g>

  <!-- DECISION: YouTube Shorts (center top) -->
  <g class="phase1">
    <rect x="310" y="75" width="280" height="56" rx="10" fill="#1d9bf0" fill-opacity="0.15" stroke="#1d9bf0" stroke-width="2"/>
    <text x="450" y="100" text-anchor="middle" fill="#1d9bf0" font-size="15" font-weight="700">✓ YOUTUBE SHORTS</text>
    <text x="450" y="118" text-anchor="middle" fill="#8ecdf7" font-size="11">Primary platform — search + education + compounding</text>
  </g>

  <!-- REJECTED options -->
  <g class="phase2" opacity="0.5">
    <rect x="30" y="80" width="140" height="44" rx="8" fill="#f4212e" fill-opacity="0.08" stroke="#f4212e" stroke-width="1"/>
    <text x="100" y="100" text-anchor="middle" fill="#f4212e" font-size="11" font-weight="600">✗ TikTok</text>
    <text x="100" y="114" text-anchor="middle" fill="#71767b" font-size="9">Wrong demo, ban risk</text>

    <rect x="190" y="80" width="105" height="44" rx="8" fill="#f4212e" fill-opacity="0.08" stroke="#f4212e" stroke-width="1"/>
    <text x="242" y="100" text-anchor="middle" fill="#f4212e" font-size="11" font-weight="600">✗ Multi-plat</text>
    <text x="242" y="114" text-anchor="middle" fill="#71767b" font-size="9">2 people ≠ 3 channels</text>

    <rect x="605" y="80" width="140" height="44" rx="8" fill="#f4212e" fill-opacity="0.08" stroke="#f4212e" stroke-width="1"/>
    <text x="675" y="100" text-anchor="middle" fill="#f4212e" font-size="11" font-weight="600">✗ IG Reels Primary</text>
    <text x="675" y="114" text-anchor="middle" fill="#71767b" font-size="9">Channel fatiguing</text>

    <rect x="760" y="80" width="110" height="44" rx="8" fill="#f4212e" fill-opacity="0.08" stroke="#f4212e" stroke-width="1"/>
    <text x="815" y="100" text-anchor="middle" fill="#f4212e" font-size="11" font-weight="600">✗ Kill Blog</text>
    <text x="815" y="114" text-anchor="middle" fill="#71767b" font-size="9">$8 CAC still live</text>
  </g>

  <!-- Budget Split Header -->
  <g class="phase2">
    <text x="450" y="165" text-anchor="middle" fill="#e7e9ea" font-size="14" font-weight="700">BUDGET ALLOCATION — $8,000/month</text>
    <line x1="150" y1="175" x2="750" y2="175" stroke="#2f3336" stroke-width="1"/>
  </g>

  <!-- Retention Bucket (60%) -->
  <g class="phase2">
    <rect x="40" y="190" width="400" height="210" rx="10" fill="#00ba7c" fill-opacity="0.06" stroke="#00ba7c" stroke-width="1.5"/>
    <text x="240" y="215" text-anchor="middle" fill="#00ba7c" font-size="14" font-weight="700">RETENTION &amp; ACTIVATION — $5,000 (62%)</text>
    <text x="240" y="232" text-anchor="middle" fill="#71767b" font-size="10">Attacking 6.1% churn → 4.0% target</text>

    <!-- Line items -->
    <rect x="60" y="248" width="360" height="32" rx="6" fill="#00ba7c" fill-opacity="0.08"/>
    <text x="72" y="268" fill="#e7e9ea" font-size="11" font-weight="600">Activation Email Sequence</text>
    <text x="340" y="268" text-anchor="end" fill="#00ba7c" font-size="11" font-weight="700">$2,500</text>
    <text x="408" y="268" text-anchor="end" fill="#71767b" font-size="9">Day 7/21/45</text>

    <rect x="60" y="288" width="360" height="32" rx="6" fill="#00ba7c" fill-opacity="0.05"/>
    <text x="72" y="308" fill="#e7e9ea" font-size="11" font-weight="600">Referral Program Redesign</text>
    <text x="340" y="308" text-anchor="end" fill="#00ba7c" font-size="11" font-weight="700">$1,500</text>
    <text x="408" y="308" text-anchor="end" fill="#71767b" font-size="9">$22 CAC</text>

    <rect x="60" y="328" width="360" height="32" rx="6" fill="#00ba7c" fill-opacity="0.08"/>
    <text x="72" y="348" fill="#e7e9ea" font-size="11" font-weight="600">In-App Blend Prompt (Day 14)</text>
    <text x="340" y="348" text-anchor="end" fill="#00ba7c" font-size="11" font-weight="700">$1,000</text>
    <text x="408" y="348" text-anchor="end" fill="#71767b" font-size="9">Eng sprint</text>

    <!-- Key stat -->
    <rect x="100" y="370" width="280" height="22" rx="4" fill="#00ba7c" fill-opacity="0.12"/>
    <text x="240" y="385" text-anchor="middle" fill="#00ba7c" font-size="10" font-weight="600">94% retention when 2+ blend edits in 60 days</text>
  </g>

  <!-- YouTube Bucket (38%) -->
  <g class="phase3">
    <rect x="460" y="190" width="400" height="210" rx="10" fill="#1d9bf0" fill-opacity="0.06" stroke="#1d9bf0" stroke-width="1.5"/>
    <text x="660" y="215" text-anchor="middle" fill="#1d9bf0" font-size="14" font-weight="700">YOUTUBE SHORTS — $3,000 (38%)</text>
    <text x="660" y="232" text-anchor="middle" fill="#71767b" font-size="10">Search-first educational content</text>

    <rect x="480" y="248" width="360" height="32" rx="6" fill="#1d9bf0" fill-opacity="0.08"/>
    <text x="492" y="268" fill="#e7e9ea" font-size="11" font-weight="600">Production System Design</text>
    <text x="828" y="268" text-anchor="end" fill="#71767b" font-size="9">Wk 1–2</text>

    <rect x="480" y="288" width="360" height="32" rx="6" fill="#1d9bf0" fill-opacity="0.05"/>
    <text x="492" y="308" fill="#e7e9ea" font-size="11" font-weight="600">Batch Shoot → 8–12 Shorts/mo</text>
    <text x="828" y="308" text-anchor="end" fill="#71767b" font-size="9">Wk 3+</text>

    <rect x="480" y="328" width="360" height="32" rx="6" fill="#1d9bf0" fill-opacity="0.08"/>
    <text x="492" y="348" fill="#e7e9ea" font-size="11" font-weight="600">Blog → Script Library (2 posts/mo)</text>
    <text x="828" y="348" text-anchor="end" fill="#71767b" font-size="9">Migrate</text>

    <rect x="520" y="370" width="280" height="22" rx="4" fill="#1d9bf0" fill-opacity="0.12"/>
    <text x="660" y="385" text-anchor="middle" fill="#1d9bf0" font-size="10" font-weight="600">Attribution: View → Email → Trial → Paid Sub</text>
  </g>

  <!-- Timeline -->
  <g class="phase4">
    <text x="450" y="435" text-anchor="middle" fill="#e7e9ea" font-size="14" font-weight="700">EXECUTION TIMELINE &amp; DECISION GATES</text>
    <line x1="80" y1="445" x2="820" y2="445" stroke="#2f3336" stroke-width="1"/>

    <!-- Timeline bar -->
    <rect x="80" y="460" width="740" height="8" rx="4" fill="#2f3336"/>

    <!-- Day markers -->
    <rect x="80" y="460" width="4" height="8" rx="2" fill="#e7e9ea"/>
    <text x="80" y="485" text-anchor="middle" fill="#71767b" font-size="10">Day 1</text>

    <rect x="203" y="460" width="4" height="8" rx="2" fill="#e7e9ea"/>
    <text x="205" y="485" text-anchor="middle" fill="#71767b" font-size="10">Day 14</text>

    <rect x="327" y="458" width="6" height="12" rx="3" fill="#ffd400" class="pulse"/>
    <text x="330" y="485" text-anchor="middle" fill="#ffd400" font-size="10" font-weight="600">Day 30</text>
    <text x="330" y="498" text-anchor="middle" fill="#ffd400" font-size="9">CHECKPOINT</text>

    <rect x="450" y="458" width="6" height="12" rx="3" fill="#ff7a00" class="pulse"/>
    <text x="453" y="485" text-anchor="middle" fill="#ff7a00" font-size="10" font-weight="600">Day 45</text>
    <text x="453" y="498" text-anchor="middle" fill="#ff7a00" font-size="9">GATE</text>

    <rect x="573" y="458" width="6" height="12" rx="3" fill="#f4212e" class="pulse"/>
    <text x="576" y="485" text-anchor="middle" fill="#f4212e" font-size="10" font-weight="600">Day 60</text>
    <text x="576" y="498" text-anchor="middle" fill="#f4212e" font-size="9">REVIEW</text>

    <rect x="820" y="458" width="6" height="12" rx="3" fill="#f4212e" class="pulse"/>
    <text x="820" y="485" text-anchor="middle" fill="#f4212e" font-size="10" font-weight="600">Day 90</text>
    <text x="820" y="498" text-anchor="middle" fill="#f4212e" font-size="9">BLOG GATE</text>

    <!-- Phase bars -->
    <rect x="80" y="512" width="247" height="20" rx="4" fill="#00ba7c" fill-opacity="0.2"/>
    <text x="203" y="526" text-anchor="middle" fill="#00ba7c" font-size="9" font-weight="600">Retention deploys + Churn diagnosis runs</text>

    <rect x="80" y="538" width="247" height="20" rx="4" fill="#1d9bf0" fill-opacity="0.15"/>
    <text x="203" y="552" text-anchor="middle" fill="#1d9bf0" font-size="9" font-weight="600">YT production system build</text>

    <rect x="330" y="538" width="490" height="20" rx="4" fill="#1d9bf0" fill-opacity="0.25"/>
    <text x="575" y="552" text-anchor="middle" fill="#1d9bf0" font-size="9" font-weight="600">YouTube Shorts live → measure attribution</text>

    <!-- Flow lines -->
    <line x1="330" y1="512" x2="330" y2="538" class="flow-line" stroke="#ffd400" stroke-width="1"/>

    <!-- Key risk callout -->
    <rect x="120" y="575" width="660" height="32" rx="6" fill="#f4212e" fill-opacity="0.08" stroke="#f4212e" stroke-width="1"/>
    <text x="450" y="592" text-anchor="middle" fill="#f4212e" font-size="10" font-weight="600">⚠ TOP RISK: Compliant content doesn't convert — build attribution bridge BEFORE first video ships</text>
    <text x="450" y="604" text-anchor="middle" fill="#71767b" font-size="9">FDA compliance gate on every script • View → Email → Trial → Paid Sub instrumented Day 1</text>
  </g>
</svg>