<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn1 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn3 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .phase1 { animation: fadeIn1 0.8s ease-out 0.3s both; }
    .phase2 { animation: fadeIn2 0.8s ease-out 0.8s both; }
    .phase3 { animation: fadeIn3 0.8s ease-out 1.3s both; }
    .highlight { animation: pulse 3s ease-in-out infinite; }
    .flow-line { animation: dash 1.5s linear infinite; }
    text { font-family: -apple-system, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#0f1117"/>

  <!-- Title -->
  <g class="phase1">
    <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">DECISION FRAMEWORK: Path to $120K+ Engineering Career</text>
    <text x="450" y="62" text-anchor="middle" fill="#94a3b8" font-size="12">24-Month Horizon · $12K Runway · Austin TX · AI-Native Market</text>
  </g>

  <!-- Path Comparison Cards -->
  <!-- CS Degree - Eliminated -->
  <g class="phase2">
    <rect x="30" y="90" width="260" height="160" rx="8" fill="#1e1e2e" stroke="#ef4444" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="160" y="115" text-anchor="middle" fill="#ef4444" font-size="14" font-weight="700">❌ CS DEGREE</text>
    <text x="160" y="135" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="600">ELIMINATED</text>
    <text x="45" y="160" fill="#94a3b8" font-size="11">Cost: $40-80K</text>
    <text x="45" y="178" fill="#94a3b8" font-size="11">Time: 4 years (breaks constraint)</text>
    <text x="45" y="196" fill="#94a3b8" font-size="11">Savings gap: 3-7x</text>
    <text x="45" y="214" fill="#94a3b8" font-size="11">ROI timeline: Year 4+</text>
    <line x1="30" y1="225" x2="290" y2="225" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="160" y="242" text-anchor="middle" fill="#ef4444" font-size="10" opacity="0.8">Constraint mismatch — unanimous reject</text>
  </g>

  <!-- Bootcamp - High Risk -->
  <g class="phase2">
    <rect x="320" y="90" width="260" height="160" rx="8" fill="#1e1e2e" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="450" y="115" text-anchor="middle" fill="#f59e0b" font-size="14" font-weight="700">⚠️ BOOTCAMP</text>
    <text x="450" y="135" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="600">HIGH RISK — FALLBACK ONLY</text>
    <text x="335" y="160" fill="#94a3b8" font-size="11">Cost: $12-24K (burns all savings)</text>
    <text x="335" y="178" fill="#94a3b8" font-size="11">Employment: 40-65% (coin flip)</text>
    <text x="335" y="196" fill="#94a3b8" font-size="11">ISA trap: $21K over 2 years</text>
    <text x="335" y="214" fill="#94a3b8" font-size="11">Network: peers, not seniors</text>
    <line x1="320" y1="225" x2="580" y2="225" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="450" y="242" text-anchor="middle" fill="#f59e0b" font-size="10" opacity="0.8">Trigger at month 6 if self-taught stalls</text>
  </g>

  <!-- Self-Taught Sprint - Recommended -->
  <g class="phase2">
    <rect x="610" y="90" width="260" height="160" rx="8" fill="#1a2332" stroke="#22c55e" stroke-width="2" class="highlight"/>
    <text x="740" y="115" text-anchor="middle" fill="#22c55e" font-size="14" font-weight="700">✅ AI-NATIVE SPRINT</text>
    <text x="740" y="135" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="600">RECOMMENDED</text>
    <text x="625" y="160" fill="#e2e8f0" font-size="11">Cost: $2-4K (runway preserved)</text>
    <text x="625" y="178" fill="#e2e8f0" font-size="11">Time to hire: 6-12 months</text>
    <text x="625" y="196" fill="#e2e8f0" font-size="11">Target: $75-85K first role</text>
    <text x="625" y="214" fill="#e2e8f0" font-size="11">$120K via promotion in 18-24mo</text>
    <line x1="610" y1="225" x2="870" y2="225" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="740" y="242" text-anchor="middle" fill="#22c55e" font-size="10" opacity="0.9">Bounded downside · highest optionality</text>
  </g>

  <!-- Execution Timeline -->
  <g class="phase3">
    <text x="450" y="290" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="700">EXECUTION PHASES</text>

    <!-- Timeline bar -->
    <rect x="60" y="310" width="780" height="4" rx="2" fill="#334155"/>

    <!-- Phase markers -->
    <circle cx="60" cy="312" r="6" fill="#22c55e"/>
    <circle cx="255" cy="312" r="6" fill="#3b82f6"/>
    <circle cx="450" cy="312" r="6" fill="#a855f7"/>
    <circle cx="645" cy="312" r="6" fill="#f59e0b"/>
    <circle cx="840" cy="312" r="6" fill="#22c55e"/>

    <!-- Flow lines -->
    <line x1="60" y1="312" x2="255" y2="312" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" class="flow-line"/>
    <line x1="255" y1="312" x2="450" y2="312" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4" class="flow-line"/>
    <line x1="450" y1="312" x2="645" y2="312" stroke="#a855f7" stroke-width="2" stroke-dasharray="6 4" class="flow-line"/>
    <line x1="645" y1="312" x2="840" y2="312" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" class="flow-line"/>

    <!-- Phase labels -->
    <text x="60" y="300" fill="#94a3b8" font-size="10">WEEK 1</text>
    <text x="255" y="300" fill="#94a3b8" font-size="10">MONTH 3</text>
    <text x="450" y="300" fill="#94a3b8" font-size="10">MONTH 6</text>
    <text x="645" y="300" fill="#94a3b8" font-size="10">MONTH 12</text>
    <text x="810" y="300" fill="#94a3b8" font-size="10">MONTH 24</text>

    <!-- Phase 1: Ship Signal -->
    <rect x="60" y="330" width="185" height="95" rx="6" fill="#1a2e1a" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4"/>
    <text x="152" y="350" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Ship Signal</text>
    <text x="72" y="368" fill="#94a3b8" font-size="10">• 1 AI-native project deployed</text>
    <text x="72" y="383" fill="#94a3b8" font-size="10">• Test suite + CI pipeline</text>
    <text x="72" y="398" fill="#94a3b8" font-size="10">• Public build log started</text>
    <text x="72" y="413" fill="#94a3b8" font-size="10">• 3+ meetup connections</text>

    <!-- Phase 2: Build Network -->
    <rect x="255" y="330" width="185" height="95" rx="6" fill="#1a1a2e" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <text x="347" y="350" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600">Build Network</text>
    <text x="267" y="368" fill="#94a3b8" font-size="10">• 1+ open-source PR merged</text>
    <text x="267" y="383" fill="#94a3b8" font-size="10">• 10 informational interviews</text>
    <text x="267" y="398" fill="#94a3b8" font-size="10">• Weekly accountability partner</text>
    <text x="267" y="413" fill="#94a3b8" font-size="10">• Depth wedge chosen</text>

    <!-- Phase 3: Convert (with gate) -->
    <rect x="450" y="330" width="185" height="95" rx="6" fill="#2a1a2e" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="542" y="350" text-anchor="middle" fill="#a855f7" font-size="12" font-weight="600">⚡ 6-Month Gate</text>
    <text x="462" y="368" fill="#94a3b8" font-size="10">• Interviews scheduled? Y/N</text>
    <text x="462" y="383" fill="#94a3b8" font-size="10">• If NO → pivot to bootcamp</text>
    <text x="462" y="398" fill="#94a3b8" font-size="10">• If YES → target startups</text>
    <text x="462" y="413" fill="#94a3b8" font-size="10">• Apply via warm intros only</text>

    <!-- Phase 4: Employed + Compound -->
    <rect x="645" y="330" width="185" height="95" rx="6" fill="#2e2a1a" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <text x="737" y="350" text-anchor="middle" fill="#f59e0b" font-size="12" font-weight="600">Compound</text>
    <text x="657" y="368" fill="#94a3b8" font-size="10">• Hired at $75-95K</text>
    <text x="657" y="383" fill="#94a3b8" font-size="10">• Real codebase experience</text>
    <text x="657" y="398" fill="#94a3b8" font-size="10">• Promotion or strategic hop</text>
    <text x="657" y="413" fill="#94a3b8" font-size="10">• Target: $120K by month 24</text>
  </g>

  <!-- Key Insight Box -->
  <g class="phase3">
    <rect x="60" y="450" width="780" height="70" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" stroke-opacity="0.3"/>
    <text x="450" y="475" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">KEY REFRAME: Target "employed + learning in a real codebase within 12 months"</text>
    <text x="450" y="498" text-anchor="middle" fill="#94a3b8" font-size="11">$120K is a 24-month compounding outcome, not a first-job target. The first job is the only hard dependency.</text>
  </g>

  <!-- Risk Asymmetry -->
  <g class="phase3">
    <rect x="60" y="540" width="380" height="60" rx="6" fill="#1a2332" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3"/>
    <text x="250" y="562" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600">Sprint Downside (if fails at month 18)</text>
    <text x="250" y="582" text-anchor="middle" fill="#94a3b8" font-size="11">$8-10K savings + real portfolio + bootcamp still available</text>

    <rect x="460" y="540" width="380" height="60" rx="6" fill="#2e1a1a" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3"/>
    <text x="650" y="562" text-anchor="middle" fill="#ef4444" font-size="12" font-weight="600">Bootcamp Downside (if fails at month 7)</text>
    <text x="650" y="582" text-anchor="middle" fill="#94a3b8" font-size="11">$0 savings + ISA debt + no fallback options</text>
  </g>
</svg>