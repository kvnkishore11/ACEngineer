<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .phase-label { font-size: 11px; font-weight: 700; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }
    .action-title { font-size: 13px; font-weight: 600; fill: #e2e8f0; }
    .action-detail { font-size: 11px; fill: #94a3b8; }
    .cost-label { font-size: 10px; font-weight: 600; fill: #fbbf24; }
    .risk-high { fill: #ef4444; }
    .risk-med { fill: #f59e0b; }
    .risk-low { fill: #22c55e; }
    .header { font-size: 18px; font-weight: 700; fill: #f1f5f9; }
    .subheader { font-size: 12px; fill: #64748b; }
    .divider { stroke: #334155; stroke-width: 1; }
    .connector { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 4 3; fill: none; }
    .box { rx: 8; ry: 8; }
    .rejected-overlay { fill: #ef4444; opacity: 0.08; rx: 8; ry: 8; }
    .rejected-line { stroke: #ef4444; stroke-width: 2; opacity: 0.5; }
    .badge { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .live-dot { animation: pulse-glow 2s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="900" height="680" fill="#0f172a" rx="12"/>

  <!-- Header -->
  <text x="40" y="38" class="header">FDA Warning Letter Response — Decision Framework</text>
  <text x="40" y="56" class="subheader">Session 7k5km7 · March 18, 2026 · BlendStack Board Deliberation</text>
  <line x1="40" y1="70" x2="860" y2="70" class="divider"/>

  <!-- REJECTED PATH -->
  <rect x="40" y="85" width="250" height="130" class="rejected-overlay"/>
  <line x1="40" y1="85" x2="290" y2="215" class="rejected-line"/>
  <line x1="290" y1="85" x2="40" y2="215" class="rejected-line"/>
  <text x="55" y="105" class="phase-label" fill="#ef4444">✗ REJECTED — 7-Day Copy Swap</text>
  <text x="55" y="125" class="action-detail">Swap text only, keep visuals</text>
  <text x="55" y="142" class="action-detail">Fails FDA net impression doctrine</text>
  <text x="55" y="159" class="action-detail">Same visual = same implied claim</text>
  <text x="55" y="176" class="action-detail">Second warning letter risk: HIGH</text>
  <rect x="55" y="186" width="60" height="16" rx="3" fill="#ef4444" opacity="0.2"/>
  <text x="65" y="197" class="badge" fill="#ef4444">REJECTED</text>

  <!-- REJECTED PATH 2 -->
  <rect x="325" y="85" width="250" height="130" class="rejected-overlay"/>
  <line x1="325" y1="85" x2="575" y2="215" class="rejected-line"/>
  <line x1="575" y1="85" x2="325" y2="215" class="rejected-line"/>
  <text x="340" y="105" class="phase-label" fill="#ef4444">✗ REJECTED — 6-8 Week Full Dark</text>
  <text x="340" y="125" class="action-detail">Full rebuild, channel dark 8 weeks</text>
  <text x="340" y="142" class="action-detail">~$34K lost LTV over 90 days</text>
  <text x="340" y="159" class="action-detail">Concedes too much growth</text>
  <text x="340" y="176" class="action-detail">Same creative thesis on return</text>
  <rect x="340" y="186" width="60" height="16" rx="3" fill="#ef4444" opacity="0.2"/>
  <text x="350" y="197" class="badge" fill="#ef4444">REJECTED</text>

  <!-- APPROVED PATH -->
  <rect x="610" y="85" width="250" height="130" rx="8" fill="#22c55e" opacity="0.08" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="625" cy="100" r="4" fill="#22c55e" class="live-dot"/>
  <text x="635" y="105" class="phase-label" fill="#22c55e">✓ APPROVED — Phased Relaunch</text>
  <text x="625" y="125" class="action-detail" fill="#d1fae5">New creative, new brief, new visuals</text>
  <text x="625" y="142" class="action-detail" fill="#d1fae5">10-14 day dark, 1-3 ads relaunch</text>
  <text x="625" y="159" class="action-detail" fill="#d1fae5">Full library weeks 3-8</text>
  <text x="625" y="176" class="action-detail" fill="#d1fae5">~$8-11K lost LTV over 90 days</text>
  <rect x="625" y="186" width="65" height="16" rx="3" fill="#22c55e" opacity="0.2"/>
  <text x="633" y="197" class="badge" fill="#22c55e">APPROVED</text>

  <line x1="40" y1="230" x2="860" y2="230" class="divider"/>

  <!-- TIMELINE -->
  <text x="40" y="255" class="phase-label">15-Day Execution Timeline</text>

  <!-- Phase 1: Days 1-2 -->
  <rect x="40" y="270" width="190" height="150" class="box" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="270" width="190" height="4" rx="2" fill="#ef4444"/>
  <text x="55" y="295" class="phase-label">Days 1-2 · Emergency</text>
  <text x="55" y="315" class="action-title">Pull all flagged content</text>
  <text x="55" y="332" class="action-detail">Engage FDA regulatory counsel</text>
  <text x="55" y="349" class="action-detail">Double referral incentive ($10→$20)</text>
  <text x="55" y="366" class="action-detail">Kill influencer spend ($110 CAC)</text>
  <text x="55" y="383" class="action-detail">Reallocate budget to Google</text>
  <text x="55" y="403" class="cost-label">Cost: $0 + counsel retainer</text>

  <!-- Connector -->
  <path d="M 230 345 Q 255 345 255 345 L 270 345" class="connector" marker-end="url(#arrow)"/>

  <!-- Phase 2: Days 3-7 -->
  <rect x="270" y="270" width="190" height="150" class="box" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="270" y="270" width="190" height="4" rx="2" fill="#f59e0b"/>
  <text x="285" y="295" class="phase-label">Days 3-7 · Build</text>
  <text x="285" y="315" class="action-title">New creative brief written</text>
  <text x="285" y="332" class="action-detail">Personalization engine angle</text>
  <text x="285" y="349" class="action-detail">No before/after, no people P1</text>
  <text x="285" y="366" class="action-detail">Full claim audit (all channels)</text>
  <text x="285" y="383" class="action-detail">Counsel reviews brief on Day 3</text>
  <text x="285" y="403" class="cost-label">Cost: $3-5K (freelance auditor)</text>

  <path d="M 460 345 Q 485 345 485 345 L 500 345" class="connector"/>

  <!-- Phase 3: Days 8-14 -->
  <rect x="500" y="270" width="190" height="150" class="box" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="500" y="270" width="190" height="4" rx="2" fill="#22c55e"/>
  <text x="515" y="295" class="phase-label">Days 8-14 · Launch</text>
  <text x="515" y="315" class="action-title">Counsel reviews full unit</text>
  <text x="515" y="332" class="action-detail">Visual + copy + CTA together</text>
  <text x="515" y="349" class="action-detail">1-3 static ads relaunch</text>
  <text x="515" y="366" class="action-detail">Soft launch, measure CVR</text>
  <text x="515" y="383" class="action-detail">File corrective action plan</text>
  <text x="515" y="403" class="cost-label">Cost: $15-25K (legal)</text>

  <path d="M 690 345 Q 715 345 715 345 L 730 345" class="connector"/>

  <!-- Phase 4: Weeks 3-8 -->
  <rect x="730" y="270" width="130" height="150" class="box" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="730" y="270" width="130" height="4" rx="2" fill="#6366f1"/>
  <text x="742" y="295" class="phase-label">Wk 3-8 · Scale</text>
  <text x="742" y="315" class="action-title">Full creative lib</text>
  <text x="742" y="332" class="action-detail">15-20 compliant ads</text>
  <text x="742" y="349" class="action-detail">SEO content restart</text>
  <text x="742" y="366" class="action-detail">Ingredient library v1</text>
  <text x="742" y="383" class="action-detail">IRB design ($5-7K)</text>
  <text x="742" y="403" class="cost-label">Cost: $5-8K creative</text>

  <line x1="40" y1="440" x2="860" y2="440" class="divider"/>

  <!-- TRADE-OFF MATRIX -->
  <text x="40" y="465" class="phase-label">Key Trade-offs & Risk Register</text>

  <!-- Risk items -->
  <g transform="translate(40, 480)">
    <circle cx="8" cy="8" r="5" class="risk-high"/>
    <text x="20" y="13" class="action-title">Conversion rate unknown</text>
    <text x="220" y="13" class="action-detail">Compliant creative may convert 30-50% worse. Measure in Days 14-44.</text>
  </g>
  <g transform="translate(40, 505)">
    <circle cx="8" cy="8" r="5" class="risk-high"/>
    <text x="20" y="13" class="action-title">Audit scope larger than expected</text>
    <text x="250" y="13" class="action-detail">May find 30+ violations beyond cited 9. Must disclose all in CAP.</text>
  </g>
  <g transform="translate(40, 530)">
    <circle cx="8" cy="8" r="5" class="risk-med"/>
    <text x="20" y="13" class="action-title">2-person team bottleneck</text>
    <text x="230" y="13" class="action-detail">Mitigated by $3-5K freelance auditor + $2.5K contract creative.</text>
  </g>
  <g transform="translate(40, 555)">
    <circle cx="8" cy="8" r="5" class="risk-med"/>
    <text x="20" y="13" class="action-title">Counsel review timeline</text>
    <text x="230" y="13" class="action-detail">Brief → counsel Day 3, not Day 12. Early review prevents late rejection.</text>
  </g>
  <g transform="translate(40, 580)">
    <circle cx="8" cy="8" r="5" class="risk-low"/>
    <text x="20" y="13" class="action-title">Cash position</text>
    <text x="180" y="13" class="action-detail">Total 90-day spend ~$38-50K. Reserves post-spend ~$140-155K. Manageable.</text>
  </g>

  <line x1="40" y1="605" x2="860" y2="605" class="divider"/>

  <!-- Bottom summary -->
  <text x="40" y="630" class="action-title">Total estimated cost: $38-50K</text>
  <text x="300" y="630" class="action-detail">|</text>
  <text x="315" y="630" class="action-title">Dark period: 10-14 days</text>
  <text x="510" y="630" class="action-detail">|</text>
  <text x="525" y="630" class="action-title">Lost LTV (90d): ~$8-11K</text>
  <text x="40" y="655" class="subheader">Board vote: 6-0 consensus on phased relaunch. Dissent on timing nuances only. Contrarian flags: disclose ALL audit findings in CAP, not just cited 9.</text>

  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#475569"/>
    </marker>
  </defs>
</svg>