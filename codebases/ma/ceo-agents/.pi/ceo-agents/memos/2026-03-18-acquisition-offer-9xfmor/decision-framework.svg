<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    @keyframes fadeIn1 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn2 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn3 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeIn4 { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -20; } }
    .g1 { animation: fadeIn1 0.8s ease both; animation-delay: 0.2s; }
    .g2 { animation: fadeIn2 0.8s ease both; animation-delay: 1s; }
    .g3 { animation: fadeIn3 0.8s ease both; animation-delay: 1.8s; }
    .g4 { animation: fadeIn4 0.8s ease both; animation-delay: 2.6s; }
    .pulse-border { animation: pulse 3s ease-in-out infinite; animation-delay: 3.5s; }
    .flow-line { stroke-dasharray: 6 4; animation: dash 1.5s linear infinite; animation-delay: 3.5s; }
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- Background -->
  <rect width="900" height="620" rx="12" fill="#0f1117"/>

  <!-- Title -->
  <g class="g1">
    <text x="450" y="38" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">BLENDSTACK ACQUISITION DECISION FRAMEWORK</text>
    <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Session 9xfmor · March 2026 · Board Vote: 5 Accept / 1 Reject</text>
    <line x1="80" y1="70" x2="820" y2="70" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- LEFT: Accept Path -->
  <g class="g2">
    <rect x="40" y="90" width="380" height="240" rx="8" fill="#0d2818" stroke="#22c55e" stroke-width="1.5" class="pulse-border"/>
    <text x="230" y="116" text-anchor="middle" fill="#22c55e" font-size="15" font-weight="700">✓ ACCEPT — $12M CASH</text>
    <text x="230" y="134" text-anchor="middle" fill="#86efac" font-size="11">RECOMMENDATION: TAKE WITH CONDITIONS</text>

    <text x="60" y="162" fill="#cbd5e1" font-size="12" font-weight="600">Outcome (certain)</text>
    <text x="60" y="180" fill="#94a3b8" font-size="11">• $12M cash at close → ~$4.56M/founder after tax</text>
    <text x="60" y="197" fill="#94a3b8" font-size="11">• Team offered retention packages</text>
    <text x="60" y="214" fill="#94a3b8" font-size="11">• Brand absorbed into NutraHoldings portfolio</text>

    <text x="60" y="240" fill="#cbd5e1" font-size="12" font-weight="600">Conditions (3)</text>
    <text x="60" y="258" fill="#94a3b8" font-size="11">1. Earnout: $1.5–2M if churn &lt; 4% at month 18</text>
    <text x="60" y="275" fill="#94a3b8" font-size="11">2. Knowledge transfer: 90-day contractual period</text>
    <text x="60" y="292" fill="#94a3b8" font-size="11">3. Founder question: was 2nd-edit ever tested?</text>

    <rect x="60" y="304" width="340" height="18" rx="4" fill="#166534"/>
    <text x="230" y="317" text-anchor="middle" fill="#dcfce7" font-size="10" font-weight="600">ZERO ASSUMPTIONS REQUIRED · IRREVERSIBLE · CERTAIN</text>
  </g>

  <!-- RIGHT: Reject Path -->
  <g class="g3">
    <rect x="480" y="90" width="380" height="240" rx="8" fill="#1c1008" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="670" y="116" text-anchor="middle" fill="#f59e0b" font-size="15" font-weight="700">✗ REJECT — BET ON GROWTH</text>
    <text x="670" y="134" text-anchor="middle" fill="#fcd34d" font-size="11">MINORITY POSITION (MOONSHOT)</text>

    <text x="500" y="162" fill="#cbd5e1" font-size="12" font-weight="600">Required Assumptions (6)</text>
    <text x="500" y="180" fill="#94a3b8" font-size="11">• 94% retention signal is causal, not correlative</text>
    <text x="500" y="197" fill="#94a3b8" font-size="11">• Series A closes in 90 days at favorable terms</text>
    <text x="500" y="214" fill="#94a3b8" font-size="11">• Platform pivot succeeds within 24-30 months</text>
    <text x="500" y="231" fill="#94a3b8" font-size="11">• DTC ARR holds during pivot execution</text>
    <text x="500" y="248" fill="#94a3b8" font-size="11">• Future buyer pays ≥11x on new ARR base</text>
    <text x="500" y="265" fill="#94a3b8" font-size="11">• NutraHoldings or equivalent exists at month 18</text>

    <rect x="500" y="282" width="340" height="30" rx="4" fill="#451a03"/>
    <text x="670" y="295" text-anchor="middle" fill="#fed7aa" font-size="10" font-weight="600">FLOOR IF PIVOT FAILS: $8–9M (NOT $12M)</text>
    <text x="670" y="307" text-anchor="middle" fill="#fdba74" font-size="9">Corrected from Moonshot's original $12M floor estimate</text>
  </g>

  <!-- BOTTOM: Key Tensions -->
  <g class="g4">
    <line x1="80" y1="350" x2="820" y2="350" stroke="#334155" stroke-width="1"/>
    <text x="450" y="375" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700">UNRESOLVED TENSIONS &amp; KEY SIGNALS</text>

    <!-- Tension boxes -->
    <rect x="40" y="395" width="260" height="95" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="170" y="415" text-anchor="middle" fill="#a5b4fc" font-size="11" font-weight="700">CHURN DIAGNOSIS</text>
    <text x="55" y="433" fill="#94a3b8" font-size="10">5-quarter deceleration: 8.1% → 4.2%</text>
    <text x="55" y="448" fill="#94a3b8" font-size="10">6.1% churn (52% above target)</text>
    <text x="55" y="463" fill="#fca5a5" font-size="10" font-weight="600">Nobody named the root cause</text>
    <text x="55" y="478" fill="#fca5a5" font-size="10" font-weight="600">in three rounds of deliberation</text>

    <rect x="320" y="395" width="260" height="95" rx="6" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1"/>
    <text x="450" y="415" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="700">94% RETENTION SIGNAL</text>
    <text x="335" y="433" fill="#94a3b8" font-size="10">Users who edit blend 2x in 60 days</text>
    <text x="335" y="448" fill="#94a3b8" font-size="10">retain at 94% — real observed data</text>
    <text x="335" y="463" fill="#fbbf24" font-size="10" font-weight="600">Causality vs. correlation unresolved</text>
    <text x="335" y="478" fill="#fbbf24" font-size="10" font-weight="600">Never tested with intervention</text>

    <rect x="600" y="395" width="260" height="95" rx="6" fill="#1a0d00" stroke="#f97316" stroke-width="1"/>
    <text x="730" y="415" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="700">PLATFORM THESIS</text>
    <text x="615" y="433" fill="#94a3b8" font-size="10">Blend engine as SaaS infrastructure</text>
    <text x="615" y="448" fill="#94a3b8" font-size="10">$35–80M ceiling if thesis proves out</text>
    <text x="615" y="463" fill="#f87171" font-size="10" font-weight="600">24-30 month build (not 12)</text>
    <text x="615" y="478" fill="#f87171" font-size="10" font-weight="600">No B2B customers, no SOC 2, no HIPAA</text>

    <!-- Flow lines connecting tensions -->
    <line x1="300" y1="442" x2="320" y2="442" class="flow-line" stroke="#6366f1" stroke-width="1.5"/>
    <line x1="580" y1="442" x2="600" y2="442" class="flow-line" stroke="#8b5cf6" stroke-width="1.5"/>

    <!-- Board Vote Bar -->
    <rect x="40" y="510" width="820" height="50" rx="6" fill="#1e293b"/>
    <rect x="40" y="510" width="683" height="50" rx="6" fill="#14532d" opacity="0.6"/>
    <rect x="723" y="510" width="137" height="50" rx="6" fill="#451a03" opacity="0.6"/>
    <text x="382" y="540" text-anchor="middle" fill="#86efac" font-size="13" font-weight="700">ACCEPT: Revenue · Product · Technical · Contrarian · Compounder</text>
    <text x="791" y="540" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="700">REJECT: Moonshot</text>

    <!-- Bottom note -->
    <text x="450" y="590" text-anchor="middle" fill="#64748b" font-size="10">Decision: Accept $12M with earnout + knowledge transfer conditions · Dissent recorded · March 2026</text>
  </g>
</svg>