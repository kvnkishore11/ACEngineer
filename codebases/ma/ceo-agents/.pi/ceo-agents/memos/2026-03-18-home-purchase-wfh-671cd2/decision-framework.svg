<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#00a381"/>
    </linearGradient>
    <linearGradient id="rejectGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#636e72"/>
      <stop offset="100%" stop-color="#4a5568"/>
    </linearGradient>
    <linearGradient id="condGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f0b429"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fa" rx="12"/>

  <!-- Header -->
  <rect width="900" height="72" fill="url(#headerGrad)" rx="12"/>
  <rect y="60" width="900" height="12" fill="url(#headerGrad)"/>
  <text x="32" y="32" fill="#00b894" font-size="11" font-weight="600" letter-spacing="2">BOARD DECISION · SESSION 671cd2</text>
  <text x="32" y="56" fill="#ffffff" font-size="20" font-weight="700">Home Purchase Decision Framework — Option A Selected</text>
  <text x="868" y="44" fill="#a0aec0" font-size="11" text-anchor="end">March 2026</text>

  <!-- Option Cards Row -->
  <!-- Option A - Winner -->
  <g filter="url(#shadow)">
    <rect x="24" y="92" width="204" height="200" fill="#ffffff" rx="8" stroke="#00b894" stroke-width="2.5"/>
    <rect x="24" y="92" width="204" height="36" fill="url(#winGrad)" rx="8"/>
    <rect x="24" y="120" width="204" height="8" fill="url(#winGrad)"/>
    <text x="126" y="116" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">✓ OPTION A — BUY NOW</text>
    <text x="40" y="152" fill="#1a1a2e" font-size="11" font-weight="600">$385K · North Austin · 3BR</text>
    <text x="40" y="172" fill="#636e72" font-size="10">Monthly: $2,837 (20% of take-home)</text>
    <text x="40" y="189" fill="#636e72" font-size="10">Post-close liquid: $31,500</text>
    <text x="40" y="206" fill="#636e72" font-size="10">5yr equity built: ~$101,000</text>
    <text x="40" y="223" fill="#636e72" font-size="10">Dedicated office: ✓ 3rd bedroom</text>
    <text x="40" y="244" fill="#00a381" font-size="10" font-weight="600">6-0 UNANIMOUS</text>
    <text x="40" y="260" fill="#00a381" font-size="10" font-weight="600">with 4 hard conditions</text>
  </g>

  <!-- Option B - Conditional -->
  <g filter="url(#shadow)">
    <rect x="244" y="92" width="204" height="200" fill="#ffffff" rx="8" stroke="#f0b429" stroke-width="1.5"/>
    <rect x="244" y="92" width="204" height="36" fill="url(#condGrad)" rx="8"/>
    <rect x="244" y="120" width="204" height="8" fill="url(#condGrad)"/>
    <text x="346" y="116" fill="#1a1a2e" font-size="13" font-weight="700" text-anchor="middle">⚡ OPTION B — CONDITIONAL</text>
    <text x="260" y="152" fill="#1a1a2e" font-size="11" font-weight="600">$435K · South Austin · Garage</text>
    <text x="260" y="172" fill="#636e72" font-size="10">Monthly: $3,279 (23% of take-home)</text>
    <text x="260" y="189" fill="#636e72" font-size="10">Post-close liquid: $20,000</text>
    <text x="260" y="206" fill="#636e72" font-size="10">Garage workshop + lab space</text>
    <text x="260" y="223" fill="#636e72" font-size="10">Only if hardware plan is named</text>
    <text x="260" y="244" fill="#b7791f" font-size="10" font-weight="600">REVISIT ONLY IF specific</text>
    <text x="260" y="260" fill="#b7791f" font-size="10" font-weight="600">lab/hardware use case exists</text>
  </g>

  <!-- Option C - Rejected -->
  <g filter="url(#shadow)">
    <rect x="464" y="92" width="204" height="200" fill="#ffffff" rx="8" stroke="#b2bec3" stroke-width="1"/>
    <rect x="464" y="92" width="204" height="36" fill="url(#rejectGrad)" rx="8"/>
    <rect x="464" y="120" width="204" height="8" fill="url(#rejectGrad)"/>
    <text x="566" y="116" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">✗ OPTION C — WAIT</text>
    <text x="480" y="152" fill="#1a1a2e" font-size="11" font-weight="600">Wait 6-9mo for 5.5% rates</text>
    <text x="480" y="172" fill="#636e72" font-size="10">Break-even: 82-148 months</text>
    <text x="480" y="189" fill="#636e72" font-size="10">$21,600 rent + $15K price increase</text>
    <text x="480" y="206" fill="#636e72" font-size="10">Rate drop not guaranteed</text>
    <text x="480" y="223" fill="#636e72" font-size="10">New lease locks in $4,800 penalty</text>
    <text x="480" y="244" fill="#e17055" font-size="10" font-weight="600">REJECTED UNANIMOUSLY</text>
    <text x="480" y="260" fill="#e17055" font-size="10" font-weight="600">"Speculation as patience"</text>
  </g>

  <!-- Option D - Rejected -->
  <g filter="url(#shadow)">
    <rect x="684" y="92" width="204" height="200" fill="#ffffff" rx="8" stroke="#b2bec3" stroke-width="1"/>
    <rect x="684" y="92" width="204" height="36" fill="url(#rejectGrad)" rx="8"/>
    <rect x="684" y="120" width="204" height="8" fill="url(#rejectGrad)"/>
    <text x="786" y="116" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">✗ OPTION D — RENT 2BR</text>
    <text x="700" y="152" fill="#1a1a2e" font-size="11" font-weight="600">Rent 2BR at $2,400-2,600/mo</text>
    <text x="700" y="172" fill="#636e72" font-size="10">Fixes productivity: ✓</text>
    <text x="700" y="189" fill="#636e72" font-size="10">5yr wealth gap: -$78,000 vs A</text>
    <text x="700" y="206" fill="#636e72" font-size="10">$0 equity, rent escalates 3-4%/yr</text>
    <text x="700" y="223" fill="#636e72" font-size="10">Flexibility unused if staying 5yr</text>
    <text x="700" y="244" fill="#e17055" font-size="10" font-weight="600">REJECTED on capital</text>
    <text x="700" y="260" fill="#e17055" font-size="10" font-weight="600">allocation grounds</text>
  </g>

  <!-- Conditions Section -->
  <g filter="url(#shadow)">
    <rect x="24" y="312" width="852" height="140" fill="#ffffff" rx="8"/>
    <text x="44" y="340" fill="#1a1a2e" font-size="14" font-weight="700">4 Hard Conditions on Option A (non-negotiable)</text>
    <line x1="44" y1="350" x2="856" y2="350" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Condition 1 -->
    <circle cx="56" cy="374" r="10" fill="#00b894"/>
    <text x="56" y="378" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">1</text>
    <text x="76" y="378" fill="#1a1a2e" font-size="11" font-weight="600">Construction ≤10 years old</text>
    <text x="76" y="392" fill="#636e72" font-size="10">Newer build eliminates deferred maintenance risk. Non-negotiable inspection filter.</text>

    <!-- Condition 2 -->
    <circle cx="56" cy="412" r="10" fill="#00b894"/>
    <text x="56" y="416" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">2</text>
    <text x="76" y="416" fill="#1a1a2e" font-size="11" font-weight="600">HELOC within 45 days of close</text>
    <text x="76" y="430" fill="#636e72" font-size="10">$50-80K accessible backstop. Pre-arrange lender before closing. $0 cost if unused.</text>

    <!-- Condition 3 -->
    <circle cx="480" cy="374" r="10" fill="#00b894"/>
    <text x="480" y="378" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">3</text>
    <text x="500" y="378" fill="#1a1a2e" font-size="11" font-weight="600">Seller concessions negotiated</text>
    <text x="500" y="392" fill="#636e72" font-size="10">Target $4-8K at close. 28-day DOM gives leverage. Every dollar is buffer.</text>

    <!-- Condition 4 -->
    <circle cx="480" cy="412" r="10" fill="#00b894"/>
    <text x="480" y="416" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">4</text>
    <text x="500" y="416" fill="#1a1a2e" font-size="11" font-weight="600">Employer RTO contingency plan</text>
    <text x="500" y="430" fill="#636e72" font-size="10">Name 3-5 Austin target employers + realistic salary range before signing contracts.</text>
  </g>

  <!-- Risk / Tradeoff Footer -->
  <g filter="url(#shadow)">
    <rect x="24" y="472" width="420" height="132" fill="#ffffff" rx="8"/>
    <text x="44" y="500" fill="#1a1a2e" font-size="13" font-weight="700">Risks Accepted</text>
    <line x1="44" y1="508" x2="424" y2="508" stroke="#e2e8f0"/>
    <text x="44" y="526" fill="#e17055" font-size="10">● 6.75% rate may not drop — Option A works regardless (20% ratio)</text>
    <text x="44" y="544" fill="#e17055" font-size="10">● $31.5K post-close is thin — mitigated by HELOC + seller concessions</text>
    <text x="44" y="562" fill="#e17055" font-size="10">● Forced sale in &lt;5yr creates loss after 6% transaction costs</text>
    <text x="44" y="580" fill="#e17055" font-size="10">● First-year homeowner cost surprises — filtered by ≤10yr build</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="472" width="416" height="132" fill="#ffffff" rx="8"/>
    <text x="480" y="500" fill="#1a1a2e" font-size="13" font-weight="700">Key Numbers</text>
    <line x1="480" y1="508" x2="856" y2="508" stroke="#e2e8f0"/>
    <text x="480" y="526" fill="#2d3748" font-size="10">Monthly payment: $2,837 → 20% of take-home (healthy)</text>
    <text x="480" y="544" fill="#2d3748" font-size="10">5yr wealth vs renting: +$78,000 to +$156,000</text>
    <text x="480" y="562" fill="#2d3748" font-size="10">Buffer rebuild to $60K: ~4-5 months post-close</text>
    <text x="480" y="580" fill="#2d3748" font-size="10">Refi savings if rates hit 5.5%: $182/mo, $48K over 30yr</text>
  </g>
</svg>