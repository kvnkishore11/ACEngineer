<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <style>
    .phase-label { font: bold 14px 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .phase-desc { font: 12px 'Segoe UI', system-ui, sans-serif; fill: #4a4a6a; }
    .milestone { font: bold 13px 'Segoe UI', system-ui, sans-serif; fill: #fff; }
    .salary { font: bold 16px 'Segoe UI', system-ui, sans-serif; }
    .header { font: bold 22px 'Segoe UI', system-ui, sans-serif; fill: #1a1a2e; }
    .subheader { font: 13px 'Segoe UI', system-ui, sans-serif; fill: #6a6a8a; }
    .rejected { font: bold 12px 'Segoe UI', system-ui, sans-serif; fill: #c0392b; }
    .rejected-label { font: 11px 'Segoe UI', system-ui, sans-serif; fill: #888; }
    .track-label { font: bold 11px 'Segoe UI', system-ui, sans-serif; fill: #555; letter-spacing: 1.5px; }
    .note { font: 11px 'Segoe UI', system-ui, sans-serif; fill: #777; }
    /* Ambient animations */
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes dash-march { to { stroke-dashoffset: -20; } }
    .connector { animation: dash-march 2s linear infinite; }
    .glow { animation: pulse-glow 3s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fc"/>
      <stop offset="100%" stop-color="#eef0f7"/>
    </linearGradient>
    <linearGradient id="phase1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="phase2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="phase3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="phase4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <!-- Header -->
  <text x="450" y="38" text-anchor="middle" class="header">Recommended Path: Self-Taught + QA Wedge → $120K+</text>
  <text x="450" y="58" text-anchor="middle" class="subheader">Honest 30-36 month timeline · $12K savings preserved · Two parallel tracks</text>

  <!-- Rejected paths -->
  <g transform="translate(30, 78)">
    <rect width="200" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="14" y="20" class="rejected">✗ CS Degree (4 years)</text>
    <text x="14" y="36" class="rejected-label">$40-80K · Timeline incompatible</text>
  </g>
  <g transform="translate(250, 78)">
    <rect width="200" height="48" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="14" y="20" class="rejected">✗ Bootcamp ($12-20K)</text>
    <text x="14" y="36" class="rejected-label">Liquidity trap · 40-65% employment</text>
  </g>
  <g transform="translate(470, 78)">
    <rect width="200" height="48" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="14" y="20" style="font: bold 12px 'Segoe UI', sans-serif; fill: #16a34a;">✓ Self-Taught + QA Wedge</text>
    <text x="14" y="36" class="rejected-label">$0 tuition · Parallel execution</text>
  </g>

  <!-- Timeline axis -->
  <line x1="60" y1="175" x2="860" y2="175" stroke="#ccc" stroke-width="1.5"/>
  <g>
    <text x="60" y="168" class="note">Month 0</text>
    <text x="250" y="168" class="note">Month 4</text>
    <text x="440" y="168" class="note">Month 12</text>
    <text x="650" y="168" class="note">Month 24</text>
    <text x="820" y="168" class="note">Month 36</text>
  </g>
  <!-- Tick marks -->
  <line x1="60" y1="172" x2="60" y2="178" stroke="#999" stroke-width="1.5"/>
  <line x1="250" y1="172" x2="250" y2="178" stroke="#999" stroke-width="1.5"/>
  <line x1="440" y1="172" x2="440" y2="178" stroke="#999" stroke-width="1.5"/>
  <line x1="650" y1="172" x2="650" y2="178" stroke="#999" stroke-width="1.5"/>
  <line x1="860" y1="172" x2="860" y2="178" stroke="#999" stroke-width="1.5"/>

  <!-- Track A: Portfolio Build -->
  <text x="60" y="210" class="track-label">TRACK A: PORTFOLIO BUILD</text>

  <!-- Phase 1: Build -->
  <g filter="url(#shadow)">
    <rect x="60" y="220" width="190" height="70" rx="8" fill="url(#phase1)"/>
    <text x="155" y="248" text-anchor="middle" class="milestone">Build 2 Projects</text>
    <text x="155" y="266" text-anchor="middle" style="font: 11px sans-serif; fill: #e0e0ff;">10-12 weeks · Portfolio spec</text>
  </g>

  <!-- Phase 2: Open Source + Writing -->
  <g filter="url(#shadow)">
    <rect x="260" y="220" width="180" height="70" rx="8" fill="url(#phase2)"/>
    <text x="350" y="248" text-anchor="middle" class="milestone">OSS + Blog</text>
    <text x="350" y="266" text-anchor="middle" style="font: 11px sans-serif; fill: #e0f0ff;">Contributions + 2 posts</text>
  </g>

  <!-- Connector -->
  <line x1="250" y1="255" x2="260" y2="255" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" class="connector"/>

  <!-- Track B: Income & Signal -->
  <text x="60" y="330" class="track-label">TRACK B: INCOME + PROFESSIONAL SIGNAL</text>

  <!-- QA Role Search -->
  <g filter="url(#shadow)">
    <rect x="60" y="340" width="120" height="70" rx="8" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="120" y="365" text-anchor="middle" style="font: bold 12px sans-serif; fill: #4338ca;">Apply QA/SDET</text>
    <text x="120" y="383" text-anchor="middle" style="font: 11px sans-serif; fill: #6366f1;">Austin startups</text>
  </g>

  <!-- QA Role -->
  <g filter="url(#shadow)">
    <rect x="190" y="340" width="250" height="70" rx="8" fill="url(#phase2)"/>
    <text x="315" y="365" text-anchor="middle" class="milestone">QA/SDET Role · $55-65K</text>
    <text x="315" y="383" text-anchor="middle" style="font: 11px sans-serif; fill: #e0f0ff;">Production codebase · Team exp · Network</text>
  </g>

  <!-- Arrow -->
  <line x1="180" y1="375" x2="190" y2="375" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,4" class="connector"/>

  <!-- Junior SWE -->
  <g filter="url(#shadow)">
    <rect x="450" y="340" width="200" height="70" rx="8" fill="url(#phase3)"/>
    <text x="550" y="365" text-anchor="middle" class="milestone">Junior SWE · $75-88K</text>
    <text x="550" y="383" text-anchor="middle" style="font: 11px sans-serif; fill: #e0fff0;">Internal transfer or new role</text>
  </g>

  <!-- Arrow -->
  <line x1="440" y1="375" x2="450" y2="375" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4" class="connector"/>

  <!-- Mid SWE -->
  <g filter="url(#shadow)">
    <rect x="660" y="340" width="200" height="70" rx="8" fill="url(#phase4)"/>
    <text x="760" y="365" text-anchor="middle" class="milestone">Mid SWE · $110-130K</text>
    <text x="760" y="383" text-anchor="middle" style="font: 11px sans-serif; fill: #fff8e0;">Job hop or promotion</text>
  </g>

  <!-- Arrow -->
  <line x1="650" y1="375" x2="660" y2="375" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" class="connector"/>

  <!-- Salary trajectory -->
  <text x="60" y="455" class="track-label">SALARY TRAJECTORY</text>
  <g>
    <!-- Salary line -->
    <polyline points="60,530 180,530 190,505 440,505 450,490 650,490 660,470 860,470"
              fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Salary markers -->
    <circle cx="60" cy="530" r="5" fill="#6366f1"/>
    <text x="60" y="550" class="salary" fill="#6366f1" text-anchor="start">$38K</text>
    <text x="60" y="565" class="note" text-anchor="start">Barista</text>

    <circle cx="190" cy="505" r="5" fill="#0ea5e9" class="glow"/>
    <text x="190" y="550" class="salary" fill="#0ea5e9" text-anchor="middle">$60K</text>
    <text x="190" y="565" class="note" text-anchor="middle">QA/SDET</text>

    <circle cx="450" cy="490" r="5" fill="#10b981" class="glow"/>
    <text x="450" y="550" class="salary" fill="#10b981" text-anchor="middle">$80K</text>
    <text x="450" y="565" class="note" text-anchor="middle">Jr SWE</text>

    <circle cx="760" cy="470" r="5" fill="#f59e0b" class="glow"/>
    <text x="760" y="550" class="salary" fill="#f59e0b" text-anchor="middle">$120K+</text>
    <text x="760" y="565" class="note" text-anchor="middle">Mid SWE</text>
  </g>

  <!-- Key insight box -->
  <g transform="translate(690, 78)">
    <rect width="180" height="48" rx="6" fill="#fefce8" stroke="#fde047" stroke-width="1"/>
    <text x="14" y="20" style="font: bold 11px 'Segoe UI', sans-serif; fill: #a16207;">⚡ Key Insight</text>
    <text x="14" y="36" style="font: 10px 'Segoe UI', sans-serif; fill: #92400e;">Build + earn in parallel, not serial</text>
  </g>

  <!-- Footer -->
  <text x="450" y="605" text-anchor="middle" style="font: italic 11px sans-serif; fill: #999;">Board Decision · Session izs4j8 · March 18, 2026</text>
</svg>