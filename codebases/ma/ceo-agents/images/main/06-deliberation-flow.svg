<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <filter id="glow-orange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff9e64" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#ff7edb" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#36f9f6" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#fede5d" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#b893ce" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#72f1b8" flood-opacity="0.35" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a3a" stroke-width="0.5"/>
    </pattern>

    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3a3a5a"/>
    </marker>
  </defs>

  <style>
    /* ── Layout math ──
       6 boxes @ 100w, 5 gaps @ 40w = 800. Margins = 50 each side.
       Box x: 50, 190, 330, 470, 610, 750
       Centers: 100, 240, 380, 520, 660, 800
       Arrows: 150->190, 290->330, 430->470, 570->610, 710->750
    */

    .bg { fill: #000000; }
    .grid-overlay { fill: url(#grid); opacity: 0.35; }

    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      text-anchor: middle;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 8px;
      font-weight: 400;
      text-anchor: middle;
      fill: #7777aa;
    }
    .heading {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
      fill: #6666aa;
      letter-spacing: 3px;
    }

    .stage-box {
      fill: #10102a;
      stroke-width: 1.5;
    }
    .box-orange  { stroke: #ff9e64; }
    .box-pink    { stroke: #ff7edb; }
    .box-cyan    { stroke: #36f9f6; }
    .box-yellow  { stroke: #fede5d; }
    .box-purple  { stroke: #b893ce; }
    .box-green   { stroke: #72f1b8; }

    .c-orange  { fill: #ff9e64; }
    .c-pink    { fill: #ff7edb; }
    .c-cyan    { fill: #36f9f6; }
    .c-yellow  { fill: #fede5d; }
    .c-purple  { fill: #b893ce; }
    .c-green   { fill: #72f1b8; }

    .arrow-line {
      stroke: #3a3a5a;
      stroke-width: 1.5;
      fill: none;
      marker-end: url(#arrowhead);
    }

    /* ── Phase 1: Reveal stages left to right, 1s apart ── */
    .stage {
      opacity: 0;
      transform: translateY(14px);
    }
    .stage-1 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards; }
    .stage-2 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.6s forwards; }
    .stage-3 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 2.6s forwards; }
    .stage-4 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 3.6s forwards; }
    .stage-5 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 4.6s forwards; }
    .stage-6 { animation: revealStage 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 5.6s forwards; }

    @keyframes revealStage {
      0%   { opacity: 0; transform: translateY(14px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ── Arrows reveal between stages ── */
    .arrow { opacity: 0; }
    .arrow-1 { animation: fadeIn 0.4s ease-out 1.4s forwards; }
    .arrow-2 { animation: fadeIn 0.4s ease-out 2.4s forwards; }
    .arrow-3 { animation: fadeIn 0.4s ease-out 3.4s forwards; }
    .arrow-4 { animation: fadeIn 0.4s ease-out 4.4s forwards; }
    .arrow-5 { animation: fadeIn 0.4s ease-out 5.4s forwards; }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* ── Phase 2: Traveling dots become visible ── */
    .travel-dot { opacity: 0; }
    .td-show { animation: fadeIn 0.3s ease-out 6.5s forwards; }

    /* ── Board Debates subtle pulse ── */
    .pulse-box {
      animation: pulseGlow 2.8s ease-in-out 3.2s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { stroke-opacity: 1; }
      50%      { stroke-opacity: 0.4; stroke-width: 2.5; }
    }

    /* ── Number badges ── */
    .badge-bg {
      fill: #0a0a1a;
      stroke-width: 1.2;
    }
    .badge-num {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 8.5px;
      font-weight: 700;
      text-anchor: middle;
      dominant-baseline: central;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="900" height="300"/>
  <rect class="grid-overlay" width="900" height="300"/>

  <!-- Heading -->
  <text class="heading" x="450" y="30">HOW  A  DELIBERATION  FLOWS</text>

  <!-- ════════════════════════════════════════════════════════════════
       CONNECTING ARROWS (rendered behind stage boxes)
       Arrow gaps: right-edge -> left-edge of next box
       ════════════════════════════════════════════════════════════════ -->

  <!-- Arrow 1: 150 -> 190 at y=145 -->
  <g class="arrow arrow-1">
    <line class="arrow-line" x1="153" y1="145" x2="187" y2="145"/>
    <circle class="travel-dot td-show" cx="0" cy="0" r="3" fill="#ff9e64">
      <animateMotion dur="1s" repeatCount="indefinite" begin="6.8s"
        path="M153,145 L187,145"/>
    </circle>
  </g>

  <!-- Arrow 2: 290 -> 330 -->
  <g class="arrow arrow-2">
    <line class="arrow-line" x1="293" y1="145" x2="327" y2="145"/>
    <circle class="travel-dot td-show" cx="0" cy="0" r="3" fill="#ff7edb">
      <animateMotion dur="1s" repeatCount="indefinite" begin="7.0s"
        path="M293,145 L327,145"/>
    </circle>
  </g>

  <!-- Arrow 3: 430 -> 470 -->
  <g class="arrow arrow-3">
    <line class="arrow-line" x1="433" y1="145" x2="467" y2="145"/>
    <circle class="travel-dot td-show" cx="0" cy="0" r="3" fill="#36f9f6">
      <animateMotion dur="1s" repeatCount="indefinite" begin="7.2s"
        path="M433,145 L467,145"/>
    </circle>
  </g>

  <!-- Arrow 4: 570 -> 610 -->
  <g class="arrow arrow-4">
    <line class="arrow-line" x1="573" y1="145" x2="607" y2="145"/>
    <circle class="travel-dot td-show" cx="0" cy="0" r="3" fill="#fede5d">
      <animateMotion dur="1s" repeatCount="indefinite" begin="7.4s"
        path="M573,145 L607,145"/>
    </circle>
  </g>

  <!-- Arrow 5: 710 -> 750 -->
  <g class="arrow arrow-5">
    <line class="arrow-line" x1="713" y1="145" x2="747" y2="145"/>
    <circle class="travel-dot td-show" cx="0" cy="0" r="3" fill="#b893ce">
      <animateMotion dur="1s" repeatCount="indefinite" begin="7.6s"
        path="M713,145 L747,145"/>
    </circle>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 1: Brief  (center=100, box x=50)
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-1">
    <rect class="stage-box box-orange" x="50" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-orange)"/>
    <!-- Badge -->
    <circle class="badge-bg" cx="68" cy="66" r="9" stroke="#ff9e64"/>
    <text class="badge-num c-orange" x="68" y="66">1</text>
    <!-- Document icon -->
    <g transform="translate(100, 112)">
      <rect x="-11" y="-15" width="22" height="28" rx="2" fill="none" stroke="#ff9e64" stroke-width="1.4"/>
      <path d="M3,-15 L11,-15 L11,-7 Z" fill="none" stroke="#ff9e64" stroke-width="1"/>
      <line x1="-5" y1="-6" x2="5" y2="-6" stroke="#ff9e64" stroke-width="0.9" opacity="0.6"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#ff9e64" stroke-width="0.9" opacity="0.6"/>
      <line x1="-5" y1="6" x2="2" y2="6" stroke="#ff9e64" stroke-width="0.9" opacity="0.6"/>
    </g>
    <!-- Labels -->
    <text class="title c-orange" x="100" y="160">Brief</text>
    <text class="subtitle" x="100" y="175">Strategic question</text>
    <text class="subtitle" x="100" y="186">from user</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 2: CEO Frames  (center=240, box x=190)
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-2">
    <rect class="stage-box box-pink" x="190" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-pink)"/>
    <circle class="badge-bg" cx="208" cy="66" r="9" stroke="#ff7edb"/>
    <text class="badge-num c-pink" x="208" y="66">2</text>
    <!-- Magnifying lens icon -->
    <g transform="translate(240, 110)">
      <circle cx="0" cy="-2" r="12" fill="none" stroke="#ff7edb" stroke-width="1.4"/>
      <circle cx="0" cy="-2" r="4.5" fill="none" stroke="#ff7edb" stroke-width="1" opacity="0.45"/>
      <line x1="8.5" y1="6.5" x2="15" y2="13" stroke="#ff7edb" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    <text class="title c-pink" x="240" y="160">CEO Frames</text>
    <text class="subtitle" x="240" y="175">Reads brief, frames</text>
    <text class="subtitle" x="240" y="186">the decision</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 3: Board Debates  (center=380, box x=330)  — PULSES
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-3">
    <rect class="stage-box box-cyan pulse-box" x="330" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-cyan)"/>
    <circle class="badge-bg" cx="348" cy="66" r="9" stroke="#36f9f6"/>
    <text class="badge-num c-cyan" x="348" y="66">3</text>
    <!-- Chat bubbles icon -->
    <g transform="translate(380, 108)">
      <rect x="-16" y="-12" width="20" height="14" rx="3" fill="none" stroke="#36f9f6" stroke-width="1.3"/>
      <polygon points="-10,2 -7,7 -4,2" fill="none" stroke="#36f9f6" stroke-width="0.9"/>
      <rect x="-1" y="-6" width="20" height="14" rx="3" fill="none" stroke="#36f9f6" stroke-width="1.3" opacity="0.55"/>
      <polygon points="13,8 10,13 7,8" fill="none" stroke="#36f9f6" stroke-width="0.9" opacity="0.55"/>
    </g>
    <text class="title c-cyan" x="380" y="160">Board Debates</text>
    <text class="subtitle" x="380" y="175">Multiple converse()</text>
    <text class="subtitle" x="380" y="186">rounds</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 4: Constraint Check  (center=520, box x=470)
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-4">
    <rect class="stage-box box-yellow" x="470" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-yellow)"/>
    <circle class="badge-bg" cx="488" cy="66" r="9" stroke="#fede5d"/>
    <text class="badge-num c-yellow" x="488" y="66">4</text>
    <!-- Gauge icon -->
    <g transform="translate(520, 112)">
      <path d="M-14,4 A16,16 0 0,1 14,4" fill="none" stroke="#fede5d" stroke-width="1.4"/>
      <line x1="0" y1="4" x2="5" y2="-8" stroke="#fede5d" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="0" cy="4" r="2.5" fill="#fede5d"/>
      <line x1="-14" y1="7" x2="-14" y2="11" stroke="#fede5d" stroke-width="0.9" opacity="0.4"/>
      <line x1="0" y1="-11" x2="0" y2="-7" stroke="#fede5d" stroke-width="0.9" opacity="0.4"/>
      <line x1="14" y1="7" x2="14" y2="11" stroke="#fede5d" stroke-width="0.9" opacity="0.4"/>
    </g>
    <text class="title c-yellow" x="520" y="155">Constraint</text>
    <text class="title c-yellow" x="520" y="170">Check</text>
    <text class="subtitle" x="520" y="185">Time / budget</text>
    <text class="subtitle" x="520" y="196">monitoring</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 5: Final Statements  (center=660, box x=610)
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-5">
    <rect class="stage-box box-purple" x="610" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-purple)"/>
    <circle class="badge-bg" cx="628" cy="66" r="9" stroke="#b893ce"/>
    <text class="badge-num c-purple" x="628" y="66">5</text>
    <!-- Stamp / final icon -->
    <g transform="translate(660, 110)">
      <rect x="-12" y="-13" width="24" height="16" rx="2" fill="none" stroke="#b893ce" stroke-width="1.3"/>
      <line x1="-6" y1="-7" x2="6" y2="-7" stroke="#b893ce" stroke-width="0.9" opacity="0.5"/>
      <line x1="-6" y1="-1" x2="6" y2="-1" stroke="#b893ce" stroke-width="0.9" opacity="0.5"/>
      <path d="M-3,3 L0,7 L3,3" fill="none" stroke="#b893ce" stroke-width="1.3"/>
      <line x1="-8" y1="10" x2="8" y2="10" stroke="#b893ce" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <text class="title c-purple" x="660" y="155">Final</text>
    <text class="title c-purple" x="660" y="170">Statements</text>
    <text class="subtitle" x="660" y="185">end_deliberation()</text>
    <text class="subtitle" x="660" y="196">contrarian last</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════════
       STAGE 6: Memo  (center=800, box x=750)
       ════════════════════════════════════════════════════════════════ -->
  <g class="stage stage-6">
    <rect class="stage-box box-green" x="750" y="55" width="100" height="165" rx="10" ry="10" filter="url(#glow-green)"/>
    <circle class="badge-bg" cx="768" cy="66" r="9" stroke="#72f1b8"/>
    <text class="badge-num c-green" x="768" y="66">6</text>
    <!-- Memo with checkmark icon -->
    <g transform="translate(800, 112)">
      <rect x="-12" y="-15" width="24" height="30" rx="2" fill="none" stroke="#72f1b8" stroke-width="1.3"/>
      <line x1="-6" y1="-8" x2="6" y2="-8" stroke="#72f1b8" stroke-width="1.1"/>
      <line x1="-6" y1="-2" x2="6" y2="-2" stroke="#72f1b8" stroke-width="0.8" opacity="0.5"/>
      <line x1="-6" y1="3" x2="2" y2="3" stroke="#72f1b8" stroke-width="0.8" opacity="0.5"/>
      <path d="M0,7 L4,11 L10,3" fill="none" stroke="#72f1b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="title c-green" x="800" y="160">Memo</text>
    <text class="subtitle" x="800" y="175">Structured output</text>
    <text class="subtitle" x="800" y="186">w/ recommendations</text>
  </g>

  <!-- ── Bottom decorative summary ── -->
  <line x1="80" y1="258" x2="820" y2="258" stroke="#1a1a3a" stroke-width="0.5" opacity="0.5"/>
  <text class="subtitle" x="450" y="274" style="font-size:7px; letter-spacing:2px; fill:#555577;">BRIEF &#x2009;&#x2192;&#x2009; FRAME &#x2009;&#x2192;&#x2009; DEBATE &#x2009;&#x2192;&#x2009; CHECK &#x2009;&#x2192;&#x2009; CLOSE &#x2009;&#x2192;&#x2009; DELIVER</text>

</svg>