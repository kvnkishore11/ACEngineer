[project]
name = "live-bench-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pydantic>=2.7",
    "live-bench-server",
]

[project.scripts]
live-bench = "live_bench_cli.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
live-bench-server = { path = "../backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_bench_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
