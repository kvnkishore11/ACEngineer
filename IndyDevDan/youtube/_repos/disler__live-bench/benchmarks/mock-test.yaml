# benchmarks/mock-test.yaml
# Minimal test benchmark — 1 chart, 2 groups, 2 metrics.
# Used for quick validation of UI features (tooltips, modals, animations).
version: 1
benchmark:
  session_id: mock-test
  title: "Mock Test"
  subtitle: "Quick validation benchmark with fake data"
  tags:
    - { name: "Model A", icons: ["/icons/alibaba.svg"] }
    - { name: "Model B", icons: ["/icons/google.svg"] }
  charts:
    - chart_id: speed
      title: "Speed"
      subtitle: "higher is better"
      better: higher
      direction: BT
      x: { label: "Question" }
      y: { label: "Speed", unit: "tok/s", min: 0 }
      groups:
        - { key: q1, label: "Q1 greeting" }
        - { key: q2, label: "Q2 coding" }
      metrics:
        - { key: model_a, label: "Model A", color: "#f59e0b", icon: "/icons/alibaba.svg" }
        - { key: model_b, label: "Model B", color: "#3b82f6", icon: "/icons/google.svg" }
